name: Bibliothek-Cover laden
on:
  workflow_dispatch:
  push:
    paths: ["bibliothek/covers/quellen.json", "tools/covers.py"]
permissions:
  contents: write
jobs:
  covers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install pillow
      - run: python tools/covers.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add bibliothek/covers
          git diff --cached --quiet || git commit -m "Bibliothek: Cover geladen"
          git push
