<body>
<title>GAUSS Bibliothek</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/*
 * GAUSS Bibliothek — Anwendung im GAUSS-Designsystem.
 * Grundlage GAUSS: Neutralskala Hue 265 (Tinte nie Schwarz), nur Funnel Sans (400/500/600), Rollenradien, KERN-Status.
 * Ausprägung Unternehmen (Arbeitgeber): Markenskala Magenta, --marke-hue 345 statt Orange 50.
 * Zustandsregel: Hover = neutrales Overlay; Umschalter = Ort-Leiter; Marke nur bei gewählten Steuerelementen,
 * Fokus, Zähler und Links im Fließtext. Primäraktion = Tinte. Warnung = Amber.
 * Layout: eine Spalte, Seitentitel, sticky Suche/Umschalter, Widget Typ A (Titel außen, weiße Karte), Detail als Sheet.
 * Werte 1:1 aus src/styles.css des Lovable-Prototyps (Stand 25.10.2026).
 */
:root{
  --font-ui:"Funnel Sans",-apple-system,BlinkMacSystemFont,system-ui,"Segoe UI",Roboto,sans-serif;

  --neutral-0:oklch(1 0 0);
  --neutral-50:oklch(0.985 0.004 265);
  --neutral-100:oklch(0.965 0.007 265);
  --neutral-200:oklch(0.92 0.01 265);
  --neutral-300:oklch(0.85 0.014 265);
  --neutral-400:oklch(0.71 0.02 265);
  --neutral-500:oklch(0.58 0.028 265);
  --neutral-600:oklch(0.48 0.038 265);
  --neutral-700:oklch(0.4 0.048 265);
  --neutral-800:oklch(0.34 0.035 265);
  --neutral-900:oklch(0.27 0.04 265);
  --neutral-950:oklch(0.22 0.045 265);

  /* Ausprägung Unternehmen: Magenta */
  --marke-hue:345;
  --marke-050:oklch(0.97 0.016 var(--marke-hue));
  --marke-100:oklch(0.94 0.033 var(--marke-hue));
  --marke-200:oklch(0.89 0.064 var(--marke-hue));
  --marke-300:oklch(0.82 0.11 var(--marke-hue));
  --marke-400:oklch(0.75 0.148 var(--marke-hue));
  --marke-500:oklch(0.68 0.163 var(--marke-hue));
  --marke-600:oklch(0.6 0.153 var(--marke-hue));
  --marke-700:oklch(0.52 0.136 var(--marke-hue));

  --status-fehler-text:oklch(0.5 0.18 25);   --status-fehler-flaeche:oklch(0.965 0.02 25);
  --status-erfolg-text:oklch(0.47 0.11 150); --status-erfolg-flaeche:oklch(0.965 0.03 150);
  --status-info-text:oklch(0.48 0.14 250);   --status-info-flaeche:oklch(0.965 0.02 250);
  --status-warnung-text:oklch(0.5 0.105 85); --status-warnung-flaeche:oklch(0.97 0.055 92);

  --background:var(--neutral-50);
  --leiste:var(--neutral-100);
  --rahmenflaeche:var(--neutral-50);
  --objekt:var(--neutral-0);
  --erhoeht:var(--neutral-200);
  --tastenflaeche:var(--neutral-100);
  --popover:var(--neutral-0);
  --linie:var(--neutral-200);
  --rahmen:var(--neutral-500);
  /* Hell: Texttinte leichter und blauer als neutral-950 (Hue 262, mehr Chroma); Kontraste auf Weiß ≈ 11:1 / 7:1 / 5,3:1 */
  --tinte-text:oklch(0.31 0.072 262);
  --foreground:var(--tinte-text);
  --text-sekundaer:oklch(0.45 0.062 262);
  --tertiaer:oklch(0.52 0.05 262);
  --deaktiviert:var(--neutral-400);
  --primary:var(--tinte-text);
  --primary-foreground:var(--neutral-0);
  --hover:color-mix(in oklab,var(--neutral-950) 6%,transparent);
  --pressed:color-mix(in oklab,var(--neutral-950) 10%,transparent);
  --ort-aktiv:var(--neutral-300);
  --gewaehlt:var(--marke-600);
  /* Gewählt mit Text (Chips): Magenta 600 + Weiß < 4,5:1 → Stufe 700 hell, im Dunkeln helle Fläche mit Tinte */
  --gewaehlt-text-flaeche:var(--marke-700);
  --gewaehlt-text-farbe:var(--neutral-0);
  --gewaehlt-text:var(--neutral-0);
  --zaehler:var(--marke-600);
  --fokus:var(--marke-700);
  --fokus-innen:var(--neutral-0);
  --link:var(--marke-700);
  --logo:var(--tinte-text);
  --logo-marke:var(--marke-600);
  --logo-marke-schatten:var(--marke-700);
  --popup-backdrop:color-mix(in oklab,var(--neutral-950) 20%,transparent);
  --schatten-farbe:var(--neutral-950);
  --schatten-widget:0 1px 2px color-mix(in oklab,var(--neutral-950) 6%,transparent),0 6px 16px -8px color-mix(in oklab,var(--neutral-950) 18%,transparent);
  --schatten-hoch:0 20px 48px -16px color-mix(in oklab,var(--schatten-farbe) 16%,transparent),0 4px 14px -8px color-mix(in oklab,var(--schatten-farbe) 8%,transparent);

  /* Cover: nur Neutralskala, Bauhaus-Form als Unterscheidung */
  --cover-a:var(--neutral-950); --cover-a-t:var(--neutral-50);
  --cover-b:var(--neutral-700); --cover-b-t:var(--neutral-0);
  --cover-c:var(--neutral-200); --cover-c-t:var(--neutral-950);
  --cover-d:var(--neutral-100); --cover-d-t:var(--neutral-950);

  --inhalt:680px;
  --radius-aktion:999px; --radius-zeile:8px; --radius-block:12px; --radius-karte:16px; --radius-flaeche:20px;
  --hoehe-touchziel:44px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --dunkel-seite:oklch(0.16 0.028 265); --dunkel-karte:oklch(0.20 0.03 265); --dunkel-erhoeht:oklch(0.245 0.032 265); --dunkel-linie:oklch(0.29 0.03 265);
  --status-fehler-text:oklch(0.78 0.13 25);   --status-fehler-flaeche:oklch(0.29 0.06 25);
  --status-erfolg-text:oklch(0.78 0.12 150);  --status-erfolg-flaeche:oklch(0.28 0.05 150);
  --status-info-text:oklch(0.78 0.11 250);    --status-info-flaeche:oklch(0.29 0.06 250);
  --status-warnung-text:oklch(0.85 0.13 88);  --status-warnung-flaeche:oklch(0.3 0.06 85);
  --background:var(--dunkel-seite); --leiste:var(--dunkel-seite); --rahmenflaeche:var(--dunkel-seite);
  --objekt:var(--dunkel-karte); --erhoeht:var(--dunkel-erhoeht); --tastenflaeche:var(--dunkel-erhoeht); --popover:var(--dunkel-karte);
  --linie:var(--dunkel-linie); --rahmen:var(--neutral-400);
  --foreground:var(--neutral-50); --text-sekundaer:var(--neutral-300); --tertiaer:var(--neutral-300); --deaktiviert:var(--neutral-600);
  --primary:var(--neutral-50); --primary-foreground:var(--neutral-950);
  --hover:color-mix(in oklab,white 8%,transparent); --pressed:color-mix(in oklab,white 10%,transparent);
  --ort-aktiv:var(--dunkel-erhoeht); --gewaehlt:var(--marke-500); --zaehler:var(--marke-500); --gewaehlt-text-flaeche:var(--marke-300); --gewaehlt-text-farbe:var(--neutral-950);
  --fokus:var(--marke-400); --fokus-innen:var(--neutral-950); --link:var(--marke-300); --logo:var(--neutral-50); --logo-marke:var(--marke-400); --logo-marke-schatten:var(--marke-600);
  --popup-backdrop:color-mix(in oklab,var(--neutral-950) 55%,transparent);
  --schatten-farbe:oklch(0.1 0.03 270);
  --schatten-widget:0 1px 2px color-mix(in oklab,black 30%,transparent),0 8px 20px -10px color-mix(in oklab,black 55%,transparent);
  --schatten-hoch:0 24px 56px -18px color-mix(in oklab,var(--schatten-farbe) 65%,transparent),0 4px 16px -8px color-mix(in oklab,var(--schatten-farbe) 40%,transparent);
  --cover-a:var(--neutral-50); --cover-a-t:var(--neutral-950);
  --cover-b:var(--neutral-400); --cover-b-t:var(--neutral-950);
  --cover-c:var(--neutral-800); --cover-c-t:var(--neutral-50);
  --cover-d:var(--dunkel-erhoeht); --cover-d-t:var(--neutral-50);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --dunkel-seite:oklch(0.16 0.028 265); --dunkel-karte:oklch(0.20 0.03 265); --dunkel-erhoeht:oklch(0.245 0.032 265); --dunkel-linie:oklch(0.29 0.03 265);
  --status-fehler-text:oklch(0.78 0.13 25);   --status-fehler-flaeche:oklch(0.29 0.06 25);
  --status-erfolg-text:oklch(0.78 0.12 150);  --status-erfolg-flaeche:oklch(0.28 0.05 150);
  --status-info-text:oklch(0.78 0.11 250);    --status-info-flaeche:oklch(0.29 0.06 250);
  --status-warnung-text:oklch(0.85 0.13 88);  --status-warnung-flaeche:oklch(0.3 0.06 85);
  --background:var(--dunkel-seite); --leiste:var(--dunkel-seite); --rahmenflaeche:var(--dunkel-seite);
  --objekt:var(--dunkel-karte); --erhoeht:var(--dunkel-erhoeht); --tastenflaeche:var(--dunkel-erhoeht); --popover:var(--dunkel-karte);
  --linie:var(--dunkel-linie); --rahmen:var(--neutral-400);
  --foreground:var(--neutral-50); --text-sekundaer:var(--neutral-300); --tertiaer:var(--neutral-300); --deaktiviert:var(--neutral-600);
  --primary:var(--neutral-50); --primary-foreground:var(--neutral-950);
  --hover:color-mix(in oklab,white 8%,transparent); --pressed:color-mix(in oklab,white 10%,transparent);
  --ort-aktiv:var(--dunkel-erhoeht); --gewaehlt:var(--marke-500); --zaehler:var(--marke-500); --gewaehlt-text-flaeche:var(--marke-300); --gewaehlt-text-farbe:var(--neutral-950);
  --fokus:var(--marke-400); --fokus-innen:var(--neutral-950); --link:var(--marke-300); --logo:var(--neutral-50); --logo-marke:var(--marke-400); --logo-marke-schatten:var(--marke-600);
  --popup-backdrop:color-mix(in oklab,var(--neutral-950) 55%,transparent);
  --schatten-farbe:oklch(0.1 0.03 270);
  --schatten-widget:0 1px 2px color-mix(in oklab,black 30%,transparent),0 8px 20px -10px color-mix(in oklab,black 55%,transparent);
  --schatten-hoch:0 24px 56px -18px color-mix(in oklab,var(--schatten-farbe) 65%,transparent),0 4px 16px -8px color-mix(in oklab,var(--schatten-farbe) 40%,transparent);
  --cover-a:var(--neutral-50); --cover-a-t:var(--neutral-950);
  --cover-b:var(--neutral-400); --cover-b-t:var(--neutral-950);
  --cover-c:var(--neutral-800); --cover-c-t:var(--neutral-50);
  --cover-d:var(--dunkel-erhoeht); --cover-d-t:var(--neutral-50);
  color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--background);color:var(--foreground);font-family:var(--font-ui);font-size:15px;line-height:22px;letter-spacing:-.0025em;
  font-feature-settings:"cv01","cv09","ss03","calt","liga";-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--rahmenflaeche)}
::selection{background:color-mix(in oklab,var(--marke-500) 28%,transparent)}
button,input,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--fokus);outline-offset:2px;box-shadow:0 0 0 2px var(--fokus-innen)}
.wrap{max-width:var(--inhalt);margin:0 auto;padding-block:16px 48px}

/* Rollen-Typografie */
.etikett{font-size:11px;line-height:16px;font-weight:500;text-transform:uppercase;letter-spacing:.04em;color:var(--tertiaer)}
.titel-seite{font-size:28px;line-height:36px;font-weight:600;letter-spacing:-.02em;margin:0;text-wrap:balance}
.titel-bereich{font-size:17px;line-height:24px;font-weight:600;letter-spacing:-.016em;margin:0}
.titel-karte{font-size:16px;line-height:22px;font-weight:600;letter-spacing:-.012em;margin:0}
.meta{font-size:13px;line-height:20px;color:var(--text-sekundaer)}
.zahl{font-variant-numeric:tabular-nums}

/* Kopf */
.kopf{display:flex;align-items:center;gap:10px;margin-bottom:20px}
.kopf .merk-taste{margin-left:auto}
.merk-taste{position:relative;width:44px;height:44px;flex:none}
.merk-taste.klein{width:40px;height:40px}
.minikopf .innen-kopf .merk-taste{margin-right:-4px}
.zaehler-zahl{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--gewaehlt-text-flaeche);color:var(--gewaehlt-text-farbe);
  font-size:11px;line-height:18px;font-weight:600;text-align:center;font-variant-numeric:tabular-nums;box-shadow:0 0 0 2px var(--rahmenflaeche)}
.zeichen{width:28px;height:28px;color:var(--logo);flex:none}
.kopf .etikett{margin:0}
.seitenkopf{display:grid;gap:4px}

/* Sticky Leiste: Rahmenfläche, Linie erst beim Scrollen */
.leiste{position:relative;z-index:5;background:var(--rahmenflaeche);
  margin:16px calc(-1 * max(16px,env(safe-area-inset-left,0px))) 0;
  padding:10px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));
  display:grid;gap:10px;border-bottom:1px solid transparent;transition:border-color 120ms ease}
.leiste.schwebend{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 57px);margin:0;z-index:8;
  padding-left:max(16px,env(safe-area-inset-left,0px),calc((100% - var(--inhalt)) / 2));padding-right:max(16px,env(safe-area-inset-right,0px),calc((100% - var(--inhalt)) / 2));
  border-bottom-color:var(--linie);box-shadow:var(--schatten-hoch);animation:panel-ein 240ms cubic-bezier(.22,1,.36,1) both}
.leiste.schwebend .filter{margin-right:calc(-1 * max(16px,env(safe-area-inset-right,0px),calc((100vw - var(--inhalt)) / 2)));padding-right:max(16px,env(safe-area-inset-right,0px),calc((100vw - var(--inhalt)) / 2))}
@keyframes panel-ein{from{opacity:0;translate:0 -12px}to{opacity:1;translate:0 0}}

/* Mini-Kopf beim Scrollen: Zeichen links, Suche/Filter über runde Icon-Taste rechts */
.minikopf{position:fixed;left:0;right:0;top:0;z-index:9;background:var(--rahmenflaeche);border-bottom:1px solid var(--linie);
  padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-right,0px),calc((100% - var(--inhalt)) / 2)) 0 max(16px,env(safe-area-inset-left,0px),calc((100% - var(--inhalt)) / 2));
  transform:translateY(-100%);transition:transform 160ms ease-out;visibility:hidden}
.minikopf.on{transform:none;visibility:visible}
.minikopf .innen-kopf{height:56px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.minikopf .zeichen{width:24px;height:24px}
.titel-app{font-size:34px;line-height:40px;letter-spacing:-.025em}
.minikopf .kopf-titel{display:flex;align-items:center;gap:10px;font-size:17px;line-height:24px;font-weight:500;letter-spacing:-.016em;margin:0 auto 0 8px}
.minikopf .kopf-titel::before{content:"";width:2px;height:20px;border-radius:1px;background:color-mix(in oklab,var(--foreground) 22%,transparent)}
.icon-taste.frei{position:relative;width:40px;height:40px}
.icon-taste.frei::after{content:"";position:absolute;inset:-2px}
.icon-taste.frei svg{transition:transform 160ms ease-out}
.icon-taste.frei[aria-expanded="true"] svg{transform:rotate(180deg)}
.icon-taste.frei[aria-expanded="true"]{background-color:var(--ort-aktiv)}
.mini-filter{width:auto!important;display:inline-flex!important;align-items:center;gap:6px;padding:0 12px 0 16px;font-size:14px;font-weight:500}
.mini-filter .punkt{top:4px;right:4px}
.punkt{position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--zaehler);box-shadow:0 0 0 2px var(--objekt)}
.suche{position:relative}
.suche svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--tertiaer);pointer-events:none}
.suche input{width:100%;height:44px;border:1px solid var(--linie);border-radius:var(--radius-aktion);background:var(--objekt);
  padding:0 44px 0 42px;font-size:16px;outline-offset:2px;transition:border-color 120ms ease}
.suche input::placeholder{color:var(--tertiaer)}
.suche input:hover{border-color:var(--rahmen)}
.suche input::-webkit-search-cancel-button{display:none}
.leeren{position:absolute;right:0;top:50%;transform:translateY(-50%);width:44px;height:44px;border:0;border-radius:var(--radius-aktion);background:transparent;color:var(--tertiaer);display:grid;place-items:center}
.leeren:hover{background-image:linear-gradient(var(--hover),var(--hover))}

/* Umschalter = Ort-Leiter */
.umschalter-alt{display:grid;grid-template-columns:repeat(3,1fr);background:var(--leiste);border:1px solid var(--linie);border-radius:var(--radius-aktion);padding:3px;gap:2px}
.umschalter button{border:0;background:transparent;border-radius:var(--radius-aktion);min-height:38px;font-size:14px;font-weight:500;color:var(--text-sekundaer);
  display:flex;align-items:center;justify-content:center;gap:6px}
.umschalter button:hover{background-image:linear-gradient(var(--hover),var(--hover))}
.umschalter button[aria-pressed="true"]{background-color:var(--ort-aktiv);color:var(--foreground);font-weight:600}
.umschalter .zahl{color:var(--tertiaer);font-weight:500}
.umschalter button[aria-pressed="true"] .zahl{color:var(--text-sekundaer)}

/* Themen-Filter = Toggle: gewählt in Marke */
.leiste{grid-template-columns:minmax(0,1fr)}
.filterzeile{display:flex;align-items:center;gap:8px;min-width:0}
.filter-taste{width:44px!important;height:44px!important;flex:none}
.filter-taste[data-aktiv]{background-color:var(--ort-aktiv)}
.filter{flex:1;min-width:0;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-right:calc(-1 * max(16px,env(safe-area-inset-right,0px)));padding:4px max(16px,env(safe-area-inset-right,0px)) 4px 0;
  -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 10px);mask-image:linear-gradient(90deg,transparent 0,#000 10px);padding-left:10px;margin-left:-10px}
.filter::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;min-height:36px;padding:0 14px;border-radius:var(--radius-aktion);border:1px solid var(--linie);
  background:var(--objekt);color:var(--text-sekundaer);font-size:13px;font-weight:500;white-space:nowrap;position:relative}
.chip::after{content:"";position:absolute;inset:-4px 0}
.chip:hover{background-image:linear-gradient(var(--hover),var(--hover))}
.chip[aria-pressed="true"]{background-color:var(--gewaehlt-text-flaeche);border-color:var(--gewaehlt-text-flaeche);color:var(--gewaehlt-text-farbe);font-weight:600}

/* Widget Typ A: Titel außen, Karte weiß */
.bereich{margin-top:20px;display:grid;gap:10px}
.bereich>header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-inline:4px}
.karte{background:var(--objekt);border:1px solid var(--linie);border-radius:var(--radius-karte);box-shadow:var(--schatten-widget);overflow:hidden}
.zeile{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:14px;align-items:center;width:100%;text-align:left;border:0;background:transparent;
  padding:12px 16px;min-height:88px;position:relative;transition:background-color 120ms ease}
.zeile+.zeile{box-shadow:inset 0 1px 0 var(--linie)}
.zeile:hover{background-image:linear-gradient(var(--hover),var(--hover))}
.zeile:active{background-image:linear-gradient(var(--pressed),var(--pressed))}
.zeile .info{min-width:0;display:grid;gap:2px}
.zeile .t{font-size:16px;line-height:22px;font-weight:600;letter-spacing:-.012em}
.zeile .t,.zeile .info>.meta{overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;hyphens:auto}
.zeile .rechts{display:flex;align-items:center;gap:10px}

/* Cover: typografische Tafel, nur Neutral */
.cover{--c:var(--cover-a);--t:var(--cover-a-t);aspect-ratio:2/3;width:100%;max-width:100%;border-radius:var(--radius-zeile);background:var(--c);color:var(--t);
  position:relative;overflow:hidden;box-shadow:inset 0 0 0 1px color-mix(in oklab,var(--foreground) 8%,transparent);
  display:flex;flex-direction:column;justify-content:space-between;padding:9% 10% 10%}
.cover .form{position:absolute;right:-12%;bottom:-8%;width:62%;aspect-ratio:1;background:currentColor;opacity:.14}
.cover .form.kreis{border-radius:50%}
.cover .form.halb{border-radius:999px 999px 0 0;aspect-ratio:2/1;width:78%;right:-6%;bottom:0}
.cover .form.balken{width:20%;aspect-ratio:auto;top:0;bottom:0;right:14%}
.cover .ct{font-weight:600;line-height:1.06;letter-spacing:-.02em;overflow:hidden;word-break:break-word;hyphens:auto;position:relative}
.cover .ca{font-weight:500;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;position:relative}
.zeile .cover .ct{font-size:6.5px}.zeile .cover .ca{font-size:5px}
.gross .cover{border-radius:var(--radius-block)}
.gross .cover .ct{font-size:14px}.gross .cover .ca{font-size:9px}
.cover-bild{position:absolute;inset:0;display:block;width:100%;height:100%;object-fit:cover;background:var(--erhoeht)}
.quellen{margin:0 4px;display:grid;gap:4px;font-size:13px;line-height:20px;color:var(--tertiaer)}
.quellen p{margin:0}
.quellen a{color:var(--link);text-underline-offset:2px}

/* Badge: Statuspille mit Punkt */
.badge{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:var(--radius-aktion);font-size:12px;line-height:18px;font-weight:500;white-space:nowrap;
  border:1px solid color-mix(in oklab,currentColor 30%,transparent)}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.badge.st-erfolg{background:var(--status-erfolg-flaeche);color:var(--status-erfolg-text)}
.badge.st-info{background:var(--status-info-flaeche);color:var(--status-info-text)}
.badge.st-warnung{background:var(--status-warnung-flaeche);color:var(--status-warnung-text)}
.badge.st-fehler{background:var(--status-fehler-flaeche);color:var(--status-fehler-text)}

.leer{padding:40px 24px;text-align:center}
.leer .titel-karte{margin-bottom:4px}
.leer-aktionen{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px}
.leer-aktionen:empty{display:none}
mark{background:var(--marke-200);color:inherit;border-radius:3px;padding:0 1px}
:root[data-theme="dark"] mark{background:color-mix(in oklab,var(--marke-500) 30%,transparent)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) mark{background:color-mix(in oklab,var(--marke-500) 30%,transparent)}}
.hinweis{margin:16px 4px 0;font-size:13px;line-height:20px;color:var(--tertiaer);text-wrap:balance}
.vorschau{display:flex;gap:10px;align-items:flex-start;margin-top:16px;padding:12px 14px;border-radius:var(--radius-block);
  background:var(--status-info-flaeche);border:1px solid color-mix(in oklab,var(--status-info-text) 40%,var(--status-info-flaeche));color:var(--foreground);font-size:13px;line-height:20px}
.vorschau svg{flex:none;width:18px;height:18px;color:var(--status-info-text);margin-top:1px}

/* Sheet von unten, 240 ms */
.backdrop{position:fixed;inset:0;background:var(--popup-backdrop);z-index:20;opacity:0;transition:opacity 240ms cubic-bezier(.22,1,.36,1)}
.backdrop.on{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--background);border-radius:var(--radius-flaeche) var(--radius-flaeche) 0 0;
  box-shadow:var(--schatten-hoch);max-height:calc(100% - env(safe-area-inset-top,0px) - 20px);overflow-y:auto;overscroll-behavior:contain;
  transform:translateY(100%);transition:transform 240ms cubic-bezier(.22,1,.36,1);
  padding:0 max(16px,env(safe-area-inset-right,0px)) calc(28px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet.on{transform:none}
@media (min-width:720px){.sheet{left:50%;width:640px;margin-left:-320px}}
/* Desktop: breitere Fläche, Bestand zweispaltig, Karussells als Raster, Chips umbrechen */
@media (min-width:1024px){
  :root{--inhalt:1040px}
  .wrap{padding-block:32px 64px}
  .titel-seite{font-size:32px;line-height:40px}
  .titel-app{font-size:40px;line-height:48px}
  .leiste{grid-template-columns:minmax(0,1fr);max-width:none}
  .filter{flex-wrap:wrap;overflow:visible;-webkit-mask-image:none;mask-image:none;margin-right:0;padding-right:0}
  .karussell{flex-wrap:wrap;overflow:visible;margin:0;padding:2px 0 4px;scroll-snap-type:none}
  .karussell li{width:calc((100% - 5 * 12px) / 6)}
  #liste{display:grid;grid-template-columns:1fr 1fr}
  #liste .zeile+.zeile{box-shadow:none}
  #liste .zeile{box-shadow:inset 0 -1px 0 var(--linie)}
  #liste .zeile:nth-child(odd){box-shadow:inset -1px -1px 0 var(--linie)}
  #liste .leer{grid-column:1/-1}
  .sheet{width:720px;margin-left:-360px}
}
/* Kleine Phones */

  .titel-app{font-size:30px;line-height:36px}

  .k-feld{width:46px;height:52px}

  .schalter-paar{gap:6px}

}

  if (!l) return { key:"free", label:"Verfügbar", cls:"st-erfolg" };
  const d = days(l.dueAt);
  if (d < 0) return { key:"out", label:"Überfällig", cls:"st-fehler", loan:l };
  if (d <= 3) return { key:"out", label:"Bald fällig", cls:"st-warnung", loan:l };
  return { key:"out", label:"Verliehen", cls:"st-info", loan:l };
}

const TONES = ["a","b","c","d"], FORMS = ["kreis","halb","balken","quadrat"];
function hash(s){ let h = 0; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) >>> 0; return h; }
function olCover(b){ const isbn = String(b.isbn || "").replace(/[^0-9X]/gi, ""); return isbn ? `https://covers.openlibrary.org/b/isbn/${isbn}-M.jpg?default=false` : ""; }

}
function coverFehler(img){ const alt = img.dataset.alt; if (alt){ delete img.dataset.alt; img.src = alt; } else img.remove(); }
function cover(b){
  const h = hash(b.id || b.titel), t = TONES[h % 4], f = FORMS[(h >> 3) % 4];
  const last = (b.autor || "").split(",")[0].trim().split(" ").pop(), u = coverUrl(b), alt = !b.coverVorschau && b.cover ? olCover(b) : "";

/* ===== Medien: verkleinern, hochladen, anzeigen ===== */
const ladeBild = src => new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error("Bild konnte nicht gelesen werden.")); i.src = src; });
const alsDataUrl = datei => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(r.error); r.readAsDataURL(datei); });
async function verkleinern(quelle, max, q = .82){
  const url = typeof quelle === "string" ? quelle : URL.createObjectURL(quelle);
  try {
    const img = await ladeBild(url), s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement("canvas"); c.width = Math.round(img.naturalWidth * s); c.height = Math.round(img.naturalHeight * s);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    return c.toDataURL("image/jpeg", q);
  } finally { if (typeof quelle !== "string") URL.revokeObjectURL(url); }
}
async function hochladen(quelle, zweck, typ = "bild", mime = "image/jpeg"){
  let dataUrl, thumbUrl;
  if (typ === "video"){
    const max = Store.mode === "local" ? 4 : CONFIG.MAX_VIDEO_MB;
    if (quelle.size > max * 1048576) throw new Error(`Das Video ist zu groß (höchstens ${max} MB).`);
    dataUrl = await alsDataUrl(quelle); mime = quelle.type || "video/mp4";
  } else {
    dataUrl = await verkleinern(quelle, Store.mode === "local" ? 900 : 1600, Store.mode === "local" ? .72 : .84);
    if (Store.mode === "local") thumbUrl = await verkleinern(dataUrl, 320, .75);
  }
  const p = { action: "upload", zweck, typ, mime, pin: S.admin || undefined, data: dataUrl.split(",")[1] };
  if (Store.mode === "local") Object.assign(p, { dataUrl, thumbUrl });
  return (await call(p)).medium;
}

/* ===== Liste, Empfohlen, Filter ===== */
/* Suche: Umlaute egal (ä = ae = a), Tippfehler bis 1 Zeichen, Wortanfänge zählen mehr,
   Titel vor Autor:in vor Thema vor übrigen Angaben. Alle Suchwörter müssen passen. */
const falte = s => norm(s).replace(/ae/g, "a").replace(/oe/g, "o").replace(/ue/g, "u").replace(/ß/g, "ss");
function lev(a, b){
  if (Math.abs(a.length - b.length) > 1) return 2;
  return levFrei(a, b);
}
const suchWoerter = q => falte(q).split(/[^a-z0-9]+/).filter(Boolean);
function suchFelder(b){
  const l = openLoan(b.id);
  return [
    [falte(b.titel), 6], [falte(b.autor), 5], [falte(b.untertitel || ""), 3], [falte((b.themen || []).join(" ")), 3],
    [falte([b.verlag, String(b.isbn || "").replace(/\D/g, ""), b.jahr, b.sprache, b.standort, b.eigentum, l && l.kuerzel].join(" ")), 2],
    [falte([b.beschreibung, ...bewertungen(b.id).map(r => r.kommentar)].join(" ")), 1]
  ];
}
function wortWert(w, text){
  if (!text) return 0;
  const teile = text.split(/[^a-z0-9]+/).filter(Boolean);
  if (teile.includes(w)) return 1;
  if (teile.some(t => t.startsWith(w))) return .9;
  if (text.includes(w)) return .7;
  if (w.length >= 4 && teile.some(t => lev(t, w) <= 1 || (t.length > w.length && lev(t.slice(0, w.length), w) <= 1))) return .45;
  return 0;
}
function suchWert(b, woerter){
  const felder = suchFelder(b); let summe = 0;
  for (const w of woerter){
    let best = 0; for (const [text, g] of felder) best = Math.max(best, g * wortWert(w, text));
    if (!best) return 0; summe += best;
  }
  return summe;
}
/* Filter: Themen und Sprachen = eines davon; Status, Mindestbewertung; Sortierung separat */
const STATUS_WAHL = [["alle", "Alle"], ["frei", "Verfügbar"], ["verliehen", "Verliehen"], ["ueberfaellig", "Überfällig"], ["gemerkt", "Gemerkt"]];
const STERNE_WAHL = [[0, "Alle"], [3, "ab 3 ★"], [4, "ab 4 ★"], [5, "5 ★"]];
const SORT_WAHL = [["relevanz", "Relevanz"], ["titel", "Titel A–Z"], ["autor", "Autor:in A–Z"], ["jahr", "Neueste zuerst"], ["bewertung", "Beste Bewertung"], ["verfuegbar", "Verfügbare zuerst"]];

  return st === "alle" || (st === "frei" && s.key === "free") || (st === "verliehen" && s.key === "out") || (st === "ueberfaellig" && s.cls === "st-fehler") || (st === "gemerkt" && gemerkt(b.id));
}
function passtFilter(b, ohne){
  const f = S.f;
  if (ohne !== "themen" && f.themen.length && !f.themen.some(t => (b.themen || []).includes(t))) return false;
  if (ohne !== "sprachen" && f.sprachen.length && !f.sprachen.includes(b.sprache || "Ohne Angabe")) return false;
  if (ohne !== "sterne" && f.minSterne){ const r = schnitt(b.id); if (!r || r.wert < f.minSterne - 1e-9) return false; }
  return ohne === "status" || passtStatus(b, f.status);
}
const panelFilter = () => (S.f.status !== "alle") + S.f.sprachen.length + (S.f.minSterne > 0) + (S.f.sort !== "relevanz");
const filterAktiv = () => !!(S.q || S.f.status !== "alle" || S.f.themen.length || S.f.sprachen.length || S.f.minSterne);
function sortiere(liste, woerter){
  const t = (a, b) => a.titel.localeCompare(b.titel, "de"), sort = S.f.sort;
  const cmp = {
    relevanz: (a, b) => (woerter.length ? b.w - a.w : 0) || t(a.b, b.b),
    titel: (a, b) => t(a.b, b.b),
    autor: (a, b) => (a.b.autor || "").localeCompare(b.b.autor || "", "de") || t(a.b, b.b),
    jahr: (a, b) => (Number(b.b.jahr) || 0) - (Number(a.b.jahr) || 0) || t(a.b, b.b),
    bewertung: (a, b) => ((schnitt(b.b.id) || {}).wert || 0) - ((schnitt(a.b.id) || {}).wert || 0) || t(a.b, b.b),
    verfuegbar: (a, b) => (status(a.b.id).key === "free" ? 0 : 1) - (status(b.b.id).key === "free" ? 0 : 1) || t(a.b, b.b)
  }[sort] || ((a, b) => t(a.b, b.b));
  return liste.sort(cmp);

/* Hervorhebung: markiert exakte Fundstellen, akzentunabhängig, ohne den Text zu verändern */
function markiere(text, woerter){
  const t = String(text || ""); if (!woerter.length || !t) return esc(t);
  const zeichen = [...t], flach = zeichen.map(c => norm(c) || c).join("");
  if (flach.length !== zeichen.length) return esc(t);
  const marken = new Array(zeichen.length).fill(false);
  for (const w of woerter){ if (w.length < 2) continue; let i = flach.indexOf(w); while (i >= 0){ marken.fill(true, i, i + w.length); i = flach.indexOf(w, i + 1); } }
  let out = "", offen = false;
  zeichen.forEach((c, i) => { if (marken[i] !== offen){ out += marken[i] ? "<mark>" : "</mark>"; offen = marken[i]; } out += esc(c); });
  return out + (offen ? "</mark>" : "");
}
function vorschlag(woerter){
  const kandidaten = [...new Set(sichtbar().flatMap(b => [b.titel, b.autor, ...(b.themen || [])].join(" ").split(/[\s,:–-]+/)).filter(x => x.length >= 3))];
  let best = null, bd = 3;
  for (const w of woerter) for (const k of kandidaten){ const d = levFrei(falte(k), w); if (d < bd && d > 0){ bd = d; best = k; } }
  return best;
}
function levFrei(a, b){
  const m = Array.from({ length: a.length + 1 }, (_, i) => [i, ...new Array(b.length).fill(0)]);
  for (let j = 1; j <= b.length; j++) m[0][j] = j;
  for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++){
    m[i][j] = Math.min(m[i - 1][j] + 1, m[i][j - 1] + 1, m[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    if (i > 1 && j > 1 && a[i - 1] === b[j - 2] && a[i - 2] === b[j - 1]) m[i][j] = Math.min(m[i][j], m[i - 2][j - 2] + 1); /* Buchstabendreher */
  }
  return m[a.length][b.length];
}

  document.querySelectorAll(".merk-taste").forEach(t => {
    const z = t.querySelector(".zaehler-zahl"); z.hidden = !n; z.textContent = n > 99 ? "99+" : String(n);
    t.setAttribute("aria-label", n ? `Merkliste, ${n} ${n === 1 ? "Buch" : "Bücher"}` : "Merkliste, leer");
  });
}
function renderEmpfohlen(){
  renderMerkTasten();
  karussell("merkliste", merkliste().map(buchVon).filter(b => b && b.aktiv !== false));
  karussell("empfohlen", sichtbar().filter(b => b.empfohlen));
  const n = merkliste().filter(id => { const b = buchVon(id); return b && b.aktiv !== false; }).length;
  $("#merkliste-zahl").textContent = n ? String(n) : "";

function render(){
  const alle = sichtbar(), free = alle.filter(b => status(b.id).key === "free").length;
  $("#summary").textContent = S.geladen ? `${alle.length} Bücher · ${free} verfügbar` : "Bestand wird geladen …";
  renderIntro();
  if (!S.geladen){ $("#liste").innerHTML = `<div class="leer"><p class="meta" style="margin:0">Bestand wird geladen …</p></div>`; renderEmpfohlen(); return; }
  const woerter = suchWoerter(S.q);
  const items = sortiere(alle.filter(b => passtFilter(b)).map(b => ({ b, w: woerter.length ? suchWert(b, woerter) : 1 })).filter(x => x.w > 0), woerter).map(x => x.b);
  $("#liste-titel").textContent = woerter.length || filterAktiv() ? "Treffer" : "Bestand";
  $("#treffer").textContent = woerter.length || filterAktiv() ? `${items.length} ${items.length === 1 ? "Buch" : "Bücher"}` : items.length === alle.length ? "" : `${items.length} von ${alle.length}`;
  $("#liste").innerHTML = items.length ? items.map(b => {
    const s = status(b.id), r = schnitt(b.id);
    return `<button class="zeile" data-id="${esc(b.id)}">
      ${cover(b)}
      <span class="info"><span class="t">${markiere(b.titel, woerter)}</span><span class="meta">${markiere(b.autor, woerter)}</span>
        <span class="unten"><span class="badge ${s.cls}">${esc(s.label)}</span>${r ? `<span class="bewertet">${ICON.stern} ${komma(r.wert)} <span class="meta">(${r.anzahl})</span></span>` : ""}</span></span>
      <span class="rechts">${gemerkt(b.id) ? `<span class="merk-symbol" role="img" title="Gemerkt" aria-label="Gemerkt">${ICON.gemerkt}</span>` : ""}
      <svg class="chev" viewBox="0 0 7 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="m1 1 5 5-5 5"/></svg></span>
    </button>`;
  }).join("") : (() => {
    const v = woerter.length ? vorschlag(woerter) : null, filter = S.f.status !== "alle" || S.f.themen.length || S.f.sprachen.length || S.f.minSterne;
    return `<div class="leer"><p class="titel-karte">Nichts gefunden</p>
      <p class="meta" style="margin:0">${filter ? "Die Filter grenzen die Suche ein." : "Andere Schreibweise oder ein kürzeres Wort probieren."}</p>
      <div class="leer-aktionen">${v ? `<button class="taste sekundaer klein" data-vorschlag="${esc(v)}">Meintest du „${esc(v)}“?</button>` : ""}
      ${filter ? `<button class="taste sekundaer klein" data-zuruecksetzen>Filter zurücksetzen</button>` : ""}</div></div>`;
  })();
  $("#leeren").hidden = !S.q;
  $("#mini-punkt").hidden = !filterAktiv();
  renderEmpfohlen();
  if (["buch", "admin", "filter", "merkliste"].includes(S.view)) renderSheet();
}

/* ===== Sheet: Buch, Anmeldung, Verwaltung, Bearbeiten ===== */
function renderSheet(){
  if (S.view === "buch") renderBuch();
  else if (S.view === "login") renderLogin();
  else if (S.view === "admin") renderAdmin();
  else if (S.view === "edit") renderEdit();
  else if (S.view === "filter") renderFilterSheet();
  else if (S.view === "bewertung") renderBewertungEdit();
  else if (S.view === "merkliste") renderMerkSheet();
  else if (S.view === "info") renderInfo();
}
function renderMerkSheet(){
  const liste = merkliste().map(buchVon).filter(b => b && b.aktiv !== false);
  $("#detail").innerHTML = `
    <div class="seitenkopf"><h2 class="titel-seite" id="d-titel">Merkliste</h2><p class="meta" style="margin:0">Nur auf diesem Gerät gespeichert, ohne Anmeldung.</p></div>
    ${liste.length ? `<div class="karte">${liste.map(b => { const s = status(b.id); return `<div class="admin-zeile">
        <button class="admin-oeffnen" data-oeffne="${esc(b.id)}">${cover(b)}<span class="info"><span class="t">${esc(b.titel)}</span><span class="meta">${esc(b.autor)}</span><span><span class="badge ${s.cls}">${esc(s.label)}</span></span></span></button>

      : `<div class="karte innen"><p class="titel-karte" style="margin:0 0 4px">Noch nichts gemerkt</p><p class="meta" style="margin:0">Tippe in einem Buch auf „Merken“, dann erscheint es hier.</p></div>`}`;

function chipGruppe(name, wahl, istAn, zahl){
  return `<div class="filter-gruppe" role="group" aria-label="${esc(name)}">${wahl.map(([w, l]) => {
    const n = zahl ? zahl(w) : null;
    return `<button type="button" class="chip" data-fgruppe="${esc(name)}" data-fwert="${esc(w)}" aria-pressed="${istAn(w)}">${esc(l)}${n != null ? `<span class="zahl">${n}</span>` : ""}</button>`;
  }).join("")}</div>`;
}

  const f = S.f, alle = sichtbar();

  $("#detail").innerHTML = `
    <div class="seitenkopf"><h2 class="titel-seite" id="d-titel">Filter</h2><p class="meta" style="margin:0">Änderungen gelten sofort.</p></div>
    <section class="abschnitt"><h3 class="titel-bereich">Verfügbarkeit</h3><div class="karte innen">
      ${chipGruppe("status", STATUS_WAHL, w => f.status === w, w => zaehle("status")(b => passtStatus(b, w)))}</div></section>
    <section class="abschnitt"><h3 class="titel-bereich">Themen</h3><div class="karte innen">
      ${chipGruppe("themen", alleThemen().map(t => [t, t]), w => f.themen.includes(w), w => zaehle("themen")(b => (b.themen || []).includes(w)))}</div></section>
    <section class="abschnitt"><h3 class="titel-bereich">Sprache</h3><div class="karte innen">
      ${chipGruppe("sprachen", alleSprachen().map(t => [t, t]), w => f.sprachen.includes(w), w => zaehle("sprachen")(b => (b.sprache || "Ohne Angabe") === w))}</div></section>
    <section class="abschnitt"><h3 class="titel-bereich">Bewertung</h3><div class="karte innen">
      ${chipGruppe("sterne", STERNE_WAHL, w => f.minSterne === Number(w), w => zaehle("sterne")(b => !Number(w) || ((schnitt(b.id) || {}).wert || 0) >= Number(w) - 1e-9))}</div></section>
    <section class="abschnitt"><h3 class="titel-bereich">Sortierung</h3><div class="karte innen">
      ${chipGruppe("sort", SORT_WAHL, w => f.sort === w)}
      <p class="meta" style="margin:10px 0 0">„Relevanz“ sortiert bei einer Suche nach Trefferqualität, sonst nach Titel.</p></div></section>
    <div class="sheet-fuss">
      <button type="button" class="taste sekundaer" data-fzurueck ${panelFilter() || f.themen.length ? "" : "disabled"}>Zurücksetzen</button>
      <button type="button" class="taste primaer" data-fschliessen>${treffer} ${treffer === 1 ? "Buch" : "Bücher"} anzeigen</button>

function openSheet(view, id, push = true){
  if (view === "buch"){
    if (!buchVon(id)) return;
    const k = ls.get("bib.kuerzel", ""), eigene = S.ratings.find(r => r.bookId === id && r.kuerzel === k);
    S.entwurf = { sterne: eigene ? Number(eigene.sterne) : 0, kommentar: eigene ? eigene.kommentar || "" : "", kuerzel: k, medien: eigene ? [...(eigene.medien || [])] : [] };
    S.open = id; S.loeschFrage = null;
  }
  S.view = view; renderSheet();
  const sh = $("#sheet"), bd = $("#backdrop");
  if (sh.hidden){
    S.opener = document.activeElement;
    document.querySelectorAll("main, #minikopf").forEach(x => x.inert = true);
    sh.hidden = bd.hidden = false;
    requestAnimationFrame(() => requestAnimationFrame(() => { sh.classList.add("on"); bd.classList.add("on"); }));
    document.body.style.overflow = "hidden";
  }
  sh.scrollTop = 0;
  try { history.replaceState(null, "", view === "buch" ? "#b-" + id : location.pathname + location.search); } catch {}
  if (push) setTimeout(() => { const ziel = view === "login" ? $("#p0") : $("#schliessen"); if (ziel) ziel.focus({ preventScroll: true }); }, 60);
}
function wechsle(view){
  S.view = view; renderSheet(); $("#sheet").scrollTop = 0;
  const t = $("#d-titel"); if (t){ t.tabIndex = -1; t.focus({ preventScroll: true }); }
}
function closeSheet(){
  const sh = $("#sheet"), bd = $("#backdrop"), war = S.open;
  S.view = null; S.open = null; S.edit = null;
  sh.classList.remove("on"); bd.classList.remove("on"); document.body.style.overflow = "";
  document.querySelectorAll("main, #minikopf").forEach(x => x.inert = false);
  setTimeout(() => { if (!S.view) sh.hidden = bd.hidden = true; }, 240);
  try { history.replaceState(null, "", location.pathname + location.search); } catch {}
  const z = war && document.querySelector(`.zeile[data-id="${CSS.escape(war)}"]`);
  const ziel = S.opener && S.opener.isConnected && S.opener !== document.body ? S.opener : z;
  if (ziel) ziel.focus({ preventScroll: true }); S.opener = null;
}

function quellenHtml(b){
  const q = (b.quellen || []).filter(x => sicherUrl(x.url));
  const isbn = String(b.isbn || "").replace(/[^0-9X]/gi, "");
  if (isbn && !b.cover && !q.some(x => /openlibrary/.test(x.url))) q.push({ titel: "Open Library (Cover)", url: `https://openlibrary.org/isbn/${isbn}` });
  if (!q.length) return "";
  return `<div class="quellen"><p class="etikett">Quellen</p>
    <p>${q.map(x => `<a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.titel || x.url)}</a>`).join(" · ")}</p>
    <p>Cover © jeweiliger Verlag bzw. Rechteinhaber, eingebunden zur Kennzeichnung des Buchs. Beschreibung als eigene Zusammenfassung.</p></div>`;
}
function ausleiheHtml(b, g){
  const s = status(b.id), l = s.loan;
  if (!l) return `<div class="status-zeile"><span><span class="badge st-erfolg">Verfügbar</span></span></div>
    <form id="${g === "k" ? "ausleihen" : "verleihen-admin"}" class="feld" autocomplete="off" novalidate>
      <fieldset class="kuerzel"><legend>${g === "k" ? "Dein Kürzel" : "Kürzel der Person"}</legend>${zeichenFelder(g, g === "k" ? ls.get("bib.kuerzel", "") : "", "kuerzel")}
        <p class="meta">2 oder 3 Buchstaben, z. B. NNE</p></fieldset>
      <div class="aktionen"><button class="taste primaer" type="submit" ${S.busy ? "disabled" : ""}>${g === "k" ? "Ausleihen" : "Als verliehen erfassen"}</button></div>
    </form>`;
  const d = days(l.dueAt), frist = d < 0 ? `seit ${tage(-d)} überfällig` : d === 0 ? "heute fällig" : `noch ${tage(d)}`;
  return `<div class="status-zeile"><span><span class="badge ${s.cls}">${esc(s.label)}</span></span>
      <p class="titel-karte" style="margin-top:6px">Aktuell geliehen von <span class="kuerzel-text">${esc(l.kuerzel || l.name)}</span></p>
      <p class="meta zahl" style="margin:0">Seit ${fmt(l.borrowedAt)} · zurück bis ${fmt(l.dueAt)} (${frist})${l.extended ? " · verlängert" : ""}</p></div>
    <div class="aktionen">
      <button type="button" class="taste primaer" data-act="return" ${S.busy ? "disabled" : ""}>${g === "k" ? "Zurückgeben" : "Als zurückgegeben markieren"}</button>
      ${l.extended ? "" : `<button type="button" class="taste sekundaer" data-act="extend" ${S.busy ? "disabled" : ""}>Verlängern</button>`}
    </div>`;
}

  const angaben = [["Verlag", b.verlag], ["Jahr", b.jahr], ["Seiten", b.seiten], ["Sprache", b.sprache], ["Standort", b.standort], ["Eigentum", b.eigentum], ["ISBN", b.isbn]].filter(x => x[1]);
  $("#detail").innerHTML = `
    <div class="held gross">${cover(b)}<div><h2 id="d-titel">${esc(b.titel)}</h2>${b.untertitel ? `<p class="untertitel">${esc(b.untertitel)}</p>` : ""}<p class="meta" style="margin:4px 0 0">${esc(b.autor)}</p>
      <button type="button" class="taste sekundaer klein merken" data-merken="${esc(b.id)}" aria-pressed="${gemerkt(b.id)}">${gemerkt(b.id) ? ICON.gemerkt + " Gemerkt" : ICON.merken + " Merken"}</button></div></div>

      Link kopieren</button><div id="linkplatz"></div></div>
    ${S.admin ? `<button class="taste sekundaer ganz" data-edit="${esc(b.id)}">Buch bearbeiten</button>` : ""}
    ${quellenHtml(b)}
    ${b.beispiel ? `<p class="hinweis" style="margin:0 4px">Beispieleintrag bis zur Inventur.</p>` : ""}`;

function syncEdit(){
  const e = S.edit; if (!e || !$("#edit-form")) return;
  const v = n => ($(`#f-${n}`) || {}).value ?? "";
  Object.assign(e.buch, {
    titel: v("titel").trim(), untertitel: v("untertitel").trim(), autor: v("autor").trim(), verlag: v("verlag").trim(), sprache: v("sprache").trim(),
    jahr: parseInt(v("jahr"), 10) || "", seiten: parseInt(v("seiten"), 10) || "", isbn: v("isbn").replace(/[^0-9Xx-]/g, ""),
    standort: v("standort").trim(), eigentum: v("eigentum").trim(), cover: v("cover").trim(), beschreibung: v("beschreibung").trim(),
    quellen: v("quellen").split("\n").map(z => { const [t, ...u] = z.split("|"); const url = (u.join("|") || t).trim(); return { titel: (u.length ? t : url).trim(), url }; }).filter(q => sicherUrl(q.url))
  });
}
function mergeBuch(z, r, auchBefuellte = false){
  for (const k of ["titel", "autor", "verlag", "jahr", "seiten", "sprache", "isbn", "beschreibung"])
    if (r[k] && (auchBefuellte || !z[k])) z[k] = r[k];
  if (Array.isArray(r.themen)) z.themen = [...new Set([...(z.themen || []), ...r.themen.filter(Boolean)])];
  if (Array.isArray(r.quellen)) r.quellen.forEach(q => { if (sicherUrl(q.url) && !(z.quellen || []).some(x => x.url === q.url)) (z.quellen ||= []).push(q); });
  if (!z.cover && r.coverUrl) z.cover = r.coverUrl;
}
const ladeSkript = src => new Promise((res, rej) => { if (document.querySelector(`script[src="${src}"]`)) return res(); const s = document.createElement("script"); s.src = src; s.onload = res; s.onerror = () => rej(new Error("Skript nicht geladen")); document.head.appendChild(s); });
const istIsbn = t => /^97[89]\d{10}$/.test(t || "");
async function isbnAusBild(dataUrl){
  const img = await ladeBild(dataUrl);
  if ("BarcodeDetector" in window){
    try { const r = await new BarcodeDetector({ formats: ["ean_13"] }).detect(img); const t = r.map(x => x.rawValue).find(istIsbn); if (t) return t; } catch {}
  }
  try {
    await ladeSkript("https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js");
    const hints = new Map(); hints.set(ZXing.DecodeHintType.TRY_HARDER, true);
    const t = (await new ZXing.BrowserMultiFormatReader(hints).decodeFromImageElement(img)).getText();
    if (istIsbn(t)) return t;
  } catch {}
  return null;
}
async function nachschlagen(isbn){
  const r = { isbn, quellen: [] };
  try {
    const j = await (await fetch(`https://openlibrary.org/api/books?bibkeys=ISBN:${isbn}&format=json&jscmd=data`)).json(), d = j[`ISBN:${isbn}`];
    if (d){
      r.titel = d.title + (d.subtitle ? `: ${d.subtitle}` : ""); r.autor = (d.authors || []).map(a => a.name).join(", ");
      r.verlag = (d.publishers || [])[0]?.name; const y = String(d.publish_date || "").match(/\d{4}/); if (y) r.jahr = +y[0];
      r.seiten = d.number_of_pages; if (d.cover) r.coverUrl = d.cover.large || d.cover.medium;
      if (d.url) r.quellen.push({ titel: "Open Library", url: d.url });
    }
  } catch {}
  try {
    const j = await (await fetch(`https://www.googleapis.com/books/v1/volumes?q=isbn:${isbn}`)).json(), v = j.items?.[0]?.volumeInfo;
    if (v){
      r.titel ||= v.title + (v.subtitle ? `: ${v.subtitle}` : ""); r.autor ||= (v.authors || []).join(", "); r.verlag ||= v.publisher;
      if (!r.jahr && v.publishedDate) r.jahr = parseInt(String(v.publishedDate).slice(0, 4), 10) || undefined;
      r.seiten ||= v.pageCount; r.sprache = { de: "Deutsch", en: "Englisch", fr: "Französisch", es: "Spanisch", it: "Italienisch" }[v.language] || v.language;
      if (!r.coverUrl && v.imageLinks?.thumbnail) r.coverUrl = v.imageLinks.thumbnail.replace(/^http:/, "https:");
      if (v.infoLink) r.quellen.push({ titel: "Google Books", url: v.infoLink.replace(/^http:/, "https:") });
    }
  } catch {}
  return r;
}
async function fotoVerarbeiten(key, datei){
  const e = S.edit; syncEdit();
  const foto = await verkleinern(datei, 1600, .85);
  if (S.edit !== e || S.view !== "edit") return;
  e.fotos[key] = foto;
  if (key === "cover" && !e.buch.cover && !e.fotoAlsCover) e.fotoAlsCover = true;
  e.info = "Suche ISBN im Foto …"; renderEdit();
  const isbn = await isbnAusBild(e.fotos[key]);
  if (S.edit !== e || S.view !== "edit") return;
  if (isbn){
    e.info = `ISBN ${isbn} erkannt. Suche Angaben …`; renderEdit();
    const r = await nachschlagen(isbn); if (S.edit !== e || S.view !== "edit") return; syncEdit(); mergeBuch(e.buch, r, e.neu);
    if (r.coverUrl && e.fotoAlsCover && !e.coverDatei) e.fotoAlsCover = false;
    e.info = r.titel ? `ISBN ${isbn}: Angaben${r.coverUrl ? " und Original-Cover" : ""} übernommen. Bitte prüfen.` : `ISBN ${isbn} erkannt, aber keine Angaben gefunden. „Mit KI ausfüllen“ probieren.`;
  } else e.info = key === "rueck" ? "Keine ISBN erkannt. „Mit KI ausfüllen“ nutzen oder Angaben von Hand eintragen." : "Foto übernommen. Für die ISBN noch die Rückseite fotografieren.";
  renderEdit();
}
async function kiAnalyse(){
  const e = S.edit; syncEdit(); e.laeuft = true; e.info = "KI analysiert die Fotos …"; renderEdit();
  try {
    const bilder = [];
    for (const f of [e.fotos.cover, e.fotos.rueck]) if (f) bilder.push((await verkleinern(f, 1200, .8)).split(",")[1]);
    const j = await call({ action: "analyze", pin: S.admin, bilder });
    if (S.edit !== e || S.view !== "edit") return;
    const d = j.daten || {}; syncEdit(); mergeBuch(e.buch, d, false);
    if (istIsbn(String(d.isbn || "").replace(/\D/g, ""))){ const r = await nachschlagen(String(d.isbn).replace(/\D/g, "")); if (S.edit !== e) return; mergeBuch(e.buch, r, false); if (r.coverUrl && !e.coverDatei) e.fotoAlsCover = false; }
    e.info = "KI-Vorschlag übernommen. Bitte prüfen und speichern.";
  } catch (err){ e.info = err.message || "KI-Analyse fehlgeschlagen."; }
  e.laeuft = false; if (S.edit === e && S.view === "edit") renderEdit();
}
const slug = s => norm(s).replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 60);

async function speichereBewertung(){

    const medien = e.medien.map(m => ({ typ: m.typ, url: m.url, thumb: m.thumb }));
    apply(await call({ action: "rate", bookId: S.open, kuerzel, sterne: e.sterne, kommentar: e.kommentar.trim().slice(0, 500), medien }));
    e.medien = medien; toast("Danke für deine Bewertung.");
  } catch (err){ toast(err.message || "Speichern fehlgeschlagen."); }
  S.busy = false; render();
}

/* ===== Ereignisse: Liste und Filter ===== */
$("#q").addEventListener("input", e => { S.q = e.target.value.trim(); render(); });
$("#leeren").addEventListener("click", () => { $("#q").value = ""; S.q = ""; render(); $("#q").focus(); });
$("#filter").addEventListener("click", e => { const c = e.target.closest(".chip"); if (!c) return; themaUmschalten(c.dataset.t); renderFilter(); render(); });
$("#filter-oeffnen").addEventListener("click", () => { setFilter(false); openSheet("filter"); });
document.querySelectorAll(".merk-taste").forEach(t => t.addEventListener("click", () => { setFilter(false); openSheet("merkliste"); }));
$("#info-oeffnen").addEventListener("click", () => openSheet("info"));
$("#intro").addEventListener("click", e => {
  if (e.target.closest("#intro-ok")){ ls.set("bib.intro", true); renderIntro(); $("#q").focus({ preventScroll: true }); }
  if (e.target.closest("#intro-mehr")){ ls.set("bib.intro", true); openSheet("info"); renderIntro(); }
});
$("#liste").addEventListener("click", e => {
  const v = e.target.closest("[data-vorschlag]"); if (v){ $("#q").value = v.dataset.vorschlag; S.q = v.dataset.vorschlag; render(); return; }
  if (e.target.closest("[data-zuruecksetzen]")){ zuruecksetzen(); return; }
  const z = e.target.closest(".zeile"); if (z) openSheet("buch", z.dataset.id);
});
$("#q").addEventListener("keydown", e => { if (e.key === "Enter"){ e.preventDefault(); e.target.blur(); } if (e.key === "Escape" && S.q){ e.stopPropagation(); $("#leeren").click(); } });
["#empfohlen-liste", "#merkliste-liste"].forEach(sel => $(sel).addEventListener("click", e => { const z = e.target.closest(".empfehlung"); if (z) openSheet("buch", z.dataset.id); }));
$("#backdrop").addEventListener("click", closeSheet);
$("#schliessen").addEventListener("click", closeSheet);
$("#lb-zu").addEventListener("click", schliesseLightbox);
$("#lightbox").addEventListener("click", e => { if (e.target.id === "lightbox") schliesseLightbox(); });
document.addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  if (!$("#lightbox").hidden) return schliesseLightbox();
  if (!$("#einstellungen-menue").hidden){ menue(false); return menueTaste.focus(); }
  if (S.view) closeSheet();
});

/* ===== Ereignisse: Sheet ===== */
const D = $("#detail");
D.addEventListener("submit", e => {
  e.preventDefault();
  const id = e.target.id;
  if (id === "ausleihen"){ const k = leseKuerzel("k"); if (k) act({ action: "borrow", bookId: S.open, kuerzel: k }, "Ausgeliehen. Viel Freude beim Lesen."); }
  if (id === "verleihen-admin"){ const k = leseKuerzel("a"); if (k) act({ action: "borrow", bookId: S.edit.buch.id, kuerzel: k }, `Als verliehen an ${k} erfasst.`); }
  if (id === "bewerten") speichereBewertung();
  if (id === "feedback") sendeFeedback();
  if (id === "edit-form") speichereBuch();
  if (id === "login"){
    if (S.busy) return;
    const pin = lesePin("p"); if (!pin) return;
    S.busy = true; renderLogin();
    call({ action: "checkPin", pin }).then(j => { S.admin = pin; ss.set("bib.admin", pin); S.pinPflicht = j.eigenePin === false; S.busy = false; S.feedback = null; wechsle("admin"); render(); })
      .catch(err => { S.busy = false; toast(err.message || "PIN ist nicht richtig."); renderLogin(); $("#p0").focus(); });
  }
  if (id === "pin-form"){
    const a = lesePin("n"); if (!a) return; const b = lesePin("m"); if (!b) return;
    if (a !== b){ toast("Die beiden PINs stimmen nicht überein."); felderVon("m").forEach(f => f.value = ""); $("#m0").focus(); return; }
    call({ action: "setPin", pin: S.admin, neu: a }).then(() => { S.admin = a; ss.set("bib.admin", a); S.pinPflicht = false; toast("PIN geändert."); renderAdmin(); })
      .catch(err => toast(err.message));
  }
});
D.addEventListener("input", e => {
  const f = e.target.closest(".k-feld");
  if (f){
    f.value = zeichenNorm(f.value, f.dataset.art).slice(-1); f.removeAttribute("aria-invalid");
    if (f.dataset.g === "r") S.entwurf.kuerzel = felderVon("r").map(x => x.value).join("");
    if (f.dataset.g === "f" && S.fb) S.fb.kuerzel = felderVon("f").map(x => x.value).join("");
    if (f.value){
      const n = document.getElementById(f.dataset.g + (+f.dataset.i + 1));
      if (n) n.focus();
      else if (f.dataset.g === "p" && felderVon("p").every(x => x.value)) $("#login").requestSubmit();
    }
    return;
  }
  if (e.target.id === "kommentar") S.entwurf.kommentar = e.target.value;
  if (e.target.id === "fb-text" && S.fb) S.fb.text = e.target.value;
});
D.addEventListener("keydown", e => {
  if (e.target.id === "f-thema-neu" && e.key === "Enter"){
    e.preventDefault(); const t = e.target.value.trim(); if (!t) return;
    syncEdit(); S.edit.buch.themen = [...new Set([...(S.edit.buch.themen || []), t])]; renderEdit(); $("#f-thema-neu").focus(); return;
  }
  const f = e.target.closest(".k-feld"); if (!f) return;
  const p = document.getElementById(f.dataset.g + (+f.dataset.i - 1)), n = document.getElementById(f.dataset.g + (+f.dataset.i + 1));
  if (e.key === "Backspace" && !f.value && p){ p.value = ""; p.focus(); e.preventDefault(); }
  if (e.key === "ArrowLeft" && p){ p.focus(); e.preventDefault(); }
  if (e.key === "ArrowRight" && n){ n.focus(); e.preventDefault(); }
});
D.addEventListener("paste", e => {
  const f = e.target.closest(".k-feld"); if (!f) return;
  const felder = felderVon(f.dataset.g), t = zeichenNorm((e.clipboardData || window.clipboardData).getData("text"), f.dataset.art).slice(0, felder.length);
  if (!t) return; e.preventDefault();
  felder.forEach((x, i) => x.value = t[i] || ""); felder[Math.min(t.length, felder.length - 1)].focus();
});
D.addEventListener("change", async e => {
  const t = e.target;
  try {
    if (t.id === "medien-datei"){
      const e2 = S.entwurf;
      for (const d of [...t.files].slice(0, CONFIG.MAX_MEDIEN - e2.medien.length)){
        const typ = /^video\/(mp4|quicktime|webm)$/.test(d.type) ? "video" : d.type.startsWith("image/") ? "bild" : null;
        if (!typ){ toast(d.type.startsWith("video/") ? "Dieses Videoformat geht nicht. Bitte MP4 oder MOV nutzen." : "Nur Bilder und Videos sind möglich."); continue; }
        e2.medien.push({ neu: true, typ, datei: d, vorschau: URL.createObjectURL(d) });
      }
      renderBuch();
    }
    if (t.dataset.foto && t.files[0]) await fotoVerarbeiten(t.dataset.foto, t.files[0]);
    if (t.id === "cover-datei" && t.files[0]){ syncEdit(); S.edit.coverDatei = await verkleinern(t.files[0], 1600, .85); S.edit.fotoAlsCover = false; renderEdit(); }
    if (t.id === "foto-als-cover"){ syncEdit(); S.edit.fotoAlsCover = t.checked; if (t.checked) S.edit.coverDatei = null; renderEdit(); }
  } catch (err){ toast(err.message || "Datei konnte nicht gelesen werden."); }
});
D.addEventListener("click", e => {
  const el = sel => e.target.closest(sel);
  const a = el("[data-act]");
  if (a){ const id = S.view === "edit" ? S.edit.buch.id : S.open, l = openLoan(id);
    if (l) act({ action: a.dataset.act, loanId: l.id }, a.dataset.act === "return" ? "Zurückgegeben. Danke!" : "Um vier Wochen verlängert."); return; }
  const fbn = el("[data-fbn]"); if (fbn){ const n = +fbn.dataset.fbn; S.fb.text = $("#fb-text").value; S.fb.sterne = S.fb.sterne === n ? 0 : n; renderInfo(); const x = document.querySelector(`[data-fbn="${n}"]`); if (x) x.focus(); return; }
  if (el("#fb-neu")){ S.fb = FB0(); renderInfo(); return; }
  const fbw = el("[data-fbweg]"); if (fbw){
    const id = fbw.dataset.fbweg; if (S.loeschFrage !== id){ S.loeschFrage = id; renderAdmin(); return; }
    S.loeschFrage = null; call({ action: "deleteFeedback", pin: S.admin, id }).then(j => { S.feedback = j.feedback || []; toast("Feedback entfernt."); renderAdmin(); }).catch(err => toast(err.message)); return;
  }
  const ob = el("[data-oeffne]"); if (ob){ openSheet("buch", ob.dataset.oeffne); return; }
  const mw = el("[data-merkweg]"); if (mw){ merken(mw.dataset.merkweg); render(); return; }
  const mk = el("[data-merken]"); if (mk){ merken(mk.dataset.merken); renderBuch(); render(); return; }
  const nav = el("[data-nav]"); if (nav){ S.edit = null; wechsle(nav.dataset.nav); return; }
  const ed = el("[data-edit]"); if (ed){ S.edit = neuerEntwurf(buchVon(ed.dataset.edit)); wechsle("edit"); return; }
  if (el("#neu-buch")){ S.edit = neuerEntwurf(null); wechsle("edit"); return; }
  if (el("#abmelden")){ S.admin = null; ss.set("bib.admin", null); toast("Abgemeldet."); closeSheet(); return; }
  const sw = el("[data-aktiv]"); if (sw){ const b = buchVon(sw.dataset.aktiv); adminSpeichern(b, { aktiv: b.aktiv === false }, b.aktiv === false ? "Wieder im Katalog." : "Aus dem Katalog genommen."); return; }
  const em = el("[data-empfohlen]"); if (em){ const b = buchVon(em.dataset.empfohlen); adminSpeichern(b, { empfohlen: !b.empfohlen }, b.empfohlen ? "Nicht mehr empfohlen." : "Als empfohlen markiert."); return; }
  if (el("#f-aktiv")){ syncEdit(); S.edit.buch.aktiv = S.edit.buch.aktiv === false; renderEdit(); return; }
  if (el("#f-empfohlen")){ syncEdit(); S.edit.buch.empfohlen = !S.edit.buch.empfohlen; renderEdit(); return; }
  const th = el("[data-thema]"); if (th){ syncEdit(); const b = S.edit.buch, t = th.dataset.thema; b.themen = (b.themen || []).includes(t) ? b.themen.filter(x => x !== t) : [...(b.themen || []), t]; renderEdit(); return; }
  if (el("#ki-analyse")){ kiAnalyse(); return; }
  const tag = el(".tag"); if (tag){ S.f.themen = [tag.dataset.t]; renderFilter(); closeSheet(); render(); return; }
  const fg = el("[data-fgruppe]"); if (fg){
    const g = fg.dataset.fgruppe, w = fg.dataset.fwert, f = S.f;
    if (g === "status") f.status = w;
    if (g === "sort") f.sort = w;
    if (g === "sterne") f.minSterne = Number(w);
    if (g === "themen") themaUmschalten(w);
    if (g === "sprachen") f.sprachen = f.sprachen.includes(w) ? f.sprachen.filter(x => x !== w) : [...f.sprachen, w];
    renderFilter(); render(); const neu = document.querySelector(`[data-fgruppe="${CSS.escape(g)}"][data-fwert="${CSS.escape(w)}"]`); if (neu) neu.focus(); return;
  }
  if (el("[data-fzurueck]")){ zuruecksetzen(); return; }
  if (el("[data-fschliessen]")){ closeSheet(); $("#liste-titel").scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" }); return; }
  const bw = el("[data-bewertung]"); if (bw){ const r = S.ratings.find(x => x.id === bw.dataset.bewertung); if (r){ S.redit = { id: r.id, sterne: Number(r.sterne || 0), kommentar: r.kommentar || "", medien: [...(r.medien || [])] }; S.loeschFrage = null; wechsle("bewertung"); } return; }
  const rn = el("[data-rn]"); if (rn){ const n = +rn.dataset.rn; S.redit.kommentar = $("#r-kommentar").value; S.redit.sterne = S.redit.sterne === n ? 0 : n; renderBewertungEdit(); const f = document.querySelector(`[data-rn="${n}"]`); if (f) f.focus(); return; }
  const rw = el("[data-rweg]"); if (rw){ S.redit.kommentar = $("#r-kommentar").value; S.redit.medien.splice(+rw.dataset.rweg, 1); renderBewertungEdit(); return; }
  const rl = el("[data-rlb]"); if (rl){ oeffneLightbox(S.redit.medien[+rl.dataset.rlb]); return; }
  if (el("[data-rspeichern]")){
    const e2 = S.redit; e2.kommentar = $("#r-kommentar").value.trim().slice(0, 500);
    call({ action: "updateRating", pin: S.admin, id: e2.id, sterne: e2.sterne, kommentar: e2.kommentar, medien: e2.medien.map(m => ({ typ: m.typ, url: m.url, thumb: m.thumb })) })
      .then(j => { apply(j); toast("Bewertung gespeichert."); S.redit = null; render(); wechsle("admin"); }).catch(err => toast(err.message));
    return;
  }
  if (el("[data-rloeschen]")){
    const id = S.redit.id; S.redit.kommentar = $("#r-kommentar").value;
    if (S.loeschFrage !== id){ S.loeschFrage = id; renderBewertungEdit(); return; }
    call({ action: "deleteRating", pin: S.admin, id }).then(j => { apply(j); toast("Bewertung gelöscht."); S.redit = null; S.loeschFrage = null; render(); wechsle("admin"); }).catch(err => toast(err.message));
    return;
  }
  if (el("#teilen")){ teilen(buchVon(S.open)); return; }
  const st = el(".stern"); if (st){ const n = +st.dataset.n; S.entwurf.sterne = S.entwurf.sterne === n ? 0 : n; renderBuch(); const f = document.querySelector(`.stern[data-n="${n}"]`); if (f) f.focus(); return; }
  const weg = el("[data-weg]"); if (weg){ const [m] = S.entwurf.medien.splice(+weg.dataset.weg, 1); if (m && m.vorschau) URL.revokeObjectURL(m.vorschau); renderBuch(); return; }
  const lb = el("[data-lb]"); if (lb){ const r = S.ratings.find(x => x.id === lb.dataset.lb); if (r) oeffneLightbox(r.medien[+lb.dataset.i]); return; }
  const lo = el("[data-loeschen]"); if (lo){
    if (S.loeschFrage !== lo.dataset.loeschen){ S.loeschFrage = lo.dataset.loeschen; renderBuch(); return; }
    S.loeschFrage = null; act({ action: "deleteRating", pin: S.admin, id: lo.dataset.loeschen }, "Bewertung entfernt.");
  }
});

/* ===== Einstellungen: Menü nach oben ===== */
const menueTaste = $("#einstellungen"), menueEl = $("#einstellungen-menue");
function renderMenue(){
  const m = ls.get("bib.modus", "system");
  menueEl.innerHTML = `<p class="etikett menue-etikett">Darstellung</p>
    ${[["system", "Wie System"], ["hell", "Hell"], ["dunkel", "Dunkel"]].map(([k, l]) => `<button role="menuitemradio" aria-checked="${m === k}" data-modus="${k}"><span>${l}</span>${m === k ? ICON.haken : ""}</button>`).join("")}
    <div class="menue-linie" role="separator"></div>
    <button role="menuitem" data-menue="info"><span>So funktioniert’s · Feedback</span></button>
    <button role="menuitem" data-menue="verwaltung"><span>Verwaltung</span>${S.admin ? `<span class="meta">angemeldet</span>` : ""}</button>`;
}
function menue(offen){
  if (offen) renderMenue();
  menueEl.hidden = !offen; menueTaste.setAttribute("aria-expanded", offen);
  if (offen) (menueEl.querySelector('[aria-checked="true"]') || menueEl.querySelector("button")).focus();
}
menueTaste.addEventListener("click", () => menue(menueEl.hidden));
menueEl.addEventListener("click", e => {
  e.stopPropagation();
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.modus){ setzeModus(b.dataset.modus); renderMenue(); menueEl.querySelector(`[data-modus="${b.dataset.modus}"]`).focus(); return; }
  if (b.dataset.menue === "verwaltung"){ menue(false); openSheet(S.admin ? "admin" : "login"); }
  if (b.dataset.menue === "info"){ menue(false); openSheet("info"); }
});
menueEl.addEventListener("keydown", e => {
  const items = [...menueEl.querySelectorAll("button")], i = items.indexOf(document.activeElement);
  if (e.key === "ArrowDown"){ items[(i + 1) % items.length].focus(); e.preventDefault(); }
  if (e.key === "ArrowUp"){ items[(i - 1 + items.length) % items.length].focus(); e.preventDefault(); }
  if (e.key === "Tab") menue(false);
});
document.addEventListener("click", e => { if (!menueEl.hidden && !e.target.closest("#einstellungen-menue, #einstellungen")) menue(false); });

/* ===== Mini-Kopf: erscheint, sobald die Suchleiste aus dem Bild ist ===== */
const platz = $("#leiste-platz"), leiste = $("#leiste"), mini = $("#minikopf"), miniTaste = $("#mini-filter");
let miniAn = false;
function setFilter(offen){
  offen = offen && miniAn; miniTaste.setAttribute("aria-expanded", offen);
  if (offen && !leiste.classList.contains("schwebend")){ platz.style.height = platz.offsetHeight + "px"; leiste.classList.add("schwebend"); }
  if (!offen && leiste.classList.contains("schwebend")){ leiste.classList.remove("schwebend"); platz.style.height = ""; }
}
function pruefeMini(){
  const an = platz.getBoundingClientRect().bottom < 0;
  if (an === miniAn) return;
  miniAn = an; mini.classList.toggle("on", an); mini.setAttribute("aria-hidden", String(!an)); miniTaste.tabIndex = an ? 0 : -1;
  if (!an) setFilter(false);
}
miniTaste.addEventListener("click", () => setFilter(miniTaste.getAttribute("aria-expanded") !== "true"));
document.addEventListener("keydown", e => { if (e.key === "Escape" && !S.view && leiste.classList.contains("schwebend")){ setFilter(false); miniTaste.focus(); } });
$("#liste").addEventListener("click", () => setFilter(false));
window.addEventListener("scroll", pruefeMini, { passive: true });
window.addEventListener("resize", pruefeMini, { passive: true });
window.addEventListener("hashchange", () => { const m = location.hash.match(/^#b-(.+)$/); if (m && m[1] !== S.open) openSheet("buch", m[1], false); });

/* ===== Start ===== */
const tippt = () => { const a = document.activeElement; return !!(S.view && a && $("#sheet").contains(a) && /^(INPUT|TEXTAREA)$/.test(a.tagName)); };
async function refresh(erstes){
  if (!erstes && (["edit", "bewertung", "login", "info"].includes(S.view) || tippt() || S.busy)) return;
  try { apply(await Store.list()); renderFilter(); render(); }
  catch (e){ if (Store.mode === "remote") toast(S.geladen && S.books.length ? "Keine Verbindung. Angezeigt wird der zuletzt geladene Stand." : (e.message || "Bestand konnte nicht geladen werden.")); }
}
(async function start(){
  if (Store.mode === "local"){ $("#vorschau").hidden = false;
    $("#vorschau-text").textContent = "Vorschau: Änderungen bleiben nur auf diesem Gerät. Mit verbundener Tabelle sehen alle denselben Stand."; }
  renderFilter(); render(); await refresh(true);
  const m = location.hash.match(/^#b-(.+)$/); if (m) openSheet("buch", m[1], false);
  if (Store.mode === "remote"){ setInterval(() => refresh(), 60000); document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); }); }
})();
</script>
