<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Bücher der GAUSS-Bücherei finden, ausleihen und zurückgeben.">
<meta name="theme-color" content="#f9fafc" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b111f" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bücherei">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>GAUSS Bücherei</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Funnel+Sans:wght@400;500;600&display=swap">
<style>
/*
 * GAUSS Bücherei — Anwendung im GAUSS-Designsystem.
 * Grundlage GAUSS: Neutralskala Hue 265 (Tinte nie Schwarz), nur Funnel Sans (400/500/600), Rollenradien, KERN-Status.
 * Ausprägung Unternehmen (Arbeitgeber): Markenskala Magenta, --marke-hue 345 statt Orange 50.
 * Zustandsregel: Hover = neutrales Overlay; Umschalter = Ort-Leiter; Marke nur bei gewählten Steuerelementen,
 * Fokus, Zähler und Links im Fließtext. Primäraktion = Tinte. Warnung = Amber.
 * Layout: eine Spalte, Seitentitel, sticky Suche/Umschalter, Widget Typ A (Titel außen, weiße Karte), Detail als Sheet.
 * Werte 1:1 aus src/styles.css des Lovable-Prototyps (Stand 25.10.2026).
 */
:root{
  --font-ui:"Funnel Sans",-apple-system,BlinkMacSystemFont,system-ui,"Segoe UI",Roboto,sans-serif;

  --neutral-0:oklch(1 0 0);
  --neutral-50:oklch(0.985 0.004 265);
  --neutral-100:oklch(0.965 0.007 265);
  --neutral-200:oklch(0.92 0.01 265);
  --neutral-300:oklch(0.85 0.014 265);
  --neutral-400:oklch(0.71 0.02 265);
  --neutral-500:oklch(0.58 0.028 265);
  --neutral-600:oklch(0.48 0.038 265);
  --neutral-700:oklch(0.4 0.048 265);
  --neutral-800:oklch(0.34 0.035 265);
  --neutral-900:oklch(0.27 0.04 265);
  --neutral-950:oklch(0.22 0.045 265);

  /* Ausprägung Unternehmen: Magenta */
  --marke-hue:345;
  --marke-050:oklch(0.97 0.016 var(--marke-hue));
  --marke-100:oklch(0.94 0.033 var(--marke-hue));
  --marke-200:oklch(0.89 0.064 var(--marke-hue));
  --marke-300:oklch(0.82 0.11 var(--marke-hue));
  --marke-400:oklch(0.75 0.148 var(--marke-hue));
  --marke-500:oklch(0.68 0.163 var(--marke-hue));
  --marke-600:oklch(0.6 0.153 var(--marke-hue));
  --marke-700:oklch(0.52 0.136 var(--marke-hue));

  --status-fehler-text:oklch(0.5 0.18 25);   --status-fehler-flaeche:oklch(0.965 0.02 25);
  --status-erfolg-text:oklch(0.47 0.11 150); --status-erfolg-flaeche:oklch(0.965 0.03 150);
  --status-info-text:oklch(0.48 0.14 250);   --status-info-flaeche:oklch(0.965 0.02 250);
  --status-warnung-text:oklch(0.5 0.105 85); --status-warnung-flaeche:oklch(0.97 0.055 92);

  --background:var(--neutral-50);
  --leiste:var(--neutral-100);
  --rahmenflaeche:var(--neutral-50);
  --objekt:var(--neutral-0);
  --erhoeht:var(--neutral-200);
  --tastenflaeche:var(--neutral-100);
  --popover:var(--neutral-0);
  --linie:var(--neutral-200);
  --rahmen:var(--neutral-500);
  /* Hell: Texttinte leichter und blauer als neutral-950 (Hue 262, mehr Chroma); Kontraste auf Weiß ≈ 11:1 / 7:1 / 5,3:1 */
  --tinte-text:oklch(0.31 0.072 262);
  --foreground:var(--tinte-text);
  --text-sekundaer:oklch(0.45 0.062 262);
  --tertiaer:oklch(0.52 0.05 262);
  --deaktiviert:var(--neutral-400);
  --primary:var(--tinte-text);
  --primary-foreground:var(--neutral-0);
  --hover:color-mix(in oklab,var(--neutral-950) 6%,transparent);
  --pressed:color-mix(in oklab,var(--neutral-950) 10%,transparent);
  --ort-aktiv:var(--neutral-300);
  --gewaehlt:var(--marke-600);
  --gewaehlt-text:var(--neutral-0);
  --zaehler:var(--marke-600);
  --fokus:var(--marke-700);
  --fokus-innen:var(--neutral-0);
  --link:var(--marke-700);
  --logo:var(--tinte-text);
  --logo-marke:var(--marke-600);
  --popup-backdrop:color-mix(in oklab,var(--neutral-950) 20%,transparent);
  --schatten-farbe:var(--neutral-950);
  --schatten-widget:0 1px 2px color-mix(in oklab,var(--neutral-950) 6%,transparent),0 6px 16px -8px color-mix(in oklab,var(--neutral-950) 18%,transparent);
  --schatten-hoch:0 20px 48px -16px color-mix(in oklab,var(--schatten-farbe) 16%,transparent),0 4px 14px -8px color-mix(in oklab,var(--schatten-farbe) 8%,transparent);

  /* Cover: nur Neutralskala, Bauhaus-Form als Unterscheidung */
  --cover-a:var(--neutral-950); --cover-a-t:var(--neutral-50);
  --cover-b:var(--neutral-700); --cover-b-t:var(--neutral-0);
  --cover-c:var(--neutral-200); --cover-c-t:var(--neutral-950);
  --cover-d:var(--neutral-100); --cover-d-t:var(--neutral-950);

  --radius-aktion:999px; --radius-zeile:8px; --radius-block:12px; --radius-karte:16px; --radius-flaeche:20px;
  --hoehe-touchziel:44px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --dunkel-seite:oklch(0.16 0.028 265); --dunkel-karte:oklch(0.20 0.03 265); --dunkel-erhoeht:oklch(0.245 0.032 265); --dunkel-linie:oklch(0.29 0.03 265);
  --status-fehler-text:oklch(0.78 0.13 25);   --status-fehler-flaeche:oklch(0.29 0.06 25);
  --status-erfolg-text:oklch(0.78 0.12 150);  --status-erfolg-flaeche:oklch(0.28 0.05 150);
  --status-info-text:oklch(0.78 0.11 250);    --status-info-flaeche:oklch(0.29 0.06 250);
  --status-warnung-text:oklch(0.85 0.13 88);  --status-warnung-flaeche:oklch(0.3 0.06 85);
  --background:var(--dunkel-seite); --leiste:var(--dunkel-seite); --rahmenflaeche:var(--dunkel-seite);
  --objekt:var(--dunkel-karte); --erhoeht:var(--dunkel-erhoeht); --tastenflaeche:var(--dunkel-erhoeht); --popover:var(--dunkel-karte);
  --linie:var(--dunkel-linie); --rahmen:var(--neutral-400);
  --foreground:var(--neutral-50); --text-sekundaer:var(--neutral-300); --tertiaer:var(--neutral-300); --deaktiviert:var(--neutral-600);
  --primary:var(--neutral-50); --primary-foreground:var(--neutral-950);
  --hover:color-mix(in oklab,white 8%,transparent); --pressed:color-mix(in oklab,white 10%,transparent);
  --ort-aktiv:var(--dunkel-erhoeht); --gewaehlt:var(--marke-500); --zaehler:var(--marke-500);
  --fokus:var(--marke-400); --fokus-innen:var(--neutral-950); --link:var(--marke-300); --logo:var(--neutral-50); --logo-marke:var(--marke-400);
  --popup-backdrop:color-mix(in oklab,var(--neutral-950) 55%,transparent);
  --schatten-farbe:oklch(0.1 0.03 270);
  --schatten-widget:0 1px 2px color-mix(in oklab,black 30%,transparent),0 8px 20px -10px color-mix(in oklab,black 55%,transparent);
  --schatten-hoch:0 24px 56px -18px color-mix(in oklab,var(--schatten-farbe) 65%,transparent),0 4px 16px -8px color-mix(in oklab,var(--schatten-farbe) 40%,transparent);
  --cover-a:var(--neutral-50); --cover-a-t:var(--neutral-950);
  --cover-b:var(--neutral-400); --cover-b-t:var(--neutral-950);
  --cover-c:var(--neutral-800); --cover-c-t:var(--neutral-50);
  --cover-d:var(--dunkel-erhoeht); --cover-d-t:var(--neutral-50);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --dunkel-seite:oklch(0.16 0.028 265); --dunkel-karte:oklch(0.20 0.03 265); --dunkel-erhoeht:oklch(0.245 0.032 265); --dunkel-linie:oklch(0.29 0.03 265);
  --status-fehler-text:oklch(0.78 0.13 25);   --status-fehler-flaeche:oklch(0.29 0.06 25);
  --status-erfolg-text:oklch(0.78 0.12 150);  --status-erfolg-flaeche:oklch(0.28 0.05 150);
  --status-info-text:oklch(0.78 0.11 250);    --status-info-flaeche:oklch(0.29 0.06 250);
  --status-warnung-text:oklch(0.85 0.13 88);  --status-warnung-flaeche:oklch(0.3 0.06 85);
  --background:var(--dunkel-seite); --leiste:var(--dunkel-seite); --rahmenflaeche:var(--dunkel-seite);
  --objekt:var(--dunkel-karte); --erhoeht:var(--dunkel-erhoeht); --tastenflaeche:var(--dunkel-erhoeht); --popover:var(--dunkel-karte);
  --linie:var(--dunkel-linie); --rahmen:var(--neutral-400);
  --foreground:var(--neutral-50); --text-sekundaer:var(--neutral-300); --tertiaer:var(--neutral-300); --deaktiviert:var(--neutral-600);
  --primary:var(--neutral-50); --primary-foreground:var(--neutral-950);
  --hover:color-mix(in oklab,white 8%,transparent); --pressed:color-mix(in oklab,white 10%,transparent);
  --ort-aktiv:var(--dunkel-erhoeht); --gewaehlt:var(--marke-500); --zaehler:var(--marke-500);
  --fokus:var(--marke-400); --fokus-innen:var(--neutral-950); --link:var(--marke-300); --logo:var(--neutral-50); --logo-marke:var(--marke-400);
  --popup-backdrop:color-mix(in oklab,var(--neutral-950) 55%,transparent);
  --schatten-farbe:oklch(0.1 0.03 270);
  --schatten-widget:0 1px 2px color-mix(in oklab,black 30%,transparent),0 8px 20px -10px color-mix(in oklab,black 55%,transparent);
  --schatten-hoch:0 24px 56px -18px color-mix(in oklab,var(--schatten-farbe) 65%,transparent),0 4px 16px -8px color-mix(in oklab,var(--schatten-farbe) 40%,transparent);
  --cover-a:var(--neutral-50); --cover-a-t:var(--neutral-950);
  --cover-b:var(--neutral-400); --cover-b-t:var(--neutral-950);
  --cover-c:var(--neutral-800); --cover-c-t:var(--neutral-50);
  --cover-d:var(--dunkel-erhoeht); --cover-d-t:var(--neutral-50);
  color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--background);color:var(--foreground);font-family:var(--font-ui);font-size:15px;line-height:22px;letter-spacing:-.0025em;
  font-feature-settings:"cv01","cv09","ss03","calt","liga";-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--rahmenflaeche)}
::selection{background:color-mix(in oklab,var(--marke-500) 28%,transparent)}
button,input,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--fokus);outline-offset:2px;box-shadow:0 0 0 2px var(--fokus-innen)}
.wrap{max-width:680px;margin:0 auto;padding-block:16px 48px}

/* Rollen-Typografie */
.etikett{font-size:11px;line-height:16px;font-weight:500;text-transform:uppercase;letter-spacing:.04em;color:var(--tertiaer)}
.titel-seite{font-size:28px;line-height:36px;font-weight:600;letter-spacing:-.02em;margin:0;text-wrap:balance}
.titel-bereich{font-size:17px;line-height:24px;font-weight:600;letter-spacing:-.016em;margin:0}
.titel-karte{font-size:16px;line-height:22px;font-weight:600;letter-spacing:-.012em;margin:0}
.meta{font-size:13px;line-height:20px;color:var(--text-sekundaer)}
.zahl{font-variant-numeric:tabular-nums}

/* Kopf */
.kopf{display:flex;align-items:center;gap:10px;margin-bottom:20px}
.zeichen{width:28px;height:28px;color:var(--logo);flex:none}
.kopf .etikett{margin:0}
.seitenkopf{display:grid;gap:4px}

/* Sticky Leiste: Rahmenfläche, Linie erst beim Scrollen */
.leiste{position:relative;z-index:5;background:var(--rahmenflaeche);
  margin:16px calc(-1 * max(16px,env(safe-area-inset-left,0px))) 0;
  padding:10px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));
  display:grid;gap:10px;border-bottom:1px solid transparent;transition:border-color 120ms ease}
.leiste.schwebend{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 57px);margin:0;z-index:8;
  padding-left:max(16px,env(safe-area-inset-left,0px),calc((100% - 680px) / 2));padding-right:max(16px,env(safe-area-inset-right,0px),calc((100% - 680px) / 2));
  border-bottom-color:var(--linie);box-shadow:var(--schatten-hoch);animation:panel-ein 240ms cubic-bezier(.22,1,.36,1) both}
.leiste.schwebend .filter{margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px),calc((100vw - 680px) / 2)));padding-inline:max(16px,env(safe-area-inset-left,0px),calc((100vw - 680px) / 2))}
@keyframes panel-ein{from{opacity:0;translate:0 -12px}to{opacity:1;translate:0 0}}

/* Mini-Kopf beim Scrollen: Zeichen links, Suche/Filter über runde Icon-Taste rechts */
.minikopf{position:fixed;left:0;right:0;top:0;z-index:9;background:var(--rahmenflaeche);border-bottom:1px solid var(--linie);
  padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-right,0px),calc((100% - 680px) / 2)) 0 max(16px,env(safe-area-inset-left,0px),calc((100% - 680px) / 2));
  transform:translateY(-100%);transition:transform 160ms ease-out;visibility:hidden}
.minikopf.on{transform:none;visibility:visible}
.minikopf .innen-kopf{height:56px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.minikopf .zeichen{width:24px;height:24px}
.minikopf .kopf-titel{font-size:16px;line-height:24px;font-weight:600;letter-spacing:-.018em;margin:0 auto 0 10px}
.icon-taste.frei{position:relative;width:40px;height:40px}
.icon-taste.frei::after{content:"";position:absolute;inset:-2px}
.icon-taste.frei svg{transition:transform 160ms ease-out}
.icon-taste.frei[aria-expanded="true"] svg{transform:rotate(180deg)}
.icon-taste.frei[aria-expanded="true"]{background-color:var(--ort-aktiv)}
.punkt{position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--zaehler);box-shadow:0 0 0 2px var(--objekt)}
.suche{position:relative}
.suche svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--tertiaer);pointer-events:none}
.suche input{width:100%;height:44px;border:1px solid var(--linie);border-radius:var(--radius-aktion);background:var(--objekt);
  padding:0 44px 0 42px;font-size:16px;outline-offset:2px;transition:border-color 120ms ease}
.suche input::placeholder{color:var(--tertiaer)}
.suche input:hover{border-color:var(--rahmen)}
.suche input::-webkit-search-cancel-button{display:none}
.leeren{position:absolute;right:2px;top:50%;transform:translateY(-50%);width:40px;height:40px;border:0;border-radius:var(--radius-aktion);background:transparent;color:var(--tertiaer);display:grid;place-items:center}
.leeren:hover{background-image:linear-gradient(var(--hover),var(--hover))}

/* Umschalter = Ort-Leiter */
.umschalter{display:grid;grid-template-columns:repeat(3,1fr);background:var(--leiste);border:1px solid var(--linie);border-radius:var(--radius-aktion);padding:3px;gap:2px}
.umschalter button{border:0;background:transparent;border-radius:var(--radius-aktion);min-height:38px;font-size:14px;font-weight:500;color:var(--text-sekundaer);
  display:flex;align-items:center;justify-content:center;gap:6px}
.umschalter button:hover{background-image:linear-gradient(var(--hover),var(--hover))}
.umschalter button[aria-pressed="true"]{background-color:var(--ort-aktiv);color:var(--foreground);font-weight:600}
.umschalter .zahl{color:var(--tertiaer);font-weight:500}
.umschalter button[aria-pressed="true"] .zahl{color:var(--text-sekundaer)}

/* Themen-Filter = Toggle: gewählt in Marke */
.filter{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:2px max(16px,env(safe-area-inset-left,0px))}
.filter::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;min-height:36px;padding:0 14px;border-radius:var(--radius-aktion);border:1px solid var(--linie);
  background:var(--objekt);color:var(--text-sekundaer);font-size:13px;font-weight:500;white-space:nowrap;position:relative}
.chip::after{content:"";position:absolute;inset:-4px 0}
.chip:hover{background-image:linear-gradient(var(--hover),var(--hover))}
.chip[aria-pressed="true"]{background-color:var(--gewaehlt);border-color:var(--gewaehlt);color:var(--gewaehlt-text);font-weight:600}

/* Widget Typ A: Titel außen, Karte weiß */
.bereich{margin-top:20px;display:grid;gap:10px}
.bereich>header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-inline:4px}
.karte{background:var(--objekt);border:1px solid var(--linie);border-radius:var(--radius-karte);box-shadow:var(--schatten-widget);overflow:hidden}
.zeile{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:14px;align-items:center;width:100%;text-align:left;border:0;background:transparent;
  padding:12px 16px;min-height:88px;position:relative;transition:background-color 120ms ease}
.zeile+.zeile{box-shadow:inset 0 1px 0 var(--linie)}
.zeile:hover{background-image:linear-gradient(var(--hover),var(--hover))}
.zeile:active{background-image:linear-gradient(var(--pressed),var(--pressed))}
.zeile .info{min-width:0;display:grid;gap:2px}
.zeile .t{font-size:16px;line-height:22px;font-weight:600;letter-spacing:-.012em}
.zeile .t,.zeile .meta{overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;hyphens:auto}
.zeile .rechts{display:flex;align-items:center;gap:8px}
.chev{width:7px;height:12px;color:var(--tertiaer)}

/* Cover: typografische Tafel, nur Neutral */
.cover{--c:var(--cover-a);--t:var(--cover-a-t);aspect-ratio:2/3;width:100%;max-width:100%;border-radius:3px 6px 6px 3px;background:var(--c);color:var(--t);
  position:relative;overflow:hidden;box-shadow:inset 0 0 0 1px color-mix(in oklab,var(--foreground) 8%,transparent);
  display:flex;flex-direction:column;justify-content:space-between;padding:9% 10% 10%}
.cover .form{position:absolute;right:-12%;bottom:-8%;width:62%;aspect-ratio:1;background:currentColor;opacity:.14}
.cover .form.kreis{border-radius:50%}
.cover .form.halb{border-radius:999px 999px 0 0;aspect-ratio:2/1;width:78%;right:-6%;bottom:0}
.cover .form.balken{width:20%;aspect-ratio:auto;top:0;bottom:0;right:14%}
.cover .ct{font-weight:600;line-height:1.06;letter-spacing:-.02em;overflow:hidden;word-break:break-word;hyphens:auto;position:relative}
.cover .ca{font-weight:500;opacity:.75;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;position:relative}
.zeile .cover .ct{font-size:6.5px}.zeile .cover .ca{font-size:5px}
.gross .cover .ct{font-size:14px}.gross .cover .ca{font-size:9px}
.cover-bild{position:absolute;inset:0;display:block;width:100%;height:100%;object-fit:cover;background:var(--erhoeht)}
.quellen{margin:0 4px;display:grid;gap:4px;font-size:13px;line-height:20px;color:var(--tertiaer)}
.quellen p{margin:0}
.quellen a{color:var(--link);text-underline-offset:2px}

/* Badge: Statuspille mit Punkt */
.badge{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:var(--radius-aktion);font-size:12px;line-height:18px;font-weight:500;white-space:nowrap;
  border:1px solid color-mix(in oklab,currentColor 30%,transparent)}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.badge.erfolg{background:var(--status-erfolg-flaeche);color:var(--status-erfolg-text)}
.badge.info{background:var(--status-info-flaeche);color:var(--status-info-text)}
.badge.warnung{background:var(--status-warnung-flaeche);color:var(--status-warnung-text)}

/* ===== Speicher ===== */
const PIN_AKTIONEN = ["checkPin", "setPin", "saveBook", "deleteRating", "analyze"];
const lokal = () => ({ books: ls.get("bib.books", []), loans: ls.get("bib.loans", []), ratings: ls.get("bib.ratings", []) });
const LocalStore = {
  mode: "local",
  async list(){ return lokal(); },
  async act(p){
    const d = lokal(), now = new Date().toISOString();
    if ((PIN_AKTIONEN.includes(p.action) || (p.action === "upload" && p.zweck === "cover")) && p.pin !== ls.get("bib.pin", "0000")) throw new Error("PIN ist nicht richtig.");
    switch (p.action){
      case "checkPin": return { ok: true };
      case "setPin": ls.set("bib.pin", p.neu); return { ok: true };
      case "upload": return { ok: true, medium: { typ: p.typ, url: p.dataUrl, thumb: p.thumbUrl || p.dataUrl } };
      case "analyze": throw new Error("KI-Analyse geht nur mit verbundener Tabelle. Bitte Daten von Hand ergänzen.");
      case "saveBook": {
        if (!d.books.length && p.seed) d.books = p.seed;
        const i = d.books.findIndex(b => b.id === p.book.id);
        if (i >= 0) d.books[i] = p.book; else d.books.push(p.book);
        if (!ls.set("bib.books", d.books)) throw new Error("Der Gerätespeicher ist voll. Bitte kleinere Bilder nutzen.");
        break;
      }
      case "deleteRating": d.ratings = d.ratings.filter(r => r.id !== p.id); ls.set("bib.ratings", d.ratings); break;
      case "rate": {
        const r = d.ratings.find(x => x.bookId === p.bookId && x.kuerzel === p.kuerzel);
        const daten = { sterne: p.sterne, kommentar: p.kommentar, medien: p.medien || [], am: now };
        if (r) Object.assign(r, daten); else d.ratings.push({ id: uid(), bookId: p.bookId, kuerzel: p.kuerzel, ...daten });
        if (!ls.set("bib.ratings", d.ratings)) throw new Error("Der Gerätespeicher ist voll. Bitte weniger oder kleinere Medien anhängen.");
        break;
      }
      case "borrow":
        if (d.loans.some(l => l.bookId === p.bookId && !l.returnedAt)) throw new Error("Dieses Buch ist gerade verliehen.");
        d.loans.push({ id: uid(), bookId: p.bookId, kuerzel: p.kuerzel, borrowedAt: now, dueAt: addDays(now, CONFIG.LOAN_DAYS), extended: false, returnedAt: null });
        ls.set("bib.loans", d.loans); break;
      case "extend": case "return": {
        const l = d.loans.find(x => x.id === p.loanId);
        if (!l || l.returnedAt) throw new Error("Diese Ausleihe ist schon abgeschlossen.");
        if (p.action === "extend"){ if (l.extended) throw new Error("Schon einmal verlängert."); l.dueAt = addDays(l.dueAt, CONFIG.LOAN_DAYS); l.extended = true; }
        else l.returnedAt = now;
        ls.set("bib.loans", d.loans); break;

};
const RemoteStore = {
  mode: "remote",
  async list(){
    const r = await fetch(CONFIG.API_URL + "?action=list", { cache: "no-store" });
    const j = await r.json(); if (!j.ok) throw new Error(j.error || "Laden fehlgeschlagen."); return j;
  },
  async act(p){
    const r = await fetch(CONFIG.API_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(p) });
    const j = await r.json(); if (!j.ok) throw new Error(j.error || "Speichern fehlgeschlagen."); return j;

};
const Store = CONFIG.API_URL ? RemoteStore : LocalStore;

/* ===== Zustand ===== */
const S = {
  books: SEED.map(normBuch), fromSeed: true, loans: [], ratings: [],
  q: "", status: "all", topic: null,
  view: null, open: null, busy: false, entwurf: null, edit: null, loeschFrage: null,

function apply(j){
  if (Array.isArray(j.books)){ S.fromSeed = !j.books.length; S.books = (j.books.length ? j.books : SEED).map(normBuch); }
  if (Array.isArray(j.loans)) S.loans = j.loans;
  if (Array.isArray(j.ratings)) S.ratings = j.ratings;
}
const sichtbar = () => S.books.filter(b => b.aktiv !== false);
const buchVon = id => S.books.find(b => b.id === id);
const openLoan = id => S.loans.find(l => l.bookId === id && !l.returnedAt);
const historie = id => S.loans.filter(l => l.bookId === id && l.returnedAt).sort((a, b) => b.returnedAt.localeCompare(a.returnedAt));
function status(id){
  const l = openLoan(id);
  if (!l) return { key:"free", label:"Verfügbar", cls:"erfolg" };

}

/* ===== Merkliste: nur auf diesem Gerät, ohne Anmeldung ===== */

function setzeModus(m){
  if (m === "hell") document.documentElement.setAttribute("data-theme", "light");

const bewertungen = id => S.ratings.filter(r => r.bookId === id).sort((a, b) => String(b.am).localeCompare(String(a.am)));
function schnitt(id){ const r = bewertungen(id); return r.length ? { wert: r.reduce((s, x) => s + Number(x.sterne || 0), 0) / r.length, anzahl: r.length } : null; }

/* ===== Eingabefelder: Kürzel (3 Buchstaben) und PIN (4 Ziffern) ===== */
function zeichenFelder(g, wert, art){

}
const felderVon = g => [...document.querySelectorAll(`.k-feld[data-g="${g}"]`)];

  f.forEach(x => x.setAttribute("aria-invalid", ok ? "false" : "true"));
  if (!ok){ toast("Bitte dein Kürzel eintragen: 2 oder 3 Buchstaben."); (f.find(x => !x.value) || f[0]).focus(); return null; }
  ls.set("bib.kuerzel", k); return k;
}
function lesePin(g){
  const f = felderVon(g), p = f.map(x => x.value).join("");

  f.forEach(x => x.setAttribute("aria-invalid", ok ? "false" : "true"));

/* ===== Cover ===== */
const TONES = ["a","b","c","d"], FORMS = ["kreis","halb","balken","quadrat"];
function hash(s){ let h = 0; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) >>> 0; return h; }
function coverUrl(b){
  if (b.coverVorschau) return b.coverVorschau;
  if (b.cover) return sicherUrl(b.cover);
  const isbn = String(b.isbn || "").replace(/[^0-9X]/gi, "");
  return isbn ? `https://covers.openlibrary.org/b/isbn/${isbn}-M.jpg?default=false` : "";
}
function cover(b){
  const h = hash(b.id || b.titel), t = TONES[h % 4], f = FORMS[(h >> 3) % 4];
  const last = (b.autor || "").split(",")[0].trim().split(" ").pop(), u = coverUrl(b);
  return `<div class="cover" style="--c:var(--cover-${t});--t:var(--cover-${t}-t)" aria-hidden="true"><span class="form ${f}"></span><div class="ct">${esc(b.titel || "Ohne Titel")}</div><div class="ca">${esc(last)}</div>${u ? `<img class="cover-bild" src="${esc(u)}" alt="" loading="lazy" decoding="async" referrerpolicy="no-referrer" onerror="this.remove()">` : ""}</div>`;
}

/* ===== Medien: verkleinern, hochladen, anzeigen ===== */
const ladeBild = src => new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error("Bild konnte nicht gelesen werden.")); i.src = src; });
const alsDataUrl = datei => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(r.error); r.readAsDataURL(datei); });
async function verkleinern(quelle, max, q = .82){
  const url = typeof quelle === "string" ? quelle : URL.createObjectURL(quelle);
  try {
    const img = await ladeBild(url), s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement("canvas"); c.width = Math.round(img.naturalWidth * s); c.height = Math.round(img.naturalHeight * s);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    return c.toDataURL("image/jpeg", q);
  } finally { if (typeof quelle !== "string") URL.revokeObjectURL(url); }
}
async function hochladen(quelle, zweck, typ = "bild", mime = "image/jpeg"){
  let dataUrl, thumbUrl;
  if (typ === "video"){
    const max = Store.mode === "local" ? 4 : CONFIG.MAX_VIDEO_MB;
    if (quelle.size > max * 1048576) throw new Error(`Das Video ist zu groß (höchstens ${max} MB).`);
    dataUrl = await alsDataUrl(quelle); mime = quelle.type || "video/mp4";
  } else {
    dataUrl = await verkleinern(quelle, Store.mode === "local" ? 900 : 1600, Store.mode === "local" ? .72 : .84);
    if (Store.mode === "local") thumbUrl = await verkleinern(dataUrl, 320, .75);
  }
  const p = { action: "upload", zweck, typ, mime, pin: S.admin || undefined, data: dataUrl.split(",")[1] };
  if (Store.mode === "local") Object.assign(p, { dataUrl, thumbUrl });
  return (await Store.act(p)).medium;

function thumbHtml(m){

/* ===== Liste, Empfohlen, Filter ===== */
function matches(b){
  if (S.topic && !(b.themen || []).includes(S.topic)) return false;
  if (S.status !== "all" && status(b.id).key !== S.status) return false;
  if (!S.q) return true;
  const hay = norm([b.titel, b.autor, b.verlag, (b.themen || []).join(" "), b.beschreibung, b.isbn, b.eigentum].join(" "));
  return norm(S.q).split(/\s+/).every(w => hay.includes(w));
}
function renderFilter(){
  const topics = [...new Set(sichtbar().flatMap(b => b.themen || []))].sort((a, b) => a.localeCompare(b, "de"));
  if (S.topic && !topics.includes(S.topic)) S.topic = null;
  $("#filter").innerHTML = [`<button class="chip" data-t="" aria-pressed="${!S.topic}">Alle Themen</button>`]
    .concat(topics.map(t => `<button class="chip" data-t="${esc(t)}" aria-pressed="${S.topic === t}">${esc(t)}</button>`)).join("");
}
function karussell(sektion, liste){
  const filterAktiv = S.q || S.status !== "all" || S.topic;
  $("#" + sektion).hidden = !liste.length || !!filterAktiv;
  $("#" + sektion + "-liste").innerHTML = liste.map(b => {
    const s = status(b.id);
    return `<li><button class="empfehlung" data-id="${esc(b.id)}">${cover(b)}
      <span class="e-info"><span class="e-titel">${esc(b.titel)}</span><span class="meta">${esc(b.autor)}</span><span class="badge ${s.cls}">${esc(s.label)}</span></span></button></li>`;
  }).join("");
}
function renderEmpfohlen(){
  karussell("merkliste", merkliste().map(buchVon).filter(b => b && b.aktiv !== false));
  karussell("empfohlen", sichtbar().filter(b => b.empfohlen));
  const n = merkliste().filter(id => { const b = buchVon(id); return b && b.aktiv !== false; }).length;
  $("#merkliste-zahl").textContent = n ? String(n) : "";
}
function render(){
  const alle = sichtbar(), free = alle.filter(b => status(b.id).key === "free").length;
  $("#c-all").textContent = alle.length; $("#c-free").textContent = free; $("#c-out").textContent = alle.length - free;
  $("#summary").textContent = `${alle.length} Bücher · ${free} verfügbar`;
  const items = alle.filter(matches).sort((a, b) => a.titel.localeCompare(b.titel, "de"));
  $("#treffer").textContent = items.length === alle.length ? "" : `${items.length} von ${alle.length}`;
  $("#liste").innerHTML = items.length ? items.map(b => {

  $("#leeren").hidden = !S.q;

function renderSheet(){
  if (S.view === "buch") renderBuch();
  else if (S.view === "login") renderLogin();
  else if (S.view === "admin") renderAdmin();
  else if (S.view === "edit") renderEdit();
}
function openSheet(view, id, push = true){
  if (view === "buch"){
    if (!buchVon(id)) return;
    const k = ls.get("bib.kuerzel", ""), eigene = S.ratings.find(r => r.bookId === id && r.kuerzel === k);
    S.entwurf = { sterne: eigene ? Number(eigene.sterne) : 0, kommentar: eigene ? eigene.kommentar || "" : "", kuerzel: k, medien: eigene ? [...(eigene.medien || [])] : [] };
    S.open = id; S.loeschFrage = null;
  }
  S.view = view; renderSheet();
  const sh = $("#sheet"), bd = $("#backdrop");
  if (sh.hidden){
    sh.hidden = bd.hidden = false;
    requestAnimationFrame(() => requestAnimationFrame(() => { sh.classList.add("on"); bd.classList.add("on"); }));
    document.body.style.overflow = "hidden";
  }
  sh.scrollTop = 0;
  try { history.replaceState(null, "", view === "buch" ? "#b-" + id : location.pathname + location.search); } catch {}
  if (push) setTimeout(() => { const ziel = view === "login" ? $("#p0") : $("#schliessen"); if (ziel) ziel.focus({ preventScroll: true }); }, 60);
}
function wechsle(view){ S.view = view; renderSheet(); $("#sheet").scrollTop = 0; }
function closeSheet(){
  const sh = $("#sheet"), bd = $("#backdrop"), war = S.open;
  S.view = null; S.open = null; S.edit = null;
  sh.classList.remove("on"); bd.classList.remove("on"); document.body.style.overflow = "";
  setTimeout(() => { if (!S.view) sh.hidden = bd.hidden = true; }, 240);
  try { history.replaceState(null, "", location.pathname + location.search); } catch {}
  const z = war && document.querySelector(`.zeile[data-id="${CSS.escape(war)}"]`); if (z) z.focus({ preventScroll: true });
}

  return `<div class="quellen"><p class="etikett">Quellen</p>
    <p>${q.map(x => `<a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.titel || x.url)}</a>`).join(" · ")}</p>

function syncEdit(){
  const e = S.edit; if (!e || !$("#edit-form")) return;
  const v = n => ($(`#f-${n}`) || {}).value ?? "";
  Object.assign(e.buch, {
    titel: v("titel").trim(), autor: v("autor").trim(), verlag: v("verlag").trim(), sprache: v("sprache").trim(),
    jahr: parseInt(v("jahr"), 10) || "", seiten: parseInt(v("seiten"), 10) || "", isbn: v("isbn").replace(/[^0-9Xx-]/g, ""),
    standort: v("standort").trim(), eigentum: v("eigentum").trim(), cover: v("cover").trim(), beschreibung: v("beschreibung").trim(),
    quellen: v("quellen").split("\n").map(z => { const [t, ...u] = z.split("|"); const url = (u.join("|") || t).trim(); return { titel: (u.length ? t : url).trim(), url }; }).filter(q => sicherUrl(q.url))
  });
}
function mergeBuch(z, r, auchBefuellte = false){
  for (const k of ["titel", "autor", "verlag", "jahr", "seiten", "sprache", "isbn", "beschreibung"])
    if (r[k] && (auchBefuellte || !z[k])) z[k] = r[k];
  if (Array.isArray(r.themen)) z.themen = [...new Set([...(z.themen || []), ...r.themen.filter(Boolean)])];
  if (Array.isArray(r.quellen)) r.quellen.forEach(q => { if (sicherUrl(q.url) && !(z.quellen || []).some(x => x.url === q.url)) (z.quellen ||= []).push(q); });
  if (!z.cover && r.coverUrl) z.cover = r.coverUrl;
}
const ladeSkript = src => new Promise((res, rej) => { if (document.querySelector(`script[src="${src}"]`)) return res(); const s = document.createElement("script"); s.src = src; s.onload = res; s.onerror = () => rej(new Error("Skript nicht geladen")); document.head.appendChild(s); });
const istIsbn = t => /^97[89]\d{10}$/.test(t || "");
async function isbnAusBild(dataUrl){
  const img = await ladeBild(dataUrl);
  if ("BarcodeDetector" in window){
    try { const r = await new BarcodeDetector({ formats: ["ean_13"] }).detect(img); const t = r.map(x => x.rawValue).find(istIsbn); if (t) return t; } catch {}
  }
  try {
    await ladeSkript("https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js");
    const hints = new Map(); hints.set(ZXing.DecodeHintType.TRY_HARDER, true);
    const t = (await new ZXing.BrowserMultiFormatReader(hints).decodeFromImageElement(img)).getText();
    if (istIsbn(t)) return t;
  } catch {}
  return null;
}
async function nachschlagen(isbn){
  const r = { isbn, quellen: [] };
  try {
    const j = await (await fetch(`https://openlibrary.org/api/books?bibkeys=ISBN:${isbn}&format=json&jscmd=data`)).json(), d = j[`ISBN:${isbn}`];
    if (d){
      r.titel = d.title + (d.subtitle ? `: ${d.subtitle}` : ""); r.autor = (d.authors || []).map(a => a.name).join(", ");
      r.verlag = (d.publishers || [])[0]?.name; const y = String(d.publish_date || "").match(/\d{4}/); if (y) r.jahr = +y[0];
      r.seiten = d.number_of_pages; if (d.cover) r.coverUrl = d.cover.large || d.cover.medium;
      if (d.url) r.quellen.push({ titel: "Open Library", url: d.url });
    }
  } catch {}
  try {
    const j = await (await fetch(`https://www.googleapis.com/books/v1/volumes?q=isbn:${isbn}`)).json(), v = j.items?.[0]?.volumeInfo;
    if (v){
      r.titel ||= v.title + (v.subtitle ? `: ${v.subtitle}` : ""); r.autor ||= (v.authors || []).join(", "); r.verlag ||= v.publisher;
      if (!r.jahr && v.publishedDate) r.jahr = parseInt(String(v.publishedDate).slice(0, 4), 10) || undefined;
      r.seiten ||= v.pageCount; r.sprache = { de: "Deutsch", en: "Englisch", fr: "Französisch", es: "Spanisch", it: "Italienisch" }[v.language] || v.language;
      if (!r.coverUrl && v.imageLinks?.thumbnail) r.coverUrl = v.imageLinks.thumbnail.replace(/^http:/, "https:");
      if (v.infoLink) r.quellen.push({ titel: "Google Books", url: v.infoLink.replace(/^http:/, "https:") });
    }
  } catch {}
  return r;
}
async function fotoVerarbeiten(key, datei){
  const e = S.edit; syncEdit();
  e.fotos[key] = await verkleinern(datei, 1600, .85);
  if (key === "cover" && !e.buch.cover && !e.fotoAlsCover) e.fotoAlsCover = true;
  e.info = "Suche ISBN im Foto …"; renderEdit();
  const isbn = await isbnAusBild(e.fotos[key]);
  if (!S.edit) return;
  if (isbn){
    e.info = `ISBN ${isbn} erkannt. Suche Angaben …`; renderEdit();
    const r = await nachschlagen(isbn); syncEdit(); mergeBuch(e.buch, r, e.neu);
    if (r.coverUrl && e.fotoAlsCover && !e.coverDatei) e.fotoAlsCover = false;
    e.info = r.titel ? `ISBN ${isbn}: Angaben${r.coverUrl ? " und Original-Cover" : ""} übernommen. Bitte prüfen.` : `ISBN ${isbn} erkannt, aber keine Angaben gefunden. „Mit KI ausfüllen“ probieren.`;
  } else e.info = key === "rueck" ? "Keine ISBN erkannt. „Mit KI ausfüllen“ nutzen oder Angaben von Hand eintragen." : "Foto übernommen. Für die ISBN noch die Rückseite fotografieren.";
  renderEdit();
}
async function kiAnalyse(){
  const e = S.edit; syncEdit(); e.laeuft = true; e.info = "KI analysiert die Fotos …"; renderEdit();
  try {
    const bilder = [];
    for (const f of [e.fotos.cover, e.fotos.rueck]) if (f) bilder.push((await verkleinern(f, 1200, .8)).split(",")[1]);
    const j = await Store.act({ action: "analyze", pin: S.admin, bilder });
    const d = j.daten || {}; syncEdit(); mergeBuch(e.buch, d, false);
    if (istIsbn(String(d.isbn || "").replace(/\D/g, ""))){ const r = await nachschlagen(String(d.isbn).replace(/\D/g, "")); mergeBuch(e.buch, r, false); if (r.coverUrl && !e.coverDatei) e.fotoAlsCover = false; }
    e.info = "KI-Vorschlag übernommen. Bitte prüfen und speichern.";
  } catch (err){ e.info = err.message || "KI-Analyse fehlgeschlagen."; }
  e.laeuft = false; if (S.view === "edit") renderEdit();
}

  if (e.key === "Tab") menue(false);
});
document.addEventListener("click", e => { if (!menueEl.hidden && !e.target.closest("#einstellungen-menue, #einstellungen")) menue(false); });

/* ===== Mini-Kopf: erscheint, sobald die Suchleiste aus dem Bild ist ===== */
const platz = $("#leiste-platz"), leiste = $("#leiste"), mini = $("#minikopf"), miniTaste = $("#mini-filter");
let miniAn = false;
function setFilter(offen){
  offen = offen && miniAn; miniTaste.setAttribute("aria-expanded", offen);
  if (offen && !leiste.classList.contains("schwebend")){ platz.style.height = platz.offsetHeight + "px"; leiste.classList.add("schwebend"); }
  if (!offen && leiste.classList.contains("schwebend")){ leiste.classList.remove("schwebend"); platz.style.height = ""; }
}
function pruefeMini(){
  const an = platz.getBoundingClientRect().bottom < 0;
  if (an === miniAn) return;
  miniAn = an; mini.classList.toggle("on", an); mini.setAttribute("aria-hidden", String(!an)); miniTaste.tabIndex = an ? 0 : -1;
  if (!an) setFilter(false);
}
miniTaste.addEventListener("click", () => setFilter(miniTaste.getAttribute("aria-expanded") !== "true"));
document.addEventListener("keydown", e => { if (e.key === "Escape" && !S.view && leiste.classList.contains("schwebend")){ setFilter(false); miniTaste.focus(); } });
$("#liste").addEventListener("click", () => setFilter(false));
window.addEventListener("scroll", pruefeMini, { passive: true });
window.addEventListener("resize", pruefeMini, { passive: true });
window.addEventListener("hashchange", () => { const m = location.hash.match(/^#b-(.+)$/); if (m && m[1] !== S.open) openSheet("buch", m[1], false); });

/* ===== Start ===== */
async function refresh(){
  try { apply(await Store.list()); renderFilter(); render(); }
  catch { if (Store.mode === "remote") toast("Keine Verbindung. Angezeigt wird der letzte Stand."); }
}
(async function start(){
  if (Store.mode === "local"){ $("#vorschau").hidden = false;
    $("#vorschau-text").textContent = "Vorschau: Änderungen bleiben nur auf diesem Gerät. Mit verbundener Tabelle sehen alle denselben Stand."; }
  renderFilter(); render(); await refresh();
  const m = location.hash.match(/^#b-(.+)$/); if (m) openSheet("buch", m[1], false);
  if (Store.mode === "remote"){ setInterval(() => { if (S.view !== "edit") refresh(); }, 60000); document.addEventListener("visibilitychange", () => { if (!document.hidden && S.view !== "edit") refresh(); }); }
})();
</script>
