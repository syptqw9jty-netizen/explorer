function bildpunkt(p){var q=p.clone().sub(C0);return{x:q.dot(RI),y:q.dot(UP)}}
/* Bildschirmpunkt -> Weltpunkt über die Tiefe der Kulisse */

  var u=(mu-t.u0)/K.TW,v=(mv-t.v0)/K.TH,ix=Math.min(t.cd.w-1,Math.floor(u*t.cd.w)),iy=Math.min(t.cd.h-1,Math.floor((1-v)*t.cd.h)),d=t.cd.a[iy*t.cd.w+ix]/65535;if(d>0.999)return null;var z=K.near+d*(K.far-K.near);

/* nur, was man vom Start aus erreicht, bleibt begehbar (keine eingeschlossenen Innenräume) */
function erreichbar(sp){var nx=WALK.nx,N=nx*WALK.nz,seen=new Uint8Array(N),Q=new Int32Array(N),a=0,b=0,s=sp.j*nx+sp.i;seen[s]=1;Q[b++]=s;while(a<b){var k=Q[a++],ci=k%nx,cj=k/nx|0,h0=WALK.a[k];for(var d=0;d<4;d++){var ni=ci+(d===0?1:d===1?-1:0),nj=cj+(d===2?1:d===3?-1:0),v=zh(ni,nj);if(v===65535||Math.abs(v-h0)>45)continue;var nk=nj*nx+ni;if(!seen[nk]){seen[nk]=1;Q[b++]=nk}}}for(var i=0;i<N;i++)if(!seen[i])WALK.a[i]=65535}
