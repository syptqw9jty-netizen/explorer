<!DOCTYPE html>
<html lang="de">
<head>

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<style>
html,body{margin:0;height:100%;background:#02030a;overflow:hidden;touch-action:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  font-family:-apple-system,"Helvetica Neue",Helvetica,Arial,sans-serif;color:#fff}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.glass{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.15);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  box-shadow:0 0 24px rgba(255,190,120,.10),inset 0 1px 0 rgba(255,255,255,.14)}
#hud{position:fixed;top:calc(14px + env(safe-area-inset-top));left:14px;padding:8px 14px;border-radius:999px;font-size:13px;
  letter-spacing:.06em;display:flex;gap:13px;opacity:0;transition:opacity 1.5s;pointer-events:none}
#hud b{font-weight:500;opacity:.95}
#hud span{opacity:.6;margin-right:5px}
#flow{position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom));height:3px;width:0;border-radius:3px;transform:translateX(-50%);
  background:#ffe2b0;box-shadow:0 0 16px 3px rgba(255,200,130,.75);pointer-events:none;opacity:0;transition:opacity 1.5s}
#mode{position:fixed;right:14px;bottom:calc(44px + env(safe-area-inset-bottom));padding:11px 15px;border-radius:999px;font-size:11px;letter-spacing:.16em;opacity:0;transition:opacity 1.5s;cursor:pointer}
#spd{position:fixed;left:0;right:0;bottom:calc(38px + env(safe-area-inset-bottom));text-align:center;font-size:12px;font-weight:300;letter-spacing:.2em;opacity:0;transition:opacity 1.5s;pointer-events:none;text-shadow:0 0 10px rgba(0,0,0,.7)}
#title{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:radial-gradient(ellipse at 50% 62%,rgba(255,120,50,.16),rgba(2,3,10,.82) 62%);
  transition:opacity 1.2s;cursor:pointer;text-align:center}
#title h1{font-weight:200;font-size:clamp(20px,6.4vw,44px);letter-spacing:.34em;margin:0 0 0 .34em}
#title p{font-weight:300;font-size:12px;letter-spacing:.3em;opacity:.6;margin-top:26px;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
#hint{position:fixed;left:0;right:0;bottom:9%;text-align:center;font-size:12px;font-weight:300;
  letter-spacing:.16em;opacity:0;transition:opacity 1.5s;pointer-events:none;line-height:2;text-shadow:0 0 12px rgba(0,0,0,.8)}

#stick,#knob{position:fixed;border-radius:50%;pointer-events:none;display:none;transform:translate(-50%,-50%)}
#stick{width:96px;height:96px}
#knob{width:30px;height:30px;background:rgba(255,255,255,.35);box-shadow:0 0 18px rgba(255,255,255,.4)}

#way{position:fixed;top:40%;width:10px;height:10px;border-radius:50%;background:#ffd89a;
  box-shadow:0 0 18px 6px rgba(255,190,110,.7);opacity:0;transition:opacity .8s;pointer-events:none}

</head>
