*{box-sizing:border-box}
body{background:var(--background);color:var(--foreground);font-family:var(--font-ui);font-size:15px;line-height:22px;letter-spacing:-.0025em;
  font-feature-settings:"cv01","cv09","ss03","calt","liga";-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--rahmenflaeche)}
::selection{background:color-mix(in oklab,var(--marke-500) 28%,transparent)}
button,input,textarea,select{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--fokus);outline-offset:2px;box-shadow:0 0 0 2px var(--fokus-innen)}
.wrap{max-width:var(--inhalt);margin:0 auto;padding-block:16px 48px}

.etikett{font-size:11px;line-height:16px;font-weight:500;text-transform:uppercase;letter-spacing:.04em;color:var(--tertiaer)}
.titel-seite{font-size:28px;line-height:36px;font-weight:600;letter-spacing:-.02em;margin:0;text-wrap:balance}
.titel-app{font-size:34px;line-height:40px;letter-spacing:-.025em}
.titel-bereich{font-size:17px;line-height:24px;font-weight:600;letter-spacing:-.016em;margin:0}
.titel-karte{font-size:16px;line-height:22px;font-weight:600;letter-spacing:-.012em;margin:0}
.meta{font-size:13px;line-height:20px;color:var(--text-sekundaer)}
.zahl{font-variant-numeric:tabular-nums}

.kopf{display:flex;align-items:center;gap:10px;margin-bottom:20px}
.zeichen{width:28px;height:28px;color:var(--logo);flex:none}
.seitenkopf{display:grid;gap:4px}

.leiste{position:relative;z-index:5;background:var(--rahmenflaeche);
  margin:16px calc(-1 * max(16px,env(safe-area-inset-left,0px))) 0;
  padding:10px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));
  display:grid;gap:10px;grid-template-columns:minmax(0,1fr);border-bottom:1px solid transparent}
.leiste.schwebend{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 57px);margin:0;z-index:8;
  padding-left:max(16px,env(safe-area-inset-left,0px),calc((100% - var(--inhalt)) / 2));padding-right:max(16px,env(safe-area-inset-right,0px),calc((100% - var(--inhalt)) / 2));
  border-bottom-color:var(--linie);box-shadow:var(--schatten-hoch);animation:panel-ein 240ms cubic-bezier(.22,1,.36,1) both}
.leiste.schwebend .filter{margin-right:calc(-1 * max(16px,env(safe-area-inset-right,0px),calc((100vw - var(--inhalt)) / 2)));padding-right:max(16px,env(safe-area-inset-right,0px),calc((100vw - var(--inhalt)) / 2))}
@keyframes panel-ein{from{opacity:0;translate:0 -12px}to{opacity:1;translate:0 0}}
.minikopf{position:fixed;left:0;right:0;top:0;z-index:9;background:var(--rahmenflaeche);border-bottom:1px solid var(--linie);
  padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-right,0px),calc((100% - var(--inhalt)) / 2)) 0 max(16px,env(safe-area-inset-left,0px),calc((100% - var(--inhalt)) / 2));
  transform:translateY(-100%);transition:transform 160ms ease-out;visibility:hidden}
.minikopf.on{transform:none;visibility:visible}
.minikopf .innen-kopf{height:56px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.minikopf .zeichen{width:24px;height:24px}
.minikopf .kopf-titel{display:flex;align-items:center;gap:10px;font-size:17px;line-height:24px;font-weight:500;letter-spacing:-.016em;margin:0 auto 0 8px;white-space:nowrap;min-width:0}
.minikopf .kopf-titel::before{content:"";flex:none;width:2px;height:20px;border-radius:1px;background:color-mix(in oklab,var(--foreground) 22%,transparent)}
.icon-taste.frei{width:40px;height:40px}
.icon-taste.frei::after{content:"";position:absolute;inset:-2px}
.icon-taste.frei svg{transition:transform 160ms ease-out}
.mini-filter[aria-expanded="true"]{background-color:var(--ort-aktiv)}
.mini-filter[aria-expanded="true"] .pfeil{transform:rotate(180deg)}
.icon-taste.mini-filter{width:auto;min-width:40px;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 14px 0 16px;font-size:14px;font-weight:500;white-space:nowrap;flex:none}
@media (max-width:359px){.mini-filter-text{display:none}.icon-taste.mini-filter{width:40px;padding:0}}
.merk-taste{position:relative;flex:none}
.merk-taste svg{width:20px;height:20px}
.zaehler-zahl{position:absolute;top:-6px;right:-6px;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--gewaehlt-text-flaeche);color:var(--gewaehlt-text-farbe);
  font-size:11px;line-height:20px;font-weight:600;text-align:center;font-variant-numeric:tabular-nums;box-shadow:0 0 0 2px var(--rahmenflaeche)}
.kopf .merk-taste{margin-left:auto}
.umschalter{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--leiste);border:1px solid var(--linie);border-radius:var(--radius-aktion);padding:3px;gap:2px}
.umschalter button{border:0;background:transparent;border-radius:var(--radius-aktion);min-height:38px;font-size:14px;font-weight:500;color:var(--text-sekundaer);
  display:flex;align-items:center;justify-content:center;gap:6px;padding:0 8px;white-space:nowrap}
.umschalter button:hover{background-image:linear-gradient(var(--hover),var(--hover))}
.umschalter button[aria-pressed="true"]{background-color:var(--ort-aktiv);color:var(--foreground);font-weight:600}
.umschalter .zahl{color:var(--tertiaer);font-weight:500}

.suche{position:relative}
.suche svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--tertiaer);pointer-events:none}
.suche input{width:100%;height:44px;border:1px solid var(--linie);border-radius:var(--radius-aktion);background:var(--objekt);padding:0 16px 0 42px;font-size:16px}
.suche input::placeholder{color:var(--tertiaer)}
.suche input:hover{border-color:var(--rahmen)}
.suche input::-webkit-search-cancel-button{display:none}
.filter{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-right:calc(-1 * max(16px,env(safe-area-inset-right,0px)));padding:2px max(16px,env(safe-area-inset-right,0px)) 2px 0}
.filter::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 14px;border-radius:var(--radius-aktion);border:1px solid var(--linie);
  background:var(--objekt);color:var(--text-sekundaer);font-size:13px;font-weight:500;white-space:nowrap;position:relative}
.chip::after{content:"";position:absolute;inset:-4px 0}
.chip:hover{background-image:linear-gradient(var(--hover),var(--hover))}
.chip[aria-pressed="true"]{background-color:var(--gewaehlt-text-flaeche);border-color:var(--gewaehlt-text-flaeche);color:var(--gewaehlt-text-farbe);font-weight:600}
.chip .zahl{opacity:.75}

.bereich{margin-top:20px;display:grid;gap:10px}
.bereich>header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-inline:4px;min-height:36px}
.karte{background:var(--objekt);border:1px solid var(--linie);border-radius:var(--radius-karte);box-shadow:var(--schatten-widget);overflow:hidden}
.zeile{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:14px;align-items:center;width:100%;text-align:left;border:0;background:transparent;
  padding:12px 16px;min-height:76px;position:relative;transition:background-color 120ms ease;color:inherit}
.zeile+.zeile{box-shadow:inset 0 1px 0 var(--linie)}
button.zeile:hover{background-image:linear-gradient(var(--hover),var(--hover))}
.zeile .info{min-width:0;display:grid;gap:2px}
.zeile .t{font-size:16px;line-height:22px;font-weight:600;letter-spacing:-.012em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.zeile .info>.meta{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.zeile .rechts{display:grid;justify-items:end;gap:4px;text-align:right}
.zeile .rechts b{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.zeile.ohne-bild{grid-template-columns:minmax(0,1fr) auto}
.chev{width:7px;height:12px;color:var(--tertiaer)}
.zeile .t.zwei-zeilen{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;font-size:15px;line-height:20px}
.zeile .unten-z{display:flex;margin-top:4px}
.zeile .rechts{grid-auto-flow:column;align-items:center;gap:10px}
.kuerzel-marke{display:inline-block;margin-right:6px;padding:0 6px;border-radius:6px;background:var(--leiste);border:1px solid var(--linie);font-size:12px;line-height:18px;font-weight:600;letter-spacing:.04em;vertical-align:1px}
.p-info .etikett{font-size:10px;line-height:14px}
.karussell{list-style:none;margin:0 calc(-1 * max(16px,env(safe-area-inset-right,0px))) 0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:2px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));
  display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding-inline:max(16px,env(safe-area-inset-left,0px));scrollbar-width:none;overscroll-behavior-x:contain}

  box-shadow:var(--schatten-widget);isolation:isolate;display:block}
.fotokarte .fk-bild{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform 400ms cubic-bezier(.22,1,.36,1)}
.fotokarte:not(.mit-szene){background:#1f2a4d}

.fotokarte:not(.mit-szene) .fk-scrim{display:none}
.fotokarte:not(.mit-szene):hover .fk-bild{transform:none}
.fotokarte .fk-leer{position:absolute;inset:0 0 132px;display:grid;place-items:center;color:color-mix(in oklab,var(--primary-foreground) 60%,transparent)}
.fotokarte .fk-leer svg{width:48px;height:48px}
.fotokarte .fk-scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgb(10 14 30 / 0) 38%,rgb(10 14 30 / .38) 62%,rgb(10 14 30 / .82) 100%)}
.fotokarte .fk-marke{position:absolute;left:12px;top:12px;z-index:1;display:inline-flex;align-items:center;height:26px;padding:0 11px;border-radius:999px;background:var(--marke-700);color:#fff;font-size:12px;font-weight:600;letter-spacing:.01em}

th,td{padding:10px 12px;text-align:left;white-space:nowrap}
th{font-size:11px;line-height:16px;font-weight:500;text-transform:uppercase;letter-spacing:.04em;color:var(--tertiaer);background:var(--leiste)}
td.r,th.r{text-align:right}
tbody tr+tr td{box-shadow:inset 0 1px 0 var(--linie)}
tfoot td{font-weight:600;box-shadow:inset 0 1px 0 var(--rahmen)}
td .warn-text{color:var(--status-warnung-text);font-weight:600}
.monat-wahl{display:flex;align-items:center;gap:8px}
.monat-wahl .t{min-width:132px;text-align:center;font-weight:600}
.code-block{margin:0;padding:12px 14px;border-radius:var(--radius-block);background:var(--leiste);border:1px solid var(--linie);font:13px/20px ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap;overflow-wrap:anywhere;max-height:240px;overflow:auto}
.foto-reihe{display:flex;gap:8px;flex-wrap:wrap}
.foto{width:80px;height:100px;border-radius:var(--radius-zeile);border:1px solid var(--linie);overflow:hidden;position:relative;background:var(--leiste)}
.foto img{width:100%;height:100%;object-fit:cover;display:block}
.foto .weg{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:50%;border:1px solid var(--linie);background:var(--objekt);display:grid;place-items:center;padding:0}
.foto-hinzu{width:80px;height:100px;border-radius:var(--radius-zeile);border:1px dashed var(--rahmen);display:grid;place-items:center;align-content:center;gap:4px;color:var(--text-sekundaer);font-size:12px;font-weight:500;cursor:pointer;background:var(--objekt);text-align:center;padding:4px}
.foto-hinzu svg{width:20px;height:20px}
.var-tabelle{display:grid;gap:8px}
.var-zeile{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1.4fr) minmax(0,.9fr) 44px;gap:8px;align-items:center}
.var-zeile.kopf-z{font-size:11px;line-height:16px;font-weight:500;text-transform:uppercase;letter-spacing:.04em;color:var(--tertiaer)}
.var-zeile .icon-taste{width:44px;height:44px}
.fuss{margin-top:28px;display:grid;justify-items:center;gap:8px}
.fuss #verwaltung-taste{min-height:44px;padding:0 18px;font-size:14px}
.kopf .zurueck{margin-left:auto}
.kopf .zurueck:not([hidden])+.merk-taste{margin-left:0}
.setup{display:grid}
.setup button{display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;min-height:56px;padding:8px 16px;border:0;background:transparent;text-align:left;color:inherit}
.setup button+button{box-shadow:inset 0 1px 0 var(--linie)}
.setup button:hover{background-image:linear-gradient(var(--hover),var(--hover))}
.setup .kreis{width:18px;height:18px;border-radius:50%;border:2px solid var(--status-warnung-text)}
.setup .info{display:grid;min-width:0}
.setup .meta{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
button.kennzahl{text-align:left;color:inherit;font:inherit}
button.kennzahl:hover{background-image:linear-gradient(var(--hover),var(--hover))}
.fuss .segment{width:min(100%,320px)}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);opacity:0;z-index:40;
  background:var(--primary);color:var(--primary-foreground);padding:12px 18px;border-radius:var(--radius-aktion);font-size:14px;font-weight:500;box-shadow:var(--schatten-hoch);
  transition:opacity 160ms ease-out,transform 160ms ease-out;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast.hoch{bottom:calc(88px + env(safe-area-inset-bottom,0px))}
.sr-only{position:absolute!important;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
@media (min-width:1024px){
  :root{--inhalt:1040px}
  .wrap{padding-block:32px 64px}
  .titel-app{font-size:40px;line-height:48px}
  .produkte{grid-template-columns:repeat(4,minmax(0,1fr))}
  .filter{flex-wrap:wrap;overflow:visible;margin-right:0;padding-right:0}
  .leiste:not(.schwebend){grid-template-columns:minmax(320px,400px) minmax(0,1fr);align-items:center}
  .leiste:not(.schwebend) .filter{grid-column:1/-1}
  .leiste:not(.schwebend)>.filter:only-child{grid-column:1/-1}
  .produkt .p-bild{aspect-ratio:1/1}
  .sheet{width:720px;margin-left:-360px}
}
@media (max-width:359px){.titel-app{font-size:30px;line-height:36px}.produkte{gap:8px}.var-zeile{grid-template-columns:minmax(0,1fr) minmax(0,1fr) 64px 44px}}
@media (prefers-reduced-motion:reduce){*{transition-duration:0ms!important;animation-duration:0ms!important}}

<script>
/* ===== Konfiguration ===== */
const KATEGORIEN = ["Kleidung", "Büro", "Alltag", "Sonstiges"];
const GROESSEN = ["XS", "S", "M", "L", "XL", "XXL", "3XL"];

const ls = {

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const norm = s => String(s ?? "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/ß/g, "ss");
const uid = () => (crypto.randomUUID ? crypto.randomUUID().replace(/-/g, "").slice(0, 16) : Date.now().toString(36) + Math.random().toString(36).slice(2, 8));
const r2 = n => Math.round((Number(n) || 0) * 100) / 100;

const fmt = iso => { if (!iso) return ""; const d = new Date(String(iso).length === 10 ? iso + "T12:00:00" : iso); return isNaN(d) ? "" : new Intl.DateTimeFormat("de-DE", { day: "2-digit", month: "2-digit", year: "numeric" }).format(d); };

const monatName = ym => { const d = new Date(ym + "-15T12:00:00"); return new Intl.DateTimeFormat("de-DE", { month: "long", year: "numeric" }).format(d); };

const num = v => { const n = parseFloat(String(v ?? "").replace(/\./g, "").replace(",", ".")); return isNaN(n) ? 0 : n; };
const numFeld = n => n === undefined || n === null || n === "" ? "" : String(n).replace(".", ",");

const kuerzelOk = k => /^[A-ZÄÖÜ]{2,3}$/.test(k);
const mailOk = m => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(m);

  const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode("gauss-shop:" + String(t).trim().toUpperCase()));
  return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, "0")).join("").slice(0, 40);
}
const ICON = {
  chev: `<svg class="chev" viewBox="0 0 7 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="m1 1 5 5-5 5"/></svg>`,

  minus: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"/></svg>`,
  weg: `<svg width="12" height="12" viewBox="0 0 12 12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M2 2l8 8M10 2l-8 8"/></svg>`,

  tasche: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 8h14l-1 12H6z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>`,
  zahnrad: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>`,

};
const KAT_ICON = {

};
const fotoUrl = f => f ? (f.url || (f.id ? "/_blob/" + f.id : "")) : "";
const kachel = p => { const u = fotoUrl((p?.fotos || [])[0]); return `<span class="kachel" aria-hidden="true">${u ? `<img src="${esc(u)}" alt="" loading="lazy">` : (KAT_ICON[p?.kategorie] || KAT_ICON.Sonstiges)}</span>`; };
const badge = s => `<span class="badge klein ${STATUS[s]?.c || "st-neutral"}">${esc(STATUS[s]?.l || s)}</span>`;

/* ===== Zustand ===== */
const S = {
  produkte: [], res: [], einst: {}, mein: null, alle: [], gut: [], lief: [],
  uid: null, me: null, admin: false, geladen: false, fehler: "", ohneDb: false, schreibGesperrt: false,
  bereich: "shop", tab: "shop", sub: "bestellungen", q: "", kat: "", bf: "offen", monat: heute().slice(0, 7),
  stack: [], busy: false
};
let CART = ls.get("cart", []);
let DB = null, USER = null, CAP = { dl: null, assets: null, mcp: undefined };
const E = () => S.einst || {};

/* ===== Abgeleitete Werte ===== */
const produkt = id => S.produkte.find(p => p.id === id);
const aktiveProdukte = () => S.produkte.filter(p => p.aktiv !== false).sort((a, b) => (a.sort ?? 99) - (b.sort ?? 99) || String(a.name).localeCompare(b.name, "de"));
const vars = p => (p.varianten && p.varianten.length) ? p.varianten : [{ name: "", bestand: p.bestand || 0 }];
function reserviert(pid, v){
  let n = 0;
  for (const r of S.res) if (r.status === "offen") for (const x of r.positionen || []) if (x.p === pid && (x.v || "") === (v || "") && x.intern) n += Number(x.m || 0);
  return n;
}
function frei(p, v){
  if (p.fulfillment !== "intern") return Infinity;
  const va = vars(p).find(x => (x.name || "") === (v || ""));
  return Math.max(0, Number(va?.bestand || 0) - reserviert(p.id, v));
}
const freiGesamt = p => p.fulfillment !== "intern" ? Infinity : vars(p).reduce((s, v) => s + frei(p, v.name), 0);
const imKorb = (pid, v) => CART.filter(c => c.p === pid && (v === undefined || (c.v || "") === (v || ""))).reduce((s, c) => s + c.m, 0);
const meineAuftraege = () => Object.values(S.mein?.orders || {}).sort((a, b) => String(b.am).localeCompare(a.am));
const alleAuftraege = () => S.alle.flatMap(d => Object.values(d.orders || {}).map(o => ({ ...o, uid: d.uid }))).sort((a, b) => String(b.am).localeCompare(a.am));
const auftrag = (u, nr) => { const d = S.alle.find(x => x.uid === u); return d?.orders?.[nr] ? { ...d.orders[nr], uid: u } : null; };
function bereitsBestellt(pid){
  let n = 0;
  for (const o of meineAuftraege()) if (o.status !== "storniert") for (const x of o.positionen || []) if (x.produktId === pid) n += x.menge;
  return n;
}
const lieferant = id => S.lief.find(l => l.id === id);
function preisHinweis(p){
  if (p.fulfillment === "intern"){
    const f = freiGesamt(p);
    if (f <= 0) return { t: "Ausverkauft", c: "st-fehler", aus: true };

  }

}

      e => { S.fehler = `${name}: ${e?.code || ""} ${e?.message || ""}`.trim(); if (e.code !== "revoked") toast(`Verbindung (${name}) unterbrochen. Bitte Seite neu laden.`); nachLaden(); });

const CONFIG = { API_URL: "" };

function eMisch(alt, neu){
  const o = { ...(alt || {}) };
  for (const [k, v] of Object.entries(neu)) o[k] = v && typeof v === "object" && !Array.isArray(v) && o[k] && typeof o[k] === "object" && !Array.isArray(o[k]) ? eMisch(o[k], v) : v;
  return o;
}
const eSnapDoc = (col, id, roh) => { const d = roh !== undefined ? roh : EIGEN.store[col]?.[id]; return { id, exists: !!d, data: () => eKlon(d), metadata: {} }; };
function eSnapCol(col){ const l = Object.keys(EIGEN.store[col] || {}).sort().map(id => eSnapDoc(col, id)); return { docs: l, size: l.length, empty: !l.length, docChanges: () => [], metadata: {} }; }

async function eApi(p, ms = 30000){
  const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), ms);
  try {
    const r = await fetch(CONFIG.API_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ ...p, token: EIGEN.token }), signal: ctl.signal });
    const j = await r.json();
    if (!j.ok){ if (j.code === "anmeldung"){ abmelden(); } throw eFehler(j.code || "api", j.error || "Speichern fehlgeschlagen."); }
    return j;
  } catch (e){
    if (e.name === "AbortError") throw eFehler("unavailable", "Zeitüberschreitung. Bitte noch einmal versuchen.");
    if (e.code) throw e;
    throw eFehler("unavailable", "Keine Verbindung zum Shop-Server. Bitte die Internetverbindung prüfen.");
  } finally { clearTimeout(t); }
}

function eSchreiben(col, id, art, data){
  const s = (EIGEN.store[col] ||= {});
  if (art === "del") delete s[id];
  else if (art === "update"){ if (!s[id]) return Promise.reject(eFehler("invalid_argument", "Eintrag nicht gefunden.")); s[id] = eMisch(s[id], eKlon(data)); }
  else s[id] = eKlon(data);

  if (EIGEN.modus === "vorschau"){ ls.set("vorschau", EIGEN.store); return Promise.resolve(); }

}
const eDb = {
  collection(col){
    const ref = { path: col,

      get: async () => eSnapCol(col), doc: id => eDb.doc(col + "/" + id), where: () => ref, orderBy: () => ref, limit: () => ref };
    return ref;
  },
  doc(path){
    const [col, id] = path.split("/");
    return { id, path,
      onSnapshot(fn){ const h = { col, id, fn }; EIGEN.hoerer.push(h); setTimeout(() => fn(eSnapDoc(col, id)), 0); return () => { EIGEN.hoerer = EIGEN.hoerer.filter(x => x !== h); }; },

/* ===== Berechnung ===== */
function berechne(items, gut){
  const pos = items.map(c => {
    const p = produkt(c.p); if (!p) return null;
    const summe = r2(p.vk * c.m);
    return { produktId: p.id, name: p.name, variante: c.v || "", menge: c.m, einzel: p.vk, summe, ust: Number(p.ust ?? 19), ekNetto: Number(p.ekNetto || 0),
      marktpreis: Number(p.marktpreis || p.vk), fulfillment: p.fulfillment || "intern", lieferantId: p.lieferantId || "", kategorie: p.kategorie, rabatt: 0 };
  }).filter(Boolean);
  const zw = r2(pos.reduce((s, x) => s + x.summe, 0));
  let rabatt = 0;
  if (gut){
    const elig = pos.filter(x => (!gut.kategorien?.length || gut.kategorien.includes(x.kategorie)));
    const es = elig.reduce((s, x) => s + x.summe, 0);
    if (gut.typ === "prozent") rabatt = r2(es * Number(gut.wert || 0) / 100);
    else if (gut.typ === "betrag") rabatt = r2(Math.min(Number(gut.wert || 0), es));
    else if (gut.typ === "gratis" && elig.length) rabatt = Math.min(...elig.map(x => x.einzel));
    let rest = rabatt;
    elig.forEach((x, i) => { const a = i === elig.length - 1 ? r2(rest) : r2(rabatt * x.summe / (es || 1)); x.rabatt = a; rest = r2(rest - a); });
  }
  for (const x of pos){
    x.bezahlt = r2(x.summe - x.rabatt);
    x.netto = r2(x.bezahlt / (1 + x.ust / 100));
    x.ustBetrag = r2(x.bezahlt - x.netto);
  }
  return { positionen: pos, zwischensumme: zw, rabatt: r2(rabatt), summe: r2(zw - rabatt) };
}
async function pruefeGutschein(code){
  const c = code.trim().toUpperCase(); if (!c) return { fehler: "Bitte einen Code eingeben." };
  const h = await sha(c);
  const d = await DB.doc("gutscheinpruefung/" + h).get();
  if (!d.exists) return { fehler: "Diesen Gutscheincode gibt es nicht." };
  const g = { ...d.data(), hash: h, code: c }, t = heute();
  if (g.aktiv === false) return { fehler: "Dieser Gutschein ist pausiert." };
  if (g.von && g.von > t) return { fehler: `Dieser Gutschein gilt erst ab ${fmt(g.von)}.` };
  if (g.bis && g.bis < t) return { fehler: `Dieser Gutschein ist am ${fmt(g.bis)} abgelaufen.` };
  if (g.maxGesamt && gutscheinNutzung(h) >= g.maxGesamt) return { fehler: "Dieser Gutschein ist bereits aufgebraucht." };
  const meine = S.res.filter(r => r.gutschein === h && r.wer === S.uid && r.status !== "storniert").length;
  if (g.maxProPerson && meine >= g.maxProPerson) return { fehler: "Diesen Gutschein hast du bereits eingelöst." };
  const k = (ls.get("kuerzel", "") || "").toUpperCase();
  if (g.nurKuerzel && g.nurKuerzel.split(/[\s,;]+/).filter(Boolean).map(x => x.toUpperCase()).indexOf(k) < 0) return { fehler: "Dieser Gutschein ist an andere Personen vergeben. Bitte zuerst das Kürzel eintragen." };
  const elig = CART.some(c2 => !g.kategorien?.length || g.kategorien.includes(produkt(c2.p)?.kategorie));
  if (!elig) return { fehler: `Dieser Gutschein gilt nur für ${g.kategorien.join(", ")}.` };
  return { gut: g };
}

function sheetProdukt(v){
  const p = produkt(v.id); if (!p) return `<p class="meta">Dieser Artikel ist nicht mehr verfügbar.</p>`;

  else if (maxP <= 0) grund = `Höchstens ${p.max} Stück pro Person, ${bereitsBestellt(p.id) ? "bereits bestellt" : "schon im Warenkorb"}.`;
  const lief = p.fulfillment === "intern" ? `Abholung${E().abholort ? ` bei ${esc(E().abholort)}` : " im Büro"}` : `Wird bestellt${p.lieferzeit ? `, Lieferzeit ${esc(p.lieferzeit)}` : ""}`;
  return `

/* ----- Kasse ----- */
function sheetKasse(v){
  CART = CART.filter(c => produkt(c.p));
  if (!CART.length) return `<div class="leer" style="padding-top:28px"><span class="kachel" style="width:64px;height:64px;margin:0 auto 14px">${ICON.tasche}</span><p class="titel-karte">Der Warenkorb ist leer</p><p class="meta" style="margin:0">Artikel antippen, Größe wählen und hinzufügen.</p><div class="aktionen" style="margin-top:16px;justify-content:center"><button class="taste sekundaer klein" data-act="schliessen">Zum Sortiment</button></div></div>`;
  const b = berechne(CART, v.gut);
  const k = v.kuerzel ?? ls.get("kuerzel", ""), name = v.name ?? (ls.get("name", "") || S.me?.name || ""), mail = v.email ?? (ls.get("email", "") || S.me?.email || "");
  const zw = v.zahlweg || (b.summe <= 0 ? "keine" : ls.get("zahlweg", "gehalt"));
  if (b.summe > 0 && zw === "keine") v.zahlweg = "gehalt";
  const zahlweg = b.summe <= 0 ? "keine" : (v.zahlweg || zw);
  return `
    <div class="abschnitt" style="gap:4px"><span class="etikett">Warenkorb</span><h2 class="titel-seite" style="font-size:24px;line-height:30px">${plural(CART.reduce((s, c) => s + c.m, 0), "Artikel", "Artikel")}</h2></div>
    <div class="karte">${CART.map((c, i) => { const p = produkt(c.p), x = b.positionen[i];
      const max = Math.min(frei(p, c.v) - imKorb(p.id, c.v) + c.m, p.max ? p.max - bereitsBestellt(p.id) - imKorb(p.id) + c.m : Infinity);
      return `<div class="position">${kachel(p)}<div class="info"><span class="t">${esc(p.name)}</span><span class="meta">${c.v ? `Größe ${esc(c.v)} · ` : ""}${euro(p.vk)} · ${p.fulfillment === "intern" ? "Abholung" : "wird bestellt"}</span>
        <div class="unten"><div class="stepper"><button data-act="korb-menge" data-i="${i}" data-d="-1" aria-label="Weniger">${ICON.minus}</button><output class="zahl">${c.m}</output><button data-act="korb-menge" data-i="${i}" data-d="1" aria-label="Mehr" ${c.m >= max ? "disabled" : ""}>${ICON.plus}</button></div>
        <span class="betrag">${euro(x.summe)}</span></div></div></div>`; }).join("")}</div>

    <div class="abschnitt"><h3 class="titel-bereich">Gutschein</h3>
      <div class="karte innen">${v.gut ? `<div class="kopfzeile"><span><b style="letter-spacing:.06em">${esc(v.gut.code)}</b> <span class="meta">${gutscheinWert(v.gut)}</span></span><button class="taste sekundaer klein" data-act="gutschein-weg">Entfernen</button></div>`
        : `<div class="feld-zeile"><input class="eingabe code" id="k-code" placeholder="Code" autocomplete="off" autocapitalize="characters" aria-label="Gutscheincode" value="${esc(v.codeEingabe || "")}"><button class="taste sekundaer klein" style="min-height:44px" data-act="gutschein-pruefen">Einlösen</button></div>`}
        ${v.gutFehler ? `<p class="fehler-text">${esc(v.gutFehler)}</p>` : ""}</div></div>

    <div class="karte"><dl><dt>Zwischensumme</dt><dd>${euro(b.zwischensumme)}</dd>${b.rabatt ? `<dt>Gutschein</dt><dd class="minus">− ${euro(b.rabatt)}</dd>` : ""}<dt class="summe">Gesamt</dt><dd class="summe">${euro(b.summe)}</dd></dl></div>

    <div class="abschnitt"><h3 class="titel-bereich">Angaben</h3>
      <div class="karte innen formular">
        <div class="zwei umbruch"><div class="gruppe"><label for="k-kuerzel">Kürzel</label><input class="eingabe kurz" id="k-kuerzel" maxlength="3" autocomplete="off" autocapitalize="characters" value="${esc(k)}" placeholder="ABC"></div>
        <div class="gruppe"><label for="k-name">Name</label><input class="eingabe" id="k-name" autocomplete="name" value="${esc(name)}"></div></div>
        <div class="gruppe"><label for="k-mail">E-Mail für die Rechnung</label><input class="eingabe" id="k-mail" type="email" autocomplete="email" value="${esc(mail)}"></div>
        ${b.summe > 0 ? `<div class="gruppe"><span class="gruppe-titel">Bezahlung</span><div class="segment" role="group" aria-label="Bezahlung"><button data-act="zahlweg" data-z="gehalt" aria-pressed="${zahlweg === "gehalt"}">Gehaltsabzug</button><button data-act="zahlweg" data-z="ueberweisung" aria-pressed="${zahlweg === "ueberweisung"}">Überweisung</button></div>
          <p class="meta">${zahlweg === "gehalt" ? "Der Betrag wird mit der nächsten Gehaltsabrechnung einbehalten." : "Die Rechnung kommt per Mail, mit Bankverbindung und Verwendungszweck."}</p></div>` : `<p class="meta">Durch den Gutschein ist nichts zu bezahlen.</p>`}
        ${zahlweg === "gehalt" ? `<label class="check"><input type="checkbox" id="k-ok" ${v.ok ? "checked" : ""}>Ich bin einverstanden, dass ${euro(b.summe)} von meinem Gehalt einbehalten werden.</label>` : ""}
        <div class="gruppe"><label for="k-hinweis">Hinweis (optional)</label><input class="eingabe" id="k-hinweis" value="${esc(v.hinweis || "")}" placeholder="z. B. Abholung erst ab Montag"></div>
        ${v.fehler ? `<p class="fehler-text" role="alert">${esc(v.fehler)}</p>` : ""}
      </div></div>
    <p class="hinweis" style="margin-top:0">Mit der Bestellung entsteht ein Kauf bei ${esc(E().firma || "GAUSS-LVS mbH")}. Rechnungen gehen an die Buchhaltung. Stornieren geht, solange die Bestellung noch nicht bearbeitet wird.</p>
    <div class="sheet-fuss"><button class="taste primaer" data-act="bestellen" ${S.busy || S.schreibGesperrt ? "disabled" : ""}>${S.busy ? "Wird gesendet …" : "Verbindlich bestellen"}</button></div>`;
}
function merkeKasse(v){
  if (!$("#k-name")) return;
  v.kuerzel = val("k-kuerzel").toUpperCase(); v.name = val("k-name"); v.email = val("k-mail"); v.hinweis = val("k-hinweis");
  v.ok = !!$("#k-ok")?.checked; if ($("#k-code")) v.codeEingabe = val("k-code");
}
async function naechsteNr(){
  const y = new Date().getFullYear(), pre = `SHOP-${y}-`;
  let n = S.res.filter(r => r.id.startsWith(pre)).reduce((m, r) => Math.max(m, parseInt(r.id.slice(pre.length)) || 0), 0) + 1;
  for (let i = 0; i < 5; i++){
    const id = pre + String(n).padStart(4, "0");
    const d = await DB.doc("reservierungen/" + id).get();
    if (!d.exists) return id;
    n++;
  }
  return pre + String(n).padStart(4, "0") + "-" + uid().slice(0, 3);
}
async function bestellen(v){
  merkeKasse(v);
  const b = berechne(CART, v.gut);
  const zahlweg = b.summe <= 0 ? "keine" : (v.zahlweg || ls.get("zahlweg", "gehalt"));
  v.fehler = "";
  if (!kuerzelOk(v.kuerzel)) v.fehler = "Bitte das Kürzel mit 2 oder 3 Buchstaben eintragen.";
  else if (!v.name) v.fehler = "Bitte den Namen eintragen.";
  else if (!mailOk(v.email)) v.fehler = "Bitte eine gültige E-Mail-Adresse eintragen.";
  else if (zahlweg === "gehalt" && !v.ok) v.fehler = "Für den Gehaltsabzug bitte das Einverständnis bestätigen.";
  else if (!S.uid) v.fehler = "Zum Bestellen bitte angemeldet sein.";
  for (const c of CART){ const p = produkt(c.p); if (!v.fehler && p.fulfillment === "intern" && frei(p, c.v) < imKorb(p.id, c.v)) v.fehler = `${p.name}${c.v ? ` (${c.v})` : ""} ist nicht mehr in dieser Menge verfügbar.`; }
  if (v.fehler){ renderSheet(); $("#detail .fehler-text[role=alert]")?.scrollIntoView({ block: "center", behavior: "smooth" }); return; }
  ls.set("kuerzel", v.kuerzel); ls.set("name", v.name); ls.set("email", v.email); if (zahlweg !== "keine") ls.set("zahlweg", zahlweg);
  S.busy = true; renderSheet();
  try {
    const nr = await naechsteNr(), jetzt = new Date().toISOString();
    const order = { nr, am: jetzt, kuerzel: v.kuerzel, name: v.name, email: v.email, zahlweg, einverstanden: zahlweg === "gehalt" ? jetzt : null, hinweis: v.hinweis || "",
      positionen: b.positionen, zwischensumme: b.zwischensumme, rabatt: b.rabatt, summe: b.summe,
      gutschein: v.gut ? { code: v.gut.code, hash: v.gut.hash, typ: v.gut.typ, wert: v.gut.wert } : null,
      status: "eingegangen", verlauf: [{ s: "eingegangen", am: jetzt }] };
    await DB.doc("reservierungen/" + nr).set({ nr, am: jetzt, wer: S.uid, status: "offen", gutschein: v.gut?.hash || null,
      positionen: b.positionen.map(x => ({ p: x.produktId, v: x.variante, m: x.menge, intern: x.fulfillment === "intern" })) });
    const ref = DB.doc("bestellungen/" + S.uid), da = await ref.get();
    if (da.exists) await ref.update({ kuerzel: v.kuerzel, name: v.name, email: v.email, orders: { [nr]: order } });
    else await ref.set({ kuerzel: v.kuerzel, name: v.name, email: v.email, orders: { [nr]: order } });
    CART = []; ls.set("cart", CART); S.busy = false;
    ersetze("kasse-fertig", { nr });
  } catch (e){ S.busy = false; v.fehler = fehlerText(e); renderSheet(); }
}
function sheetFertig(v){
  const o = S.mein?.orders?.[v.nr];
  return `<div class="leer" style="padding-top:24px"><span class="kachel" style="width:64px;height:64px;margin:0 auto 14px;color:var(--status-erfolg-text);background:var(--status-erfolg-flaeche)"><svg width="28" height="28" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m3 8.5 3.2 3L13 4.5"/></svg></span>
    <h2 class="titel-seite" style="font-size:24px;line-height:30px">Bestellung ist eingegangen</h2>
    <p class="meta" style="margin:6px 0 0">Bestellnummer <b class="zahl">${esc(v.nr)}</b>${o ? ` · ${euro(o.summe)}` : ""}. Den Stand gibt es unter Bestellungen. Sobald sie abholbereit ist, steht es dort.</p></div>
    <div class="aktionen"><button class="taste sekundaer" data-act="pdf-bestaetigung" data-nr="${esc(v.nr)}" ${o ? "" : "disabled"}>${ICON.pdf}Bestätigung als PDF</button><button class="taste primaer" data-act="zu-bestellungen">Zu meinen Bestellungen</button></div>`;
}

}
function verlaufKarte(o){
  return `<div class="karte"><ul class="verlauf">${(o.verlauf || []).map(x => `<li><span>${esc(STATUS[x.s]?.l || x.s)}${x.notiz ? ` <span class="meta">· ${esc(x.notiz)}</span>` : ""}</span><span class="d">${fmtZeit(x.am)}</span></li>`).join("")}</ul></div>`;

function sheetBestellung(v){

/* ----- Bestellung (Verwaltung) ----- */
function sheetAuftrag(v){
  const o = auftrag(v.uid, v.nr); if (!o) return `<p class="meta">Bestellung nicht gefunden.</p>`;
  const pos = o.positionen || [];
  const gruppen = {};
  for (const x of pos) if (x.fulfillment !== "intern"){ (gruppen[x.lieferantId || "?"] ||= []).push(x); }
  const aktion = [];
  if (OFFEN.includes(o.status)) aktion.push(`<button class="taste sekundaer" data-act="storno-frage">Stornieren …</button>`);
  if (o.status === "eingegangen") aktion.push(`<button class="taste primaer" data-act="status" data-s="angenommen">Annehmen</button>`);
  if (["angenommen", "bestellt"].includes(o.status)) aktion.push(`<button class="taste primaer" data-act="status" data-s="bereit">Abholbereit melden</button>`);
  if (o.status === "bereit") aktion.push(`<button class="taste primaer" data-act="status" data-s="abgeschlossen">Abschließen</button>`);
  const lieferBlock = Object.keys(gruppen).length && !["abgeschlossen", "storniert"].includes(o.status) ? `<div class="abschnitt"><h3 class="titel-bereich">Lieferanten und Anbieter</h3><div class="karte">${Object.entries(gruppen).map(([lid, xs]) => {
      const l = lieferant(lid), gesendet = o.lieferanten?.[lid];
      const pod = l?.art === "pod";
      return `<div class="schalter-zeile"><span><b>${esc(l?.name || "Kein Lieferant gewählt")}</b><span class="meta">${plural(xs.reduce((s, x) => s + x.menge, 0), "Stück", "Stück")} · ${gesendet ? `${gesendet.art === "pod" ? "übergeben" : gesendet.art === "entwurf" ? "Mail-Entwurf erstellt" : "Mail gesendet"} ${fmtZeit(gesendet.am)}` : "noch nicht bestellt"}</span></span>
        <span class="aktionen" style="flex:none">${pod ? `<button class="taste sekundaer klein" data-act="pod" data-lid="${esc(lid)}">Auftrag</button>` : ""}${l?.email ? `<button class="taste ${gesendet ? "sekundaer" : "primaer"} klein" data-act="lieferant-mail" data-lid="${esc(lid)}">${ICON.mail}${gesendet ? "Erneut senden" : "Bestellen"}</button>` : `<span class="badge klein st-warnung">E-Mail fehlt</span>`}</span></div>`; }).join("")}</div></div>` : "";
  return `
    <div class="abschnitt" style="gap:6px"><span class="etikett zahl">${esc(o.nr)} · ${fmtZeit(o.am)}</span><h2 class="titel-seite" style="font-size:24px;line-height:30px">${esc(o.name)} <span class="meta" style="font-size:17px">${esc(o.kuerzel)}</span></h2><div>${badge(o.status)}</div></div>
    ${aktion.length ? `<div class="aktionen gruppe-tasten">${aktion.join("")}</div>` : ""}
    ${v.fehler ? `<p class="fehler-text" role="alert">${esc(v.fehler)}</p>` : ""}
    ${o.hinweis ? `<div class="vorschau">${ICON.info}<span>Hinweis: ${esc(o.hinweis)}</span></div>` : ""}
    <div class="abschnitt"><h3 class="titel-bereich">Artikel</h3>${positionenKarte(o, true)}</div>
    ${lieferBlock}
    <div class="abschnitt"><h3 class="titel-bereich">Rechnung und Buchhaltung</h3><div class="karte">
      <dl><dt>E-Mail</dt><dd>${esc(o.email)}</dd><dt>Bezahlung</dt><dd>${ZAHLWEG[o.zahlweg] || ""}${o.einverstanden ? ` · Einverständnis ${fmt(o.einverstanden)}` : ""}</dd>
      <dt>Rechnung</dt><dd>${o.rechnung ? `${o.rechnung.art === "entwurf" ? "Entwurf erstellt" : "gesendet"} ${fmtZeit(o.rechnung.am)}` : "noch nicht versendet"}</dd>
      ${o.werbemittel ? `<dt>Werbemittel</dt><dd>${o.werbemittel.offen ? "Ausgabe noch zu buchen" : `gebucht ${fmt(o.werbemittel.am)}`}</dd>` : ""}</dl>
      <div class="innen" style="padding-top:0"><div class="aktionen gruppe-tasten"><button class="taste sekundaer" data-act="pdf-rechnung">${ICON.pdf}PDF herunterladen</button><button class="taste sekundaer" data-act="rechnung-mail" ${o.status === "storniert" ? "disabled" : ""}>${ICON.mail}Rechnung senden</button></div></div></div></div>
    <div class="abschnitt"><h3 class="titel-bereich">Verlauf</h3>${verlaufKarte(o)}</div>
    <div class="abschnitt"><h3 class="titel-bereich">Interne Notiz</h3><div class="karte innen"><textarea class="eingabe" id="a-notiz" placeholder="Nur in der Verwaltung sichtbar">${esc(o.notizIntern || "")}</textarea><div class="aktionen"><button class="taste sekundaer klein" data-act="notiz-speichern">Notiz speichern</button></div></div></div>`;
}

function podAuftrag(o, lid){
  const l = lieferant(lid), e = E();
  return {
    anbieter: l?.anbieter || l?.name || "", shop_id: l?.shopId || "", external_id: o.nr,
    recipient: { name: e.firma || "GAUSS-LVS mbH", attention: `${o.name} (${o.kuerzel})`, address: e.anschrift || "", email: e.shopEmail || "" },

      return { name: x.name, variant: x.variante || null, sku: va?.extSku || va?.sku || "", quantity: x.menge }; })
  };
}
function sheetPod(v){

async function produktSpeichern(v){
  merkeProdukt(v); const p = v.p;
  const vk = num(p.vk);
  v.fehler = !p.name ? "Bitte einen Namen eintragen." : !(vk > 0) ? "Bitte einen Preis eintragen." : (p.fulfillment !== "intern" && !p.lieferantId && p.aktiv !== false) ? "Für diesen Bestellweg bitte einen Lieferanten wählen oder das Produkt als Entwurf speichern." : "";
  if (!v.fehler && p.varianten.some(x => !x.name)) v.fehler = "Jede Variante braucht eine Bezeichnung.";
  if (v.fehler) return renderSheet();
  const daten = { ...p, vk: r2(vk), ekNetto: r2(num(p.ekNetto)), marktpreis: num(p.marktpreis) ? r2(num(p.marktpreis)) : null, geaendert: new Date().toISOString() };
  delete daten.id;
  if (daten.fulfillment !== "intern") daten.varianten = daten.varianten.map(x => ({ ...x, bestand: 0 }));
  S.busy = true; renderSheet();
  try {
    const id = v.id || (norm(p.name).replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 40) || "produkt") + "-" + uid().slice(0, 4);
    await DB.doc("produkte/" + id).set(daten);
    S.busy = false; toast("Produkt gespeichert"); zurueck();
  } catch (e){ S.busy = false; v.fehler = fehlerText(e); renderSheet(); }
}

function zufallsCode(){ const z = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; let c = ""; const a = crypto.getRandomValues(new Uint8Array(8)); for (const x of a) c += z[x % z.length]; return c; }
function sheetGutscheinEdit(v){

      ${g.typ !== "gratis" ? `<div class="gruppe"><label for="g-wert">${g.typ === "prozent" ? "Rabatt in Prozent" : "Rabatt in Euro"}</label><input class="eingabe zahl kurz" style="text-transform:none;letter-spacing:0;font-weight:400" id="g-wert" inputmode="decimal" value="${esc(numFeld(g.wert))}"></div>` : `<p class="meta">Der günstigste passende Artikel im Warenkorb kostet nichts (ein Stück).</p>`}
      <div class="zwei"><div class="gruppe"><label for="g-von">Gültig ab</label><input class="eingabe datum" type="date" id="g-von" value="${esc(g.von || "")}"></div><div class="gruppe"><label for="g-bis">Gültig bis</label><input class="eingabe datum" type="date" id="g-bis" value="${esc(g.bis || "")}"></div></div>
      <div class="zwei"><div class="gruppe"><label for="g-max">Einlösungen gesamt</label><input class="eingabe zahl" id="g-max" inputmode="numeric" value="${g.maxGesamt || ""}" placeholder="unbegrenzt"></div><div class="gruppe"><label for="g-pp">Pro Person</label><input class="eingabe zahl" id="g-pp" inputmode="numeric" value="${g.maxProPerson || ""}" placeholder="unbegrenzt"></div></div>
      <div class="gruppe"><label for="g-wer">Nur für Kürzel</label><input class="eingabe" id="g-wer" value="${esc(g.nurKuerzel || "")}" placeholder="leer = alle, sonst z. B. NN, ABC" style="text-transform:uppercase"></div>
      <div class="gruppe"><span class="gruppe-titel">Gilt für</span><div class="wahl">${KATEGORIEN.map(k => `<button class="chip" data-act="g-kat" data-k="${esc(k)}" aria-pressed="${(g.kategorien || []).includes(k)}">${esc(k)}</button>`).join("")}</div><p class="meta">Keine Auswahl: gilt für alles.</p></div>
      <div class="gruppe"><label for="g-notiz">Notiz</label><input class="eingabe" id="g-notiz" value="${esc(g.notiz || "")}" placeholder="z. B. Willkommenspaket"></div>

}
function merkeGutschein(v){
  const g = v.g; if (!$("#g-code")) return;
  g.code = val("g-code").toUpperCase().replace(/\s+/g, ""); if ($("#g-wert")) g.wert = $("#g-wert").value;
  g.von = val("g-von"); g.bis = val("g-bis"); g.maxGesamt = parseInt(val("g-max")) || 0; g.maxProPerson = parseInt(val("g-pp")) || 0;
  g.nurKuerzel = val("g-wer").toUpperCase(); g.notiz = val("g-notiz");
}
async function gutscheinSpeichern(v){
  merkeGutschein(v); const g = v.g;
  v.fehler = !/^[A-Z0-9-]{4,24}$/.test(g.code) ? "Der Code braucht 4 bis 24 Zeichen aus Buchstaben, Ziffern oder Bindestrich." :
    g.typ !== "gratis" && !(num(g.wert) > 0) ? "Bitte einen Rabattwert eintragen." : g.typ === "prozent" && num(g.wert) > 100 ? "Mehr als 100 Prozent geht nicht." :
    g.von && g.bis && g.von > g.bis ? "Das Enddatum liegt vor dem Startdatum." : "";
  if (!v.fehler && S.gut.some(x => x.code === g.code && x.id !== v.id)) v.fehler = "Diesen Code gibt es schon.";
  if (v.fehler) return renderSheet();
  S.busy = true; renderSheet();
  try {
    const hash = await sha(g.code), alt = v.id ? S.gut.find(x => x.id === v.id)?.hash : null;
    const regel = { typ: g.typ, wert: g.typ === "gratis" ? 0 : r2(num(g.wert)), von: g.von || "", bis: g.bis || "", maxGesamt: g.maxGesamt, maxProPerson: g.maxProPerson,
      kategorien: g.kategorien || [], nurKuerzel: g.nurKuerzel || "", aktiv: g.aktiv !== false };
    const id = v.id || uid();
    await DB.doc("gutscheinpruefung/" + hash).set(regel);
    await DB.doc("gutscheine/" + id).set({ ...regel, code: g.code, hash, notiz: g.notiz || "", angelegt: g.angelegt || new Date().toISOString() });
    if (alt && alt !== hash) await DB.doc("gutscheinpruefung/" + alt).delete();
    S.busy = false; toast("Gutschein gespeichert"); zurueck();
  } catch (e){ S.busy = false; v.fehler = fehlerText(e); renderSheet(); }
}

/* ----- Buchhaltung ----- */
function buchungsZeilen(ym){
  const out = [];
  for (const o of alleAuftraege()){
    if (o.status !== "abgeschlossen") continue;
    const d = String(o.abgeschlossenAm || o.am).slice(0, 7); if (d !== ym) continue;
    for (const x of o.positionen || []){
      const vorteil = r2(Math.max(0, x.marktpreis * x.menge - x.bezahlt));
      const ekGesamt = r2(x.ekNetto * x.menge), mindest = x.netto < ekGesamt;
      out.push({ o, x, vorteil, ekGesamt, mindest });
    }
  }
  return out;
}
function personenSummen(z){
  const m = new Map();
  for (const r of z){
    const k = r.o.kuerzel; const p = m.get(k) || { kuerzel: k, name: r.o.name, gehalt: 0, ueberweisung: 0, vorteil: 0, brutto: 0 };
    p.brutto = r2(p.brutto + r.x.bezahlt); p.vorteil = r2(p.vorteil + r.vorteil);
    if (r.o.zahlweg === "gehalt") p.gehalt = r2(p.gehalt + r.x.bezahlt); else if (r.o.zahlweg === "ueberweisung") p.ueberweisung = r2(p.ueberweisung + r.x.bezahlt);
    m.set(k, p);
  }
  return [...m.values()].sort((a, b) => a.kuerzel.localeCompare(b.kuerzel));
}

async function setzeStatus(o, s, extra = {}, notiz){

  if (s === "abgeschlossen") patch.abgeschlossenAm = jetzt;
  await DB.doc("bestellungen/" + o.uid).update({ orders: { [o.nr]: patch } });
  const rs = s === "storniert" ? "storniert" : s === "abgeschlossen" ? "erledigt" : "offen";
  try { await DB.doc("reservierungen/" + o.nr).update({ status: rs }); } catch {}

async function statusAktion(v, s){
  let o = auftrag(v.uid, v.nr); if (!o) return;
  S.busy = true; v.fehler = "";
  try {
    if (s === "abgeschlossen"){
      const intern = (o.positionen || []).filter(x => x.fulfillment === "intern");
      const proP = {};
      for (const x of intern){ (proP[x.produktId] ||= []).push(x); }
      for (const [pid, xs] of Object.entries(proP)){
        const p = produkt(pid); if (!p) continue;
        if (p.varianten?.length){
          const neu = p.varianten.map(va => { const m = xs.filter(x => (x.variante || "") === (va.name || "")).reduce((t, x) => t + x.menge, 0); return m ? { ...va, bestand: Math.max(0, Number(va.bestand || 0) - m) } : va; });
          await DB.doc("produkte/" + pid).update({ varianten: neu });
        } else {
          await DB.doc("produkte/" + pid).update({ bestand: Math.max(0, Number(p.bestand || 0) - xs.reduce((t, x) => t + x.menge, 0)) });
        }
      }
      o = await setzeStatus(o, s, intern.length ? { werbemittel: { offen: true } } : {});
      toast("Abgeschlossen, Bestand gebucht");
      if (E().autoRechnung) await rechnungMailen(o, true);

        for (const lid of lids) if (lieferant(lid)?.email) await lieferantMailen(o, lid, true);
      }
    } else {
      o = await setzeStatus(o, s);
      toast(STATUS[s].l);
    }
  } catch (e){ v.fehler = e?.mailFehler || fehlerText(e); }
  S.busy = false; renderSheet();
}

  if (logo) doc.addImage(logo, "PNG", M, 16, 10, 10);
  doc.setFont("helvetica", "bold"); doc.setFontSize(11); doc.setTextColor(27, 47, 84);
  doc.text(e.firma || "GAUSS-LVS mbH", M + 14, 20.5);
  doc.setFont("helvetica", "normal"); doc.setFontSize(8.5); doc.setTextColor(90, 100, 130);
  doc.text("Mitarbeitershop", M + 14, 24.8);
  const adr = (e.anschrift || "").split("\n").filter(Boolean);
  if (adr.length) doc.text(adr, 190, 18, { align: "right" });
  doc.setFont("helvetica", "bold"); doc.setFontSize(22); doc.setTextColor(27, 47, 84);
  doc.text(titel, M, 48);
  return M;
}
let PDFLIB = null;
function ladePdf(){
  if (window.jspdf) return Promise.resolve(window.jspdf);
  return PDFLIB ||= new Promise((ok, nein) => { const sc = document.createElement("script"); sc.src = "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js";
    sc.onload = () => window.jspdf ? ok(window.jspdf) : nein(new Error("PDF-Bibliothek fehlt")); sc.onerror = () => { PDFLIB = null; nein(new Error("PDF-Bibliothek ließ sich nicht laden")); }; document.head.appendChild(sc); });
}
async function belegPdf(o, art){
  const { jsPDF } = await ladePdf(); const doc = new jsPDF({ unit: "mm", format: "a4" }); const e = E();
  const titel = art === "rechnung" ? "Rechnung" : "Bestellbestätigung";
  const M = await pdfKopf(doc, titel);
  doc.setFont("helvetica", "normal"); doc.setFontSize(9.5); doc.setTextColor(27, 47, 84);
  const datum = art === "rechnung" ? (o.abgeschlossenAm || new Date().toISOString()) : o.am;
  const links = [o.name, `Kürzel ${o.kuerzel}`, o.email];
  const rechts = [[art === "rechnung" ? "Rechnungsnummer" : "Bestellnummer", o.nr], ["Datum", fmt(datum)], ["Bestellt am", fmt(o.am)], ["Bezahlung", ZAHLWEG[o.zahlweg] || ""]];
  doc.text(links.filter(Boolean), M, 60);
  rechts.forEach(([k, w], i) => { doc.setTextColor(110, 118, 145); doc.text(k, 130, 60 + i * 5); doc.setTextColor(27, 47, 84); doc.text(String(w), 190, 60 + i * 5, { align: "right" }); });
  let y = 88;
  const kopf = () => { doc.setFontSize(8); doc.setTextColor(110, 118, 145); doc.text("ARTIKEL", M, y); doc.text("MENGE", 120, y, { align: "right" }); doc.text("EINZEL", 145, y, { align: "right" }); doc.text("USt", 160, y, { align: "right" }); doc.text("BETRAG", 190, y, { align: "right" });
    y += 3; doc.setDrawColor(200, 205, 220); doc.line(M, y, 190, y); y += 6; doc.setFontSize(9.5); doc.setTextColor(27, 47, 84); };
  kopf();
  for (const x of o.positionen || []){
    if (y > 250){ doc.addPage(); y = 24; kopf(); }
    const name = doc.splitTextToSize(x.name + (x.variante ? `, Größe ${x.variante}` : ""), 88);
    doc.text(name, M, y); doc.text(String(x.menge), 120, y, { align: "right" }); doc.text(pEuro(x.einzel), 145, y, { align: "right" }); doc.text(`${x.ust} %`, 160, y, { align: "right" }); doc.text(pEuro(x.summe), 190, y, { align: "right" });
    y += name.length * 4.6 + 2.4;
  }
  doc.line(M, y - 2, 190, y - 2); y += 4;
  const zeile = (k, w, fett) => { doc.setFont("helvetica", fett ? "bold" : "normal"); doc.text(k, 145, y, { align: "right" }); doc.text(w, 190, y, { align: "right" }); y += 5.4; };
  zeile("Zwischensumme", pEuro(o.zwischensumme));
  if (o.rabatt) zeile(`Gutschein ${o.gutschein?.code || ""}`, "- " + pEuro(o.rabatt));
  const proSatz = {};
  for (const x of o.positionen || []){ const s = (proSatz[x.ust] ||= { n: 0, u: 0 }); s.n = r2(s.n + x.netto); s.u = r2(s.u + x.ustBetrag); }
  for (const [satz, s] of Object.entries(proSatz)){ zeile(`Netto ${satz} %`, pEuro(s.n)); zeile(`USt ${satz} %`, pEuro(s.u)); }
  y += 1; zeile("Gesamt", pEuro(o.summe), true);
  doc.setFont("helvetica", "normal"); y += 8; doc.setFontSize(9.5);
  const hinweis = art !== "rechnung" ? "Diese Bestätigung ist keine Rechnung. Die Rechnung folgt nach der Ausgabe." :
    o.zahlweg === "gehalt" ? `Der Betrag wird mit der Gehaltsabrechnung einbehalten (Einverständnis vom ${fmt(o.einverstanden)}).` :
    o.zahlweg === "ueberweisung" ? `Bitte überweisen Sie den Betrag innerhalb von 14 Tagen${e.iban ? ` auf ${e.iban}${e.bank ? ` (${e.bank})` : ""}` : ""}. Verwendungszweck: ${o.nr}.` : "Es ist nichts zu bezahlen.";
  doc.text(doc.splitTextToSize(hinweis + (art === "rechnung" ? " Leistungsdatum entspricht dem Rechnungsdatum." : ""), 170), M, y);
  doc.setFontSize(7.5); doc.setTextColor(110, 118, 145);
  doc.text([e.firma || "GAUSS-LVS mbH", [e.ustId ? `USt-IdNr. ${e.ustId}` : "", e.steuernr ? `Steuernummer ${e.steuernr}` : ""].filter(Boolean).join(" · ")].filter(Boolean), M, 284);
  const uri = doc.output("datauristring");
  return { blob: doc.output("blob"), b64: uri.slice(uri.indexOf(",") + 1) };
}
async function monatsPdf(ym){
  const { jsPDF } = await ladePdf(); const doc = new jsPDF({ unit: "mm", format: "a4" });
  const M = await pdfKopf(doc, "Monatsbericht"), z = buchungsZeilen(ym), pers = personenSummen(z), grenze = Number(E().sachbezugGrenze ?? 50);
  doc.setFont("helvetica", "normal"); doc.setFontSize(11); doc.setTextColor(90, 100, 130); doc.text(monatName(ym), M, 56);
  let y = 70;
  const sp = [M, 40, 120, 150, 190];
  doc.setFontSize(8); doc.setTextColor(110, 118, 145);
  ["KÜRZEL", "NAME", "GEHALTSABZUG", "ÜBERWEISUNG", "VORTEIL"].forEach((t, i) => doc.text(t, sp[i], y, i >= 2 ? { align: "right" } : undefined));
  y += 3; doc.setDrawColor(200, 205, 220); doc.line(M, y, 190, y); y += 6; doc.setFontSize(9.5); doc.setTextColor(27, 47, 84);
  for (const p of pers){
    if (y > 260){ doc.addPage(); y = 24; }
    doc.text(p.kuerzel, sp[0], y); doc.text(doc.splitTextToSize(p.name, 60)[0], sp[1], y); doc.text(pEuro(p.gehalt), sp[2], y, { align: "right" }); doc.text(pEuro(p.ueberweisung), sp[3], y, { align: "right" });
    doc.text(pEuro(p.vorteil) + (p.vorteil > grenze ? " *" : ""), sp[4], y, { align: "right" }); y += 6;
  }
  doc.line(M, y - 2, 190, y - 2); y += 4; doc.setFont("helvetica", "bold");
  doc.text("Summe", sp[0], y); doc.text(pEuro(pers.reduce((s, p) => s + p.gehalt, 0)), sp[2], y, { align: "right" }); doc.text(pEuro(pers.reduce((s, p) => s + p.ueberweisung, 0)), sp[3], y, { align: "right" }); doc.text(pEuro(pers.reduce((s, p) => s + p.vorteil, 0)), sp[4], y, { align: "right" });
  doc.setFont("helvetica", "normal"); y += 12;
  const brutto = r2(z.reduce((s, r) => s + r.x.bezahlt, 0)), netto = r2(z.reduce((s, r) => s + r.x.netto, 0));
  doc.text([`Umsatz brutto ${pEuro(brutto)} · netto ${pEuro(netto)} · USt ${pEuro(brutto - netto)}`, `Rechnungen: ${new Set(z.map(r => r.o.nr)).size} · Positionen unter Einkaufspreis: ${z.filter(r => r.mindest).length}`], M, y);
  y += 14; doc.setFontSize(8); doc.setTextColor(110, 118, 145);
  doc.text(doc.splitTextToSize(`* über der Sachbezugsfreigrenze von ${pEuro(grenze)} im Monat. Geldwerter Vorteil = Marktpreis abzüglich gezahltem Preis. Einzelpositionen in der beigefügten CSV-Datei.`, 170), M, y);
  const uri = doc.output("datauristring");
  return { blob: doc.output("blob"), b64: uri.slice(uri.indexOf(",") + 1) };
}
async function speichern(name, data){
  if (!CAP.dl){ toast("Speichern ist in dieser Ansicht nicht verfügbar."); return; }
  try { await CAP.dl.save({ filename: name, data }); } catch (e){ if (e?.code !== "declined") toast("Die Datei ließ sich nicht speichern."); }
}

/* Große Handyfotos vor dem Hochladen verkleinern: lädt schneller, spart Speicher */
async function verkleinere(datei, max){
  try {
    if (!/^image\/(jpeg|png|webp|heic|heif)/.test(datei.type) && datei.type) return datei;
    const bmp = await createImageBitmap(datei);
    const f = Math.min(1, max / Math.max(bmp.width, bmp.height));
    if (f === 1 && datei.size < 1.5e6 && datei.type === "image/jpeg") return datei;
    const c = document.createElement("canvas"); c.width = Math.round(bmp.width * f); c.height = Math.round(bmp.height * f);
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
    const blob = await new Promise(ok => c.toBlob(ok, "image/jpeg", 0.85));
    return blob ? new File([blob], (datei.name || "foto").replace(/\.[^.]+$/, "") + ".jpg", { type: "image/jpeg" }) : datei;
  } catch { return datei; }
}

    /* Verwaltung: Gutscheine */
    case "neu-gutschein": oeffne("gutschein-edit", { id: null, g: { code: zufallsCode(), typ: "prozent", wert: 10, aktiv: true, maxProPerson: 1, kategorien: [] } }); break;
    case "edit-gutschein": { const g = S.gut.find(x => x.id === b.dataset.id); oeffne("gutschein-edit", { id: g.id, g: structuredClone(g) }); break; }
    case "g-aktiv": merkeGutschein(v); v.g.aktiv = v.g.aktiv === false; renderSheet(); break;
    case "g-zufall": merkeGutschein(v); v.g.code = zufallsCode(); renderSheet(); break;
    case "g-typ": merkeGutschein(v); v.g.typ = b.dataset.t; renderSheet(); break;
    case "g-kat": { merkeGutschein(v); const k = b.dataset.k, l = new Set(v.g.kategorien || []); l.has(k) ? l.delete(k) : l.add(k); v.g.kategorien = [...l]; renderSheet(); break; }
    case "gutschein-speichern": await gutscheinSpeichern(v); break;
    case "gutschein-loeschen": oeffne("frage", { titel: "Gutschein löschen?", text: "Der Code lässt sich danach nicht mehr einlösen. Bisherige Bestellungen behalten ihren Rabatt.", ja: "Endgültig löschen", gefahr: true, ziel: "gutschein-loeschen" }); break;

    /* Verwaltung: Lieferanten */
    case "neu-lieferant": if (v?.view === "produkt-edit") merkeProdukt(v); oeffne("lieferant-edit", { id: null, l: { name: "", art: b.dataset.art || "lieferant", email: "", vorlage: STANDARD_VORLAGE } }); break;
    case "edit-lieferant": { const l = lieferant(b.dataset.id); oeffne("lieferant-edit", { id: l.id, l: structuredClone(l) }); break; }
    case "l-art": merkeLieferant(v); v.l.art = b.dataset.a; renderSheet(); break;
    case "lieferant-speichern": await lieferantSpeichern(v); break;
    case "lieferant-loeschen": oeffne("frage", { titel: "Löschen?", text: "Produkte mit diesem Lieferanten brauchen danach einen neuen Bestellweg.", ja: "Endgültig löschen", gefahr: true, ziel: "lieferant-loeschen" }); break;

    /* Verwaltung: Buchhaltung */
    case "monat": { const [y, m] = S.monat.split("-").map(Number), d = new Date(y, m - 1 + Number(b.dataset.d), 15); S.monat = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`; render(); break; }
    case "export-csv": speichern(`Shop_${S.monat}.csv`, new Blob([csvMonat(S.monat)], { type: "text/csv" })); break;
    case "export-pdf": { const p = await monatsPdf(S.monat); speichern(`Shop_Monatsbericht_${S.monat}.pdf`, p.blob); break; }
    case "monat-mail": {
      const e2 = E();
      if (!mailOk(e2.buchhaltungEmail || "")){ toast("Bitte zuerst die E-Mail der Buchhaltung in den Einstellungen eintragen."); break; }
      b.disabled = true;
      try {
        const p = await monatsPdf(S.monat);
        const art = await gmail({ to: [e2.buchhaltungEmail], cc: e2.shopEmail ? [e2.shopEmail] : [], subject: `Mitarbeitershop ${monatName(S.monat)}`,
          body: `Hallo,\n\nanbei der Monatsbericht des Mitarbeitershops für ${monatName(S.monat)}: Übersicht je Person als PDF, Einzelpositionen als CSV.\n\nViele Grüße`,
          attachments: [{ filename: `Shop_Monatsbericht_${S.monat}.pdf`, mimeType: "application/pdf", content: p.b64 }, { filename: `Shop_${S.monat}.csv`, mimeType: "text/csv", content: b64(csvMonat(S.monat)) }] });
        toast(art === "entwurf" ? "Monatsbericht liegt als Entwurf in Gmail" : "Monatsbericht gesendet");
      } catch (er){ toast(er?.mailFehler || "Senden fehlgeschlagen."); }
      b.disabled = false; break;
    }

    /* Verwaltung: Einstellungen */
    case "e-schalter": { const k = b.dataset.k; try { await speichereEinst({ [k]: !E()[k] }); } catch (er){ toast(fehlerText(er)); } break; }
    case "e-mailmodus": try { await speichereEinst({ mailModus: b.dataset.m }); } catch (er){ toast(fehlerText(er)); } break;
    case "e-speichern": await einstellungenSpeichern(); break;
  }
});

/* ===== Mini-Kopf: erscheint, sobald die Leiste aus dem Bild ist ===== */
const platz = $("#leiste-platz"), leisteEl = $("#leiste"), mini = $("#minikopf"), miniTaste = $("#mini-filter");
let miniAn = false;
function setFilter(offen){
  offen = offen && miniAn; miniTaste.setAttribute("aria-expanded", String(offen));
  if (offen && !leisteEl.classList.contains("schwebend")){ platz.style.height = platz.offsetHeight + "px"; leisteEl.classList.add("schwebend"); }
  if (!offen && leisteEl.classList.contains("schwebend")){ leisteEl.classList.remove("schwebend"); platz.style.height = ""; }
}
function pruefeMini(){
  const an = platz.getBoundingClientRect().bottom < 0;
  if (an === miniAn) return;
  miniAn = an; mini.classList.toggle("on", an); mini.setAttribute("aria-hidden", String(!an));
  miniTaste.tabIndex = an ? 0 : -1; $("#mini-korb").tabIndex = an ? 0 : -1;
  if (!an) setFilter(false);
}
miniTaste.addEventListener("click", () => setFilter(miniTaste.getAttribute("aria-expanded") !== "true"));
document.addEventListener("keydown", e => { if (e.key === "Escape" && !S.stack.length && leisteEl.classList.contains("schwebend")){ setFilter(false); miniTaste.focus(); } });
document.addEventListener("click", e => { if (leisteEl.classList.contains("schwebend") && e.target.closest("[data-act=tab],[data-act=sub],[data-act=bereich]")) setTimeout(() => { setFilter(false); window.scrollTo({ top: 0 }); }, 0); });
window.addEventListener("scroll", pruefeMini, { passive: true });
window.addEventListener("resize", pruefeMini, { passive: true });

if (!IM_ARTIFACT && "serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});

try { start().catch(e => { S.fehler = "Start: " + (e?.message || e); S.geladen = true; render(); }); } catch (e){ document.getElementById("summary").textContent = "Technischer Hinweis: " + e.message; }
</script>
