<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GAUSS Launcher</title>
<meta name="theme-color" content="#121a2e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Funnel+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#121a2e;            /* Tinte */
    --ink-2:#1b2540;
    --glass:rgba(255,255,255,.07);
    --glass-line:rgba(255,255,255,.12);
    --text:#eef1f7;
    --muted:rgba(238,241,247,.55);
    --focus:#e5533d;          /* Blutorange: Auswahl/Fokus */
    --tile:64px;
    --gap:14px;
    --tb-h: env(titlebar-area-height, 0px);
  }
  :root[data-theme="light"]{
    --ink:#eef0f4; --ink-2:#ffffff;
    --glass:rgba(18,26,46,.05); --glass-line:rgba(18,26,46,.10);
    --text:#121a2e; --muted:rgba(18,26,46,.55);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:"Funnel Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
    background:
      radial-gradient(120% 140% at 0% 0%, var(--ink-2) 0%, var(--ink) 60%);
    color:var(--text);
    overflow:hidden;
    user-select:none;-webkit-user-select:none;
    -webkit-app-region:drag; app-region:drag;   /* ganzes Fenster ziehbar */
    display:flex;flex-direction:column;
  }
  .stage{
    flex:1;display:flex;align-items:center;justify-content:center;
    padding:calc(var(--tb-h) + 6px) 16px 10px;
    position:relative;min-height:0;
  }
  .nav{
    -webkit-app-region:no-drag;app-region:no-drag;
    width:28px;height:28px;border-radius:50%;border:0;flex:none;
    background:transparent;color:var(--muted);cursor:pointer;
    display:grid;place-items:center;transition:background .15s,color .15s;
  }
  .nav:hover{background:var(--glass);color:var(--text)}
  .nav svg{width:16px;height:16px}
  .viewport{
    flex:1;overflow:hidden;min-width:0;
    mask-image:linear-gradient(90deg,transparent 0,#000 24px,#000 calc(100% - 24px),transparent 100%);
    -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 24px,#000 calc(100% - 24px),transparent 100%);
  }
  .dock{
    display:flex;gap:var(--gap);padding:14px 24px 30px;
    width:max-content;transition:transform .35s cubic-bezier(.2,.8,.2,1);
  }
  .app{
    -webkit-app-region:no-drag;app-region:no-drag;
    position:relative;flex:none;width:var(--tile);height:var(--tile);
    border:0;background:none;cursor:pointer;outline:none;
    transition:transform .2s cubic-bezier(.2,.8,.2,1);
  }
  .tile{
    width:100%;height:100%;border-radius:22%;
    display:grid;place-items:center;color:#fff;
    background:linear-gradient(160deg, color-mix(in oklab,var(--c) 82%,#fff) 0%, var(--c) 55%, color-mix(in oklab,var(--c) 80%,#000) 100%);
    box-shadow:0 1px 0 rgba(255,255,255,.35) inset, 0 8px 18px -8px rgba(0,0,0,.6);
  }
  .tile svg{width:46%;height:46%;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .tile.empty{opacity:.45}
  .app:hover{transform:translateY(-4px) scale(1.06)}
  .app.sel .tile{box-shadow:0 0 0 2px var(--ink),0 0 0 4px var(--focus),0 10px 22px -8px rgba(0,0,0,.6)}
  .app .label{
    position:absolute;left:50%;top:calc(100% + 8px);transform:translateX(-50%);
    font-size:12px;font-weight:500;white-space:nowrap;color:var(--muted);
    transition:color .15s;
  }
  .app.sel .label,.app:hover .label{color:var(--text)}
  .app .dot{
    position:absolute;left:50%;bottom:-24px;width:4px;height:4px;border-radius:50%;
    background:var(--text);transform:translateX(-50%);opacity:0;
  }
  .app.running .dot{opacity:.7}
  .tools{
    position:absolute;right:12px;bottom:8px;display:flex;gap:2px;
    -webkit-app-region:no-drag;app-region:no-drag;opacity:0;transition:opacity .2s;
  }
  body:hover .tools,.tools:focus-within{opacity:1}
  .tools button{width:24px;height:24px;border:0;border-radius:6px;background:transparent;color:var(--muted);cursor:pointer;display:grid;place-items:center}
  .tools button:hover{background:var(--glass);color:var(--text)}
  .tools svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  body.editing .app .tile{animation:wobble .25s ease-in-out infinite alternate}
  @keyframes wobble{from{transform:rotate(-1.5deg)}to{transform:rotate(1.5deg)}}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

  /* Bearbeiten-Dialog */
  dialog{
    margin:auto;border:1px solid var(--glass-line);border-radius:14px;
    background:var(--ink-2);color:var(--text);padding:16px;width:min(340px,calc(100vw - 32px));
    font:inherit;-webkit-app-region:no-drag;app-region:no-drag;
  }
  dialog::backdrop{background:rgba(0,0,0,.45)}
  dialog h2{font-size:14px;font-weight:600;margin-bottom:12px}
  dialog label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}
  dialog input{width:100%;font:inherit;font-size:13px;padding:8px 10px;border-radius:8px;border:1px solid var(--glass-line);background:var(--glass);color:var(--text)}
  .swatches,.glyphs{display:flex;flex-wrap:wrap;gap:6px}
  .swatches button{width:22px;height:22px;border-radius:50%;border:2px solid transparent;cursor:pointer}
  .swatches button[aria-pressed="true"]{border-color:var(--text)}
  .glyphs button{width:32px;height:32px;border-radius:8px;border:1px solid var(--glass-line);background:var(--glass);color:var(--text);cursor:pointer;display:grid;place-items:center}
  .glyphs button[aria-pressed="true"]{border-color:var(--focus)}
  .glyphs svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .row{display:flex;gap:8px;justify-content:space-between;margin-top:16px}
  .btn{font:inherit;font-size:13px;padding:7px 14px;border-radius:999px;border:1px solid var(--glass-line);background:transparent;color:var(--text);cursor:pointer}
  .btn.primary{background:var(--text);color:var(--ink);border-color:var(--text)}
  .btn.danger{color:#ff8a7a}
</style>
</head>
<body>
  <div class="stage">
    <button class="nav" id="prev" aria-label="Vorheriges Tool"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg></button>
    <div class="viewport" id="viewport"><div class="dock" id="dock" role="toolbar" aria-label="Tools"></div></div>
    <button class="nav" id="next" aria-label="Nächstes Tool"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 18l6-6-6-6"/></svg></button>
    <div class="tools">
      <button id="add" title="Tool hinzufügen" aria-label="Tool hinzufügen"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
      <button id="edit" title="Bearbeiten" aria-label="Bearbeiten"><svg viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg></button>
      <button id="theme" title="Hell/Dunkel" aria-label="Hell/Dunkel"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 4v16" /><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></svg></button>
    </div>
  </div>

  <dialog id="dlg">
    <form method="dialog" id="form">
      <h2 id="dlgTitle">Tool bearbeiten</h2>
      <label for="fName">Name</label>
      <input id="fName" required maxlength="24">
      <label for="fUrl">Adresse</label>
      <input id="fUrl" type="url" placeholder="https://…">
      <label>Farbe</label>
      <div class="swatches" id="fColors"></div>
      <label>Symbol</label>
      <div class="glyphs" id="fGlyphs"></div>
      <div class="row">
        <button type="button" class="btn danger" id="fDelete">Entfernen</button>
        <span style="display:flex;gap:8px">
          <button type="button" class="btn" id="fCancel">Abbrechen</button>
          <button type="submit" class="btn primary">Sichern</button>
        </span>
      </div>
    </form>
  </dialog>

<script>
const GLYPHS = {
  akte:    '<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
  board:   '<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16M15 4v16"/><path d="M5.5 8h1.5M11 8h2M17 8h1.5M11 11h2"/>',
  journal: '<path d="M5 4h11a2 2 0 0 1 2 2v14H7a2 2 0 0 1-2-2z"/><path d="M18 8h1a1 1 0 0 1 1 1v9a2 2 0 0 1-2 2"/><path d="M8.5 8h6M8.5 11.5h6M8.5 15h4"/>',
  wiki:    '<path d="M2 5h6a4 4 0 0 1 4 4v11a3 3 0 0 0-3-3H2z"/><path d="M22 5h-6a4 4 0 0 0-4 4v11a3 3 0 0 1 3-3h7z"/>',
  raster:  '<rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><circle cx="16.5" cy="16.5" r="3.5"/>',
  buecher: '<path d="M4 4h4v16H4zM9 4h4v16H9z"/><path d="M14.5 5.5l3.8-1 3.2 14.6-3.8 1z"/>',
  paket:   '<path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M4 7.5l8 4.5 8-4.5M12 12v9"/>',
  werkzeug:'<path d="M14.5 6.5a4 4 0 0 0 5 5L13 18a2.1 2.1 0 0 1-3-3z"/><path d="M14.5 6.5L17 4l3 3-2.5 2.5"/><path d="M4 20l5-5"/>',
  auto:    '<path d="M5 16V11l2-5h10l2 5v5"/><path d="M3 16h18v2H3z"/><circle cx="7.5" cy="13" r="1"/><circle cx="16.5" cy="13" r="1"/>',
  kalender:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  mail:    '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/>',
  chat:    '<path d="M4 5h16v11H9l-5 4z"/>',
  ordner:  '<path d="M3 6h7l2 2h9v11H3z"/>',
  stern:   '<path d="M12 3l2.6 5.6 6.1.7-4.5 4.2 1.2 6L12 16.6 6.6 19.5l1.2-6L3.3 9.3l6.1-.7z"/>',
  kreis:   '<circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/>',
  link:    '<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>'
};
const COLORS = ['#e5533d','#c4267a','#1f3a7a','#2b6fd6','#0f8a7a','#3d8b37','#c98a12','#6b4fc4','#4a5468','#121a2e'];

const DEFAULTS = [
  {id:'sopart',   name:'SoPart',         url:'', color:'#e5533d', glyph:'akte'},
  {id:'projekte', name:'Projekte',       url:'', color:'#2b6fd6', glyph:'board'},
  {id:'insights', name:'Insights',       url:'', color:'#c4267a', glyph:'journal'},
  {id:'wiki',     name:'Wiki',           url:'', color:'#4a5468', glyph:'wiki'},
  {id:'ds',       name:'Design System',  url:'https://designsystem.gauss-lvs.de/', color:'#1f3a7a', glyph:'raster'},
  {id:'biblio',   name:'Bibliothek',     url:'https://syptqw9jty-netizen.github.io/explorer/bibliothek/', color:'#c4267a', glyph:'buecher'},
  {id:'werbe',    name:'Werbemittel',    url:'https://syptqw9jty-netizen.github.io/explorer/werbemittel/', color:'#c98a12', glyph:'paket'},
  {id:'werkstatt',name:'Werkstatt',      url:'https://syptqw9jty-netizen.github.io/explorer/methoden/', color:'#0f8a7a', glyph:'werkzeug'},
  {id:'shop',     name:'Shop',           url:'https://syptqw9jty-netizen.github.io/explorer/shop/', color:'#c4267a', glyph:'stern'},
  {id:'fahrten',  name:'Fahrtenbuch',    url:'', color:'#3d8b37', glyph:'auto'}
];

const store = {
  get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch{return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}
};
let apps = store.get('launcher.apps', DEFAULTS);
let sel  = Math.min(store.get('launcher.sel', 0), apps.length-1);
let editing = false;
const opened = new Set();

const dock = document.getElementById('dock');
const viewport = document.getElementById('viewport');

function svg(g){return `<svg viewBox="0 0 24 24" aria-hidden="true">${GLYPHS[g]||GLYPHS.link}</svg>`}

function render(){
  dock.innerHTML = apps.map((a,i)=>`
    <button class="app${i===sel?' sel':''}${opened.has(a.id)?' running':''}" data-i="${i}"
      title="${a.url?a.name:a.name+' – Adresse fehlt'}" aria-label="${a.name}" tabindex="${i===sel?0:-1}">
      <div class="tile${a.url?'':' empty'}" style="--c:${a.color}">${svg(a.glyph)}</div>
      <span class="label">${a.name}</span><span class="dot"></span>
    </button>`).join('');
  center();
}

function center(){
  const el = dock.children[sel]; if(!el) return;
  const vw = viewport.clientWidth, dw = dock.scrollWidth;
  let x = vw/2 - (el.offsetLeft + el.offsetWidth/2);
  x = Math.min(0, Math.max(vw - dw, x));
  if (dw <= vw) x = (vw - dw)/2;
  dock.style.transform = `translateX(${x}px)`;
}

function select(i, focus=true){
  sel = (i + apps.length) % apps.length;
  store.set('launcher.sel', sel);
  [...dock.children].forEach((b,j)=>{b.classList.toggle('sel',j===sel);b.tabIndex=j===sel?0:-1});
  if(focus) dock.children[sel]?.focus({preventScroll:true});
  center();
}

function launch(i){
  const a = apps[i]; if(!a) return;
  if(editing || !a.url){ openEditor(i); return; }
  // Benanntes Ziel: ein zweiter Klick holt dasselbe Fenster/denselben Tab zurück
  window.open(a.url, 'gauss-' + a.id);
  opened.add(a.id); select(i,false); render();
}

dock.addEventListener('click', e=>{
  const b = e.target.closest('.app'); if(!b) return;
  launch(+b.dataset.i);
});
dock.addEventListener('contextmenu', e=>{
  const b = e.target.closest('.app'); if(!b) return;
  e.preventDefault(); openEditor(+b.dataset.i);
});
document.getElementById('prev').onclick = ()=>select(sel-1);
document.getElementById('next').onclick = ()=>select(sel+1);

document.addEventListener('keydown', e=>{
  if(document.querySelector('dialog[open]')) return;
  if(e.key==='ArrowRight'){select(sel+1);e.preventDefault()}
  else if(e.key==='ArrowLeft'){select(sel-1);e.preventDefault()}
  else if(e.key==='Home'){select(0)}
  else if(e.key==='End'){select(apps.length-1)}
  else if(e.key==='Enter'||e.key===' '){launch(sel);e.preventDefault()}
  else if(/^[1-9]$/.test(e.key) && !e.metaKey && !e.ctrlKey){const i=+e.key-1; if(apps[i]){select(i);launch(i)}}
  else if(e.key==='Escape' && editing){toggleEdit()}
});

// Mausrad / Trackpad: links-rechts blättern
let wheelLock=0;
viewport.addEventListener('wheel', e=>{
  e.preventDefault();
  const d = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
  if(Math.abs(d) < 8 || Date.now() < wheelLock) return;
  wheelLock = Date.now() + 140;
  select(sel + (d>0?1:-1), false);
},{passive:false});

// Wischen (Touch)
let sx=null;
viewport.addEventListener('pointerdown',e=>{if(e.pointerType!=='mouse')sx=e.clientX});
viewport.addEventListener('pointerup',e=>{
  if(sx===null) return; const dx=e.clientX-sx; sx=null;
  if(Math.abs(dx)>40) select(sel+(dx<0?1:-1),false);
});

window.addEventListener('resize', center);

/* Bearbeiten */
function toggleEdit(){editing=!editing;document.body.classList.toggle('editing',editing)}
document.getElementById('edit').onclick = toggleEdit;
document.getElementById('add').onclick = ()=>openEditor(-1);

const dlg = document.getElementById('dlg');
const fName = document.getElementById('fName'), fUrl = document.getElementById('fUrl');
let editIndex = -1, fColor = COLORS[0], fGlyph = 'link';

function paintPickers(){
  document.getElementById('fColors').innerHTML = COLORS.map(c=>
    `<button type="button" style="background:${c}" data-c="${c}" aria-label="Farbe ${c}" aria-pressed="${c===fColor}"></button>`).join('');
  document.getElementById('fGlyphs').innerHTML = Object.keys(GLYPHS).map(g=>
    `<button type="button" data-g="${g}" aria-label="${g}" aria-pressed="${g===fGlyph}">${svg(g)}</button>`).join('');
}
document.getElementById('fColors').onclick = e=>{const b=e.target.closest('[data-c]'); if(b){fColor=b.dataset.c;paintPickers()}};
document.getElementById('fGlyphs').onclick = e=>{const b=e.target.closest('[data-g]'); if(b){fGlyph=b.dataset.g;paintPickers()}};

function openEditor(i){
  editIndex = i;
  const a = apps[i] || {name:'',url:'',color:COLORS[3],glyph:'link'};
  document.getElementById('dlgTitle').textContent = i<0 ? 'Tool hinzufügen' : a.name + ' bearbeiten';
  document.getElementById('fDelete').style.visibility = i<0 ? 'hidden' : 'visible';
  fName.value=a.name; fUrl.value=a.url; fColor=a.color; fGlyph=a.glyph;
  paintPickers(); dlg.showModal(); (a.url?fName:fUrl).focus();
}
document.getElementById('form').onsubmit = ()=>{
  const data = {name:fName.value.trim()||'Tool', url:fUrl.value.trim(), color:fColor, glyph:fGlyph};
  if(editIndex<0){ apps.push({id:'t'+Date.now().toString(36), ...data}); sel=apps.length-1; }
  else apps[editIndex] = {...apps[editIndex], ...data};
  store.set('launcher.apps', apps); render();
};
document.getElementById('fCancel').onclick = ()=>dlg.close();
document.getElementById('fDelete').onclick = ()=>{
  if(editIndex<0) return;
  apps.splice(editIndex,1); sel=Math.max(0,Math.min(sel,apps.length-1));
  store.set('launcher.apps', apps); dlg.close(); render();
};

/* Hell/Dunkel */
const root = document.documentElement;
let theme = store.get('launcher.theme','dark');
root.dataset.theme = theme;
document.getElementById('theme').onclick = ()=>{
  theme = theme==='dark'?'light':'dark'; root.dataset.theme = theme; store.set('launcher.theme',theme);
};

/* Als installierte App: Fenster beim ersten Start auf Leistengröße bringen */
const standalone = matchMedia('(display-mode: window-controls-overlay)').matches ||
                   matchMedia('(display-mode: standalone)').matches;
if(standalone && !store.get('launcher.sized',false)){
  try{ window.resizeTo(Math.min(screen.availWidth, 760), 168); store.set('launcher.sized',true);}catch{}
}

if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});

render(); select(sel,false);
</script>
</body>
</html>
