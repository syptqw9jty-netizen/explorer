<style>
/*
 * GAUSS Werbemittel — Anwendung im GAUSS-Designsystem, Schwester der Design Bibliothek.
 * Tokens, Komponenten und Zustandsregeln 1:1 aus der Design Bibliothek übernommen (Stand 26.10.2026).
 * Ausprägung Unternehmen: Markenskala Magenta (--marke-hue 345). Primäraktion = Tinte, Warnung = Amber.
 * Layout: eine Spalte, Seitentitel, sticky Leiste (Ort-Leiter Bestand/Ausgaben/Eingänge, Suche, Kategorien),
 * Widget Typ A (Titel außen, weiße Karte), alles Weitere als Sheet von unten.
 */
:root{
  --font-ui:"Funnel Sans",-apple-system,BlinkMacSystemFont,system-ui,"Segoe UI",Roboto,sans-serif;

  --neutral-0:oklch(1 0 0);
  --neutral-50:oklch(0.985 0.004 265);
  --neutral-100:oklch(0.965 0.007 265);
  --neutral-200:oklch(0.92 0.01 265);
  --neutral-300:oklch(0.85 0.014 265);
  --neutral-400:oklch(0.71 0.02 265);
  --neutral-500:oklch(0.58 0.028 265);
  --neutral-600:oklch(0.48 0.038 265);
  --neutral-700:oklch(0.4 0.048 265);
  --neutral-800:oklch(0.34 0.035 265);
  --neutral-900:oklch(0.27 0.04 265);
  --neutral-950:oklch(0.22 0.045 265);

  /* Ausprägung Unternehmen: Magenta */
  --marke-hue:345;
  --marke-050:oklch(0.97 0.016 var(--marke-hue));
  --marke-100:oklch(0.94 0.033 var(--marke-hue));
  --marke-200:oklch(0.89 0.064 var(--marke-hue));
  --marke-300:oklch(0.82 0.11 var(--marke-hue));
  --marke-400:oklch(0.75 0.148 var(--marke-hue));
  --marke-500:oklch(0.68 0.163 var(--marke-hue));
  --marke-600:oklch(0.6 0.153 var(--marke-hue));
  --marke-700:oklch(0.52 0.136 var(--marke-hue));

  --status-fehler-text:oklch(0.5 0.18 25);   --status-fehler-flaeche:oklch(0.965 0.02 25);
  --status-erfolg-text:oklch(0.47 0.11 150); --status-erfolg-flaeche:oklch(0.965 0.03 150);
  --status-info-text:oklch(0.48 0.14 250);   --status-info-flaeche:oklch(0.965 0.02 250);
  --status-warnung-text:oklch(0.5 0.105 85); --status-warnung-flaeche:oklch(0.97 0.055 92);

  --background:var(--neutral-50);
  --leiste:var(--neutral-100);
  --rahmenflaeche:var(--neutral-50);
  --objekt:var(--neutral-0);
  --erhoeht:var(--neutral-200);
  --tastenflaeche:var(--neutral-100);
  --popover:var(--neutral-0);
  --linie:var(--neutral-200);
  --rahmen:var(--neutral-500);
  /* Hell: Texttinte leichter und blauer als neutral-950 (Hue 262, mehr Chroma); Kontraste auf Weiß ≈ 11:1 / 7:1 / 5,3:1 */
  --tinte-text:oklch(0.31 0.072 262);
  --foreground:var(--tinte-text);
  --text-sekundaer:oklch(0.45 0.062 262);
  --tertiaer:oklch(0.52 0.05 262);
  --deaktiviert:var(--neutral-400);
  --primary:var(--tinte-text);
  --primary-foreground:var(--neutral-0);
  --hover:color-mix(in oklab,var(--neutral-950) 6%,transparent);
  --pressed:color-mix(in oklab,var(--neutral-950) 10%,transparent);
  --ort-aktiv:var(--neutral-300);
  --gewaehlt:var(--marke-600);
  /* Gewählt mit Text (Chips): Magenta 600 + Weiß < 4,5:1 → Stufe 700 hell, im Dunkeln helle Fläche mit Tinte */
  --gewaehlt-text-flaeche:var(--marke-700);
  --gewaehlt-text-farbe:var(--neutral-0);
  --gewaehlt-text:var(--neutral-0);
  --zaehler:var(--marke-600);
  --fokus:var(--marke-700);
  --fokus-innen:var(--neutral-0);
  --link:var(--marke-700);
  --logo:var(--tinte-text);
  --logo-marke:var(--marke-600);
  --logo-marke-schatten:var(--marke-700);
  --popup-backdrop:color-mix(in oklab,var(--neutral-950) 20%,transparent);
  --schatten-farbe:var(--neutral-950);
  --schatten-widget:0 1px 2px color-mix(in oklab,var(--neutral-950) 6%,transparent),0 6px 16px -8px color-mix(in oklab,var(--neutral-950) 18%,transparent);
  --schatten-hoch:0 20px 48px -16px color-mix(in oklab,var(--schatten-farbe) 16%,transparent),0 4px 14px -8px color-mix(in oklab,var(--schatten-farbe) 8%,transparent);

  /* Cover: nur Neutralskala, Bauhaus-Form als Unterscheidung */
  --cover-a:var(--neutral-950); --cover-a-t:var(--neutral-50);
  --cover-b:var(--neutral-700); --cover-b-t:var(--neutral-0);
  --cover-c:var(--neutral-200); --cover-c-t:var(--neutral-950);
  --cover-d:var(--neutral-100); --cover-d-t:var(--neutral-950);

  --inhalt:680px;
  --radius-aktion:999px; --radius-zeile:8px; --radius-block:12px; --radius-karte:16px; --radius-flaeche:20px;
  --hoehe-touchziel:44px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --dunkel-seite:oklch(0.16 0.028 265); --dunkel-karte:oklch(0.20 0.03 265); --dunkel-erhoeht:oklch(0.245 0.032 265); --dunkel-linie:oklch(0.29 0.03 265);
  --status-fehler-text:oklch(0.78 0.13 25);   --status-fehler-flaeche:oklch(0.29 0.06 25);
  --status-erfolg-text:oklch(0.78 0.12 150);  --status-erfolg-flaeche:oklch(0.28 0.05 150);
  --status-info-text:oklch(0.78 0.11 250);    --status-info-flaeche:oklch(0.29 0.06 250);
  --status-warnung-text:oklch(0.85 0.13 88);  --status-warnung-flaeche:oklch(0.3 0.06 85);
  --background:var(--dunkel-seite); --leiste:var(--dunkel-seite); --rahmenflaeche:var(--dunkel-seite);
  --objekt:var(--dunkel-karte); --erhoeht:var(--dunkel-erhoeht); --tastenflaeche:var(--dunkel-erhoeht); --popover:var(--dunkel-karte);
  --linie:var(--dunkel-linie); --rahmen:var(--neutral-400);
  --foreground:var(--neutral-50); --text-sekundaer:var(--neutral-300); --tertiaer:var(--neutral-300); --deaktiviert:var(--neutral-600);
  --primary:var(--neutral-50); --primary-foreground:var(--neutral-950);
  --hover:color-mix(in oklab,white 8%,transparent); --pressed:color-mix(in oklab,white 10%,transparent);
  --ort-aktiv:var(--dunkel-erhoeht); --gewaehlt:var(--marke-500); --zaehler:var(--marke-500); --gewaehlt-text-flaeche:var(--marke-300); --gewaehlt-text-farbe:var(--neutral-950);
  --fokus:var(--marke-400); --fokus-innen:var(--neutral-950); --link:var(--marke-300); --logo:var(--neutral-50); --logo-marke:var(--marke-400); --logo-marke-schatten:var(--marke-600);
  --popup-backdrop:color-mix(in oklab,var(--neutral-950) 55%,transparent);
  --schatten-farbe:oklch(0.1 0.03 270);
  --schatten-widget:0 1px 2px color-mix(in oklab,black 30%,transparent),0 8px 20px -10px color-mix(in oklab,black 55%,transparent);
  --schatten-hoch:0 24px 56px -18px color-mix(in oklab,var(--schatten-farbe) 65%,transparent),0 4px 16px -8px color-mix(in oklab,var(--schatten-farbe) 40%,transparent);
  --cover-a:var(--neutral-50); --cover-a-t:var(--neutral-950);
  --cover-b:var(--neutral-400); --cover-b-t:var(--neutral-950);
  --cover-c:var(--neutral-800); --cover-c-t:var(--neutral-50);
  --cover-d:var(--dunkel-erhoeht); --cover-d-t:var(--neutral-50);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --dunkel-seite:oklch(0.16 0.028 265); --dunkel-karte:oklch(0.20 0.03 265); --dunkel-erhoeht:oklch(0.245 0.032 265); --dunkel-linie:oklch(0.29 0.03 265);
  --status-fehler-text:oklch(0.78 0.13 25);   --status-fehler-flaeche:oklch(0.29 0.06 25);
  --status-erfolg-text:oklch(0.78 0.12 150);  --status-erfolg-flaeche:oklch(0.28 0.05 150);
  --status-info-text:oklch(0.78 0.11 250);    --status-info-flaeche:oklch(0.29 0.06 250);
  --status-warnung-text:oklch(0.85 0.13 88);  --status-warnung-flaeche:oklch(0.3 0.06 85);
  --background:var(--dunkel-seite); --leiste:var(--dunkel-seite); --rahmenflaeche:var(--dunkel-seite);
  --objekt:var(--dunkel-karte); --erhoeht:var(--dunkel-erhoeht); --tastenflaeche:var(--dunkel-erhoeht); --popover:var(--dunkel-karte);
  --linie:var(--dunkel-linie); --rahmen:var(--neutral-400);
  --foreground:var(--neutral-50); --text-sekundaer:var(--neutral-300); --tertiaer:var(--neutral-300); --deaktiviert:var(--neutral-600);
  --primary:var(--neutral-50); --primary-foreground:var(--neutral-950);
  --hover:color-mix(in oklab,white 8%,transparent); --pressed:color-mix(in oklab,white 10%,transparent);
  --ort-aktiv:var(--dunkel-erhoeht); --gewaehlt:var(--marke-500); --zaehler:var(--marke-500); --gewaehlt-text-flaeche:var(--marke-300); --gewaehlt-text-farbe:var(--neutral-950);
  --fokus:var(--marke-400); --fokus-innen:var(--neutral-950); --link:var(--marke-300); --logo:var(--neutral-50); --logo-marke:var(--marke-400); --logo-marke-schatten:var(--marke-600);
  --popup-backdrop:color-mix(in oklab,var(--neutral-950) 55%,transparent);
  --schatten-farbe:oklch(0.1 0.03 270);
  --schatten-widget:0 1px 2px color-mix(in oklab,black 30%,transparent),0 8px 20px -10px color-mix(in oklab,black 55%,transparent);
  --schatten-hoch:0 24px 56px -18px color-mix(in oklab,var(--schatten-farbe) 65%,transparent),0 4px 16px -8px color-mix(in oklab,var(--schatten-farbe) 40%,transparent);
  --cover-a:var(--neutral-50); --cover-a-t:var(--neutral-950);
  --cover-b:var(--neutral-400); --cover-b-t:var(--neutral-950);
  --cover-c:var(--neutral-800); --cover-c-t:var(--neutral-50);
  --cover-d:var(--dunkel-erhoeht); --cover-d-t:var(--neutral-50);
  color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--background);color:var(--foreground);font-family:var(--font-ui);font-size:15px;line-height:22px;letter-spacing:-.0025em;
  font-feature-settings:"cv01","cv09","ss03","calt","liga";-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--rahmenflaeche)}
::selection{background:color-mix(in oklab,var(--marke-500) 28%,transparent)}
button,input,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--fokus);outline-offset:2px;box-shadow:0 0 0 2px var(--fokus-innen)}
.wrap{max-width:var(--inhalt);margin:0 auto;padding-block:16px 48px}

/* Rollen-Typografie */
.etikett{font-size:11px;line-height:16px;font-weight:500;text-transform:uppercase;letter-spacing:.04em;color:var(--tertiaer)}
.titel-seite{font-size:28px;line-height:36px;font-weight:600;letter-spacing:-.02em;margin:0;text-wrap:balance}
.titel-bereich{font-size:17px;line-height:24px;font-weight:600;letter-spacing:-.016em;margin:0}
.titel-karte{font-size:16px;line-height:22px;font-weight:600;letter-spacing:-.012em;margin:0}
.meta{font-size:13px;line-height:20px;color:var(--text-sekundaer)}
.zahl{font-variant-numeric:tabular-nums}

/* Kopf */
.kopf{display:flex;align-items:center;gap:10px;margin-bottom:20px}
.kopf .merk-taste{margin-left:auto}
.merk-taste{position:relative;width:44px;height:44px;flex:none}
.merk-taste.klein{width:40px;height:40px}
.minikopf .innen-kopf .merk-taste{margin-right:-4px}
.zaehler-zahl{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--gewaehlt-text-flaeche);color:var(--gewaehlt-text-farbe);
  font-size:11px;line-height:18px;font-weight:600;text-align:center;font-variant-numeric:tabular-nums;box-shadow:0 0 0 2px var(--rahmenflaeche)}
.zeichen{width:28px;height:28px;color:var(--logo);flex:none}
.kopf .etikett{margin:0}
.seitenkopf{display:grid;gap:4px}

/* Sticky Leiste: Rahmenfläche, Linie erst beim Scrollen */
.leiste{position:relative;z-index:5;background:var(--rahmenflaeche);
  margin:16px calc(-1 * max(16px,env(safe-area-inset-left,0px))) 0;
  padding:10px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));
  display:grid;gap:10px;border-bottom:1px solid transparent;transition:border-color 120ms ease}
.leiste.schwebend{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 57px);margin:0;z-index:8;
  padding-left:max(16px,env(safe-area-inset-left,0px),calc((100% - var(--inhalt)) / 2));padding-right:max(16px,env(safe-area-inset-right,0px),calc((100% - var(--inhalt)) / 2));
  border-bottom-color:var(--linie);box-shadow:var(--schatten-hoch);animation:panel-ein 240ms cubic-bezier(.22,1,.36,1) both}
.leiste.schwebend .filter{margin-right:calc(-1 * max(16px,env(safe-area-inset-right,0px),calc((100vw - var(--inhalt)) / 2)));padding-right:max(16px,env(safe-area-inset-right,0px),calc((100vw - var(--inhalt)) / 2))}
@keyframes panel-ein{from{opacity:0;translate:0 -12px}to{opacity:1;translate:0 0}}

/* Mini-Kopf beim Scrollen: Zeichen links, Suche/Filter über runde Icon-Taste rechts */
.minikopf{position:fixed;left:0;right:0;top:0;z-index:9;background:var(--rahmenflaeche);border-bottom:1px solid var(--linie);
  padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-right,0px),calc((100% - var(--inhalt)) / 2)) 0 max(16px,env(safe-area-inset-left,0px),calc((100% - var(--inhalt)) / 2));
  transform:translateY(-100%);transition:transform 160ms ease-out;visibility:hidden}
.minikopf.on{transform:none;visibility:visible}
.minikopf .innen-kopf{height:56px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.minikopf .zeichen{width:24px;height:24px}
.titel-app{font-size:34px;line-height:40px;letter-spacing:-.025em}
.minikopf .kopf-titel{display:flex;align-items:center;gap:10px;font-size:17px;line-height:24px;font-weight:500;letter-spacing:-.016em;margin:0 auto 0 8px}
.minikopf .kopf-titel{white-space:nowrap;min-width:0}.minikopf .kopf-titel::before{flex:none}@media (max-width:359px){.minikopf .kopf-titel{font-size:16px;gap:8px;margin-left:6px}}
.minikopf .kopf-titel::before{content:"";width:2px;height:20px;border-radius:1px;background:color-mix(in oklab,var(--foreground) 22%,transparent)}
.icon-taste.frei{position:relative;width:40px;height:40px}
.icon-taste.frei::after{content:"";position:absolute;inset:-2px}
.icon-taste.frei svg{transition:transform 160ms ease-out}
.icon-taste.frei[aria-expanded="true"] svg{transform:rotate(180deg)}
.icon-taste.frei[aria-expanded="true"]{background-color:var(--ort-aktiv)}
.mini-filter{width:auto!important;display:inline-flex!important;align-items:center;gap:6px;padding:0 12px 0 16px;font-size:14px;font-weight:500}
.mini-filter .punkt{top:4px;right:4px}
@media (max-width:374px){.mini-filter-text{display:none}.mini-filter{width:40px!important;padding:0;justify-content:center}}
.punkt{position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--zaehler);box-shadow:0 0 0 2px var(--objekt)}
.suche{position:relative}
.suche svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--tertiaer);pointer-events:none}
.suche input{width:100%;height:44px;border:1px solid var(--linie);border-radius:var(--radius-aktion);background:var(--objekt);
  padding:0 44px 0 42px;font-size:16px;outline-offset:2px;transition:border-color 120ms ease}
.suche input::placeholder{color:var(--tertiaer)}
.suche input:hover{border-color:var(--rahmen)}
.suche input::-webkit-search-cancel-button{display:none}
.leeren{position:absolute;right:0;top:50%;transform:translateY(-50%);width:44px;height:44px;border:0;border-radius:var(--radius-aktion);background:transparent;color:var(--tertiaer);display:grid;place-items:center}
.leeren:hover{background-image:linear-gradient(var(--hover),var(--hover))}

/* Umschalter = Ort-Leiter */
.umschalter-alt{display:grid;grid-template-columns:repeat(3,1fr);background:var(--leiste);border:1px solid var(--linie);border-radius:var(--radius-aktion);padding:3px;gap:2px}
.umschalter button{border:0;background:transparent;border-radius:var(--radius-aktion);min-height:38px;font-size:14px;font-weight:500;color:var(--text-sekundaer);
  display:flex;align-items:center;justify-content:center;gap:6px}
.umschalter button:hover{background-image:linear-gradient(var(--hover),var(--hover))}
.umschalter button[aria-pressed="true"]{background-color:var(--ort-aktiv);color:var(--foreground);font-weight:600}
.umschalter .zahl{color:var(--tertiaer);font-weight:500}
.umschalter button[aria-pressed="true"] .zahl{color:var(--text-sekundaer)}

/* Themen-Filter = Toggle: gewählt in Marke */
.leiste{grid-template-columns:minmax(0,1fr)}
.filterzeile{display:flex;align-items:center;gap:8px;min-width:0}
.filter-taste{width:44px!important;height:44px!important;flex:none}
.filter-taste[data-aktiv]{background-color:var(--ort-aktiv)}
.filter{flex:1;min-width:0;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-right:calc(-1 * max(16px,env(safe-area-inset-right,0px)));padding:4px max(16px,env(safe-area-inset-right,0px)) 4px 0;
  -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 10px);mask-image:linear-gradient(90deg,transparent 0,#000 10px);padding-left:10px;margin-left:-10px}
.filter::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;min-height:36px;padding:0 14px;border-radius:var(--radius-aktion);border:1px solid var(--linie);
  background:var(--objekt);color:var(--text-sekundaer);font-size:13px;font-weight:500;white-space:nowrap;position:relative}
.chip::after{content:"";position:absolute;inset:-4px 0}
.chip:hover{background-image:linear-gradient(var(--hover),var(--hover))}
.chip[aria-pressed="true"]{background-color:var(--gewaehlt-text-flaeche);border-color:var(--gewaehlt-text-flaeche);color:var(--gewaehlt-text-farbe);font-weight:600}

/* Widget Typ A: Titel außen, Karte weiß */
.bereich{margin-top:20px;display:grid;gap:10px}
.bereich>header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-inline:4px}
.karte{background:var(--objekt);border:1px solid var(--linie);border-radius:var(--radius-karte);box-shadow:var(--schatten-widget);overflow:hidden}
.zeile{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:14px;align-items:center;width:100%;text-align:left;border:0;background:transparent;
  padding:12px 16px;min-height:88px;position:relative;transition:background-color 120ms ease}
.zeile+.zeile{box-shadow:inset 0 1px 0 var(--linie)}
.zeile:hover{background-image:linear-gradient(var(--hover),var(--hover))}
.zeile:active{background-image:linear-gradient(var(--pressed),var(--pressed))}
.zeile .info{min-width:0;display:grid;gap:2px}
.zeile .t{font-size:16px;line-height:22px;font-weight:600;letter-spacing:-.012em}
.zeile .t,.zeile .info>.meta{overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;hyphens:auto}

.zeile .unten{display:flex;align-items:center;flex-wrap:wrap;gap:6px 10px;margin-top:6px}
.zeile .unten .badge{height:22px;padding:0 8px}
.chev{width:7px;height:12px;color:var(--tertiaer)}

/* Cover: typografische Tafel, nur Neutral */
.cover{--c:var(--cover-a);--t:var(--cover-a-t);aspect-ratio:2/3;width:100%;max-width:100%;border-radius:var(--radius-zeile);background:var(--c);color:var(--t);
  position:relative;overflow:hidden;box-shadow:inset 0 0 0 1px color-mix(in oklab,var(--foreground) 8%,transparent);
  display:flex;flex-direction:column;justify-content:space-between;padding:9% 10% 10%}
.cover .form{position:absolute;right:-12%;bottom:-8%;width:62%;aspect-ratio:1;background:currentColor;opacity:.14}
.cover .form.kreis{border-radius:50%}
.cover .form.halb{border-radius:999px 999px 0 0;aspect-ratio:2/1;width:78%;right:-6%;bottom:0}
.cover .form.balken{width:20%;aspect-ratio:auto;top:0;bottom:0;right:14%}
.cover .ct{font-weight:600;line-height:1.06;letter-spacing:-.02em;overflow:hidden;word-break:break-word;hyphens:auto;position:relative}
.cover .ca{font-weight:500;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;position:relative}
.zeile .cover .ct{font-size:6.5px}.zeile .cover .ca{font-size:5px}
.gross .cover{border-radius:var(--radius-block)}
.gross .cover .ct{font-size:14px}.gross .cover .ca{font-size:9px}
.cover-bild{position:absolute;inset:0;display:block;width:100%;height:100%;object-fit:cover;background:var(--erhoeht)}
.quellen{margin:0 4px;display:grid;gap:4px;font-size:13px;line-height:20px;color:var(--tertiaer)}
.quellen p{margin:0}
.quellen a{color:var(--link);text-underline-offset:2px}

/* Badge: Statuspille mit Punkt */
.badge{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:var(--radius-aktion);font-size:12px;line-height:18px;font-weight:500;white-space:nowrap;
  border:1px solid color-mix(in oklab,currentColor 30%,transparent)}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.badge.st-erfolg{background:var(--status-erfolg-flaeche);color:var(--status-erfolg-text)}
.badge.st-info{background:var(--status-info-flaeche);color:var(--status-info-text)}
.badge.st-warnung{background:var(--status-warnung-flaeche);color:var(--status-warnung-text)}
.badge.st-fehler{background:var(--status-fehler-flaeche);color:var(--status-fehler-text)}

.leer{padding:40px 24px;text-align:center}
.leer .titel-karte{margin-bottom:4px}
.leer-aktionen{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px}
.leer-aktionen:empty{display:none}
mark{background:var(--marke-200);color:inherit;border-radius:3px;padding:0 1px}
:root[data-theme="dark"] mark{background:color-mix(in oklab,var(--marke-500) 30%,transparent)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) mark{background:color-mix(in oklab,var(--marke-500) 30%,transparent)}}
.hinweis{margin:16px 4px 0;font-size:13px;line-height:20px;color:var(--tertiaer);text-wrap:balance}
.vorschau{display:flex;gap:10px;align-items:flex-start;margin-top:16px;padding:12px 14px;border-radius:var(--radius-block);
  background:var(--status-info-flaeche);border:1px solid color-mix(in oklab,var(--status-info-text) 40%,var(--status-info-flaeche));color:var(--foreground);font-size:13px;line-height:20px}
.vorschau svg{flex:none;width:18px;height:18px;color:var(--status-info-text);margin-top:1px}

/* Sheet von unten, 240 ms */
.backdrop{position:fixed;inset:0;background:var(--popup-backdrop);z-index:20;opacity:0;transition:opacity 240ms cubic-bezier(.22,1,.36,1)}
.backdrop.on{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--background);border-radius:var(--radius-flaeche) var(--radius-flaeche) 0 0;
  box-shadow:var(--schatten-hoch);max-height:calc(100% - env(safe-area-inset-top,0px) - 20px);overflow-y:auto;overscroll-behavior:contain;
  transform:translateY(100%);transition:transform 240ms cubic-bezier(.22,1,.36,1);
  padding:0 max(16px,env(safe-area-inset-right,0px)) calc(28px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet.on{transform:none}
@media (min-width:720px){.sheet{left:50%;width:640px;margin-left:-320px}}
/* Desktop: breitere Fläche, Bestand zweispaltig, Karussells als Raster, Chips umbrechen */
@media (min-width:1024px){
  :root{--inhalt:1040px}
  .wrap{padding-block:32px 64px}
  .titel-seite{font-size:32px;line-height:40px}
  .titel-app{font-size:40px;line-height:48px}
  .leiste{grid-template-columns:minmax(0,1fr);max-width:none}
  .filter{flex-wrap:wrap;overflow:visible;-webkit-mask-image:none;mask-image:none;margin-right:0;padding-right:0}
  .karussell{flex-wrap:wrap;overflow:visible;margin:0;padding:2px 0 4px;scroll-snap-type:none}
  .karussell li{width:calc((100% - 5 * 12px) / 6)}
  #liste{display:grid;grid-template-columns:1fr 1fr}
  #liste .zeile,#liste .zeile+.zeile{box-shadow:inset 0 -1px 0 var(--linie)}
  #liste .zeile:nth-child(odd){box-shadow:inset -1px -1px 0 var(--linie)}
  #liste .zeile:nth-child(odd):nth-last-child(-n+2){box-shadow:inset -1px 0 0 var(--linie)}
  #liste .zeile:nth-child(even):last-child{box-shadow:none}
  #liste .leer{grid-column:1/-1}
  .sheet{width:720px;margin-left:-360px}
}
/* Kleine Phones */
@media (max-width:359px){
  .titel-seite{font-size:24px;line-height:32px}
  .titel-app{font-size:30px;line-height:36px}
  .zeile{grid-template-columns:40px minmax(0,1fr) auto;gap:12px;padding:12px}
  .held{grid-template-columns:84px minmax(0,1fr)}
  .held h2{font-size:19px;line-height:25px}
  .k-feld{width:46px;height:52px}
  .pin-felder .k-feld{width:48px}
  .stern{width:40px;height:40px}
  .karussell li{width:132px}
  .schalter-paar{gap:6px}
  .admin-oeffnen{grid-template-columns:32px minmax(0,1fr);padding-left:12px}
}

.zeile .bewertet{display:inline-flex;align-items:center;gap:4px;color:var(--text-sekundaer);font-size:13px;line-height:20px;font-variant-numeric:tabular-nums}
.zeile .bewertet svg{width:12px;height:12px;color:var(--foreground)}

  display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding-inline:max(16px,env(safe-area-inset-left,0px));scrollbar-width:none;overscroll-behavior-x:contain}

function vorgangText(v){
  const namen = buchungenVon(v.id).map(b => artikelVon(b.artikelId)?.name || "").join(" ");
  return norm([v.an, v.anlass, v.lieferant, v.bestellnr, v.rechnungsnr, v.kuerzel, v.notiz, namen].join(" "));
}
function markiere(text, w){
  let t = esc(text); if (!w.length) return t;
  const roh = String(text ?? ""), n = norm(roh); if (n.length !== roh.length) return t;
  const treffer = [];
  for (const x of w){ let i = n.indexOf(x); while (i >= 0){ treffer.push([i, i + x.length]); i = n.indexOf(x, i + x.length); } }
  if (!treffer.length) return t;
  treffer.sort((a, b) => a[0] - b[0]); let out = "", pos = 0;
  for (const [s, e] of treffer){ if (s < pos) continue; out += esc(roh.slice(pos, s)) + "<mark>" + esc(roh.slice(s, e)) + "</mark>"; pos = e; }
  return out + esc(roh.slice(pos));
}
const filterAktiv = () => !!(S.q || S.kat.length || S.status !== "alle");
function filterArtikel(){
  const w = woerter();
  let l = aktive().filter(a => (!S.kat.length || S.kat.includes(a.kategorie)) && (!w.length || passt(artikelText(a), w)));
  if (S.status !== "alle") l = l.filter(a => S.status === "knapp" ? status(a).key !== "ok" : status(a).key === S.status);
  const zuletzt = id => S.buchungen.filter(b => b.artikelId === id).reduce((m, b) => (b.datum || "") > m ? b.datum : m, "");
  if (S.sort === "bestand") l.sort((a, b) => bestand(a.id) - bestand(b.id) || a.name.localeCompare(b.name, "de"));
  else if (S.sort === "bewegt") l.sort((a, b) => zuletzt(b.id).localeCompare(zuletzt(a.id)) || a.name.localeCompare(b.name, "de"));
  else l.sort((a, b) => (a.name || "").localeCompare(b.name || "", "de", { numeric: true }));
  return l;
}
function filterVorgaenge(art){
  const w = woerter();
  return S.vorgaenge.filter(v => v.art === art)
    .filter(v => !S.kat.length || buchungenVon(v.id).some(b => S.kat.includes(artikelVon(b.artikelId)?.kategorie)))
    .filter(v => !w.length || passt(vorgangText(v), w))
    .sort((a, b) => (b.datum || "").localeCompare(a.datum || "") || (b.am || "").localeCompare(a.am || ""));
}
function renderFilter(){
  const genutzt = new Set(aktive().map(a => a.kategorie));
  const kats = KATEGORIEN.map(x => x.k).filter(k => genutzt.has(k) || S.kat.includes(k));
  $("#filter").innerHTML = kats.map(k => `<button class="chip" data-kat="${esc(k)}" aria-pressed="${S.kat.includes(k)}">${esc(k)}</button>`).join("");
  $("#filter-punkt").hidden = S.status === "alle" && S.sort === "name";
  document.querySelectorAll("#leiste .umschalter button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.tab === S.tab)));
}

/* ===== Listen ===== */
function artikelZeile(a, w = []){
  const s = status(a), n = bestand(a.id), vm = variantenMeta(a);
  const meta = [a.kategorie, a.lagerort].filter(Boolean).join(" · ");
  return `<button class="zeile artikel" data-artikel="${esc(a.id)}">
    ${kachel(a)}
    <span class="info"><span class="t">${markiere(a.name, w)}</span><span class="meta">${markiere(meta, w)}</span>
      ${vm ? `<span class="meta varianten-meta">${esc(vm)}</span>` : ""}
      <span class="unten"><span class="badge ${s.cls}">${s.label}</span>${a.mindest ? `<span class="meta zahl">Mindestens ${zahl(a.mindest)}</span>` : ""}</span></span>
    <span class="rechts"><span class="menge"><b class="${n < 0 ? "neg" : ""}">${ca(a.id)}${zahl(n)}</b><span class="meta">${geschaetzt(a.id) ? "geschätzt" : esc(einheit(a))}</span></span>${ICON.chev}</span>
  </button>`;
}
function vorgangZeile(v, w = []){
  const bs = buchungenVon(v.id), summe = bs.reduce((s, b) => s + Math.abs(Number(b.menge || 0)), 0);
  const namen = [...new Set(bs.map(b => artikelVon(b.artikelId)?.name || "Gelöschter Artikel"))];
  const titel = v.art === "eingang" ? (v.lieferant || "Eingang") : (v.an || "Ausgabe");
  const meta = [v.art === "eingang" ? v.bestellnr && `Bestellung ${v.bestellnr}` : v.anlass, fmt(v.datum), v.kuerzel].filter(Boolean).join(" · ");
  const rech = v.art === "eingang" ? (v.rechnung === "bezahlt" ? `<span class="badge st-erfolg">Bezahlt</span>` : v.rechnung === "offen" ? `<span class="badge st-warnung">Rechnung offen</span>` : "") : "";
  return `<button class="zeile" data-vorgang="${esc(v.id)}">
    <span class="kachel ${ART[v.art].cls}" aria-hidden="true">${ART[v.art].icon}</span>
    <span class="info"><span class="t">${markiere(titel, w)}</span><span class="meta">${markiere(meta, w)}</span>
      <span class="meta">${markiere(namen.slice(0, 3).join(", ") + (namen.length > 3 ? ` und ${namen.length - 3} weitere` : ""), w)}</span>
      ${rech ? `<span class="unten">${rech}</span>` : ""}</span>
    <span class="rechts"><span class="menge"><b>${v.art === "eingang" ? "+" : v.art === "inventur" ? "±" : "−"}${v.geschaetzt ? "≈ " : ""}${zahl(summe)}</b><span class="meta">${plural(bs.length, "Position", "Positionen")}</span></span>${ICON.chev}</span>
  </button>`;
}
function leerKatalog(){
  return `<div class="leer"><p class="titel-karte">Noch keine Artikel</p>
    <p class="meta" style="margin:0">Lege an, was im Lager liegt. Danach den Bestand per Eingang oder Inventur erfassen.</p>
    <ul class="leer-kategorien">${KATEGORIEN.map(x => `<li>${kachel({ kategorie: x.k })}<span><span class="titel-karte" style="font-size:15px">${esc(x.k)}</span><span class="meta" style="display:block">${esc(x.h)}</span></span></li>`).join("")}</ul>
    <div class="leer-aktionen"><button class="taste primaer klein" data-neu-artikel>${ICON.plus} Ersten Artikel anlegen</button>${S.modus === "lokal" && !IM_ARTIFACT ? `<button class="taste sekundaer klein" data-demo-laden>Mit Demo-Daten ausprobieren</button>` : ""}</div></div>`;
}
function nichtsGefunden(){
  return `<div class="leer"><p class="titel-karte">Nichts gefunden</p>
    <p class="meta" style="margin:0">${S.kat.length || S.status !== "alle" ? "Die Filter grenzen die Suche ein." : "Anderes Wort oder kürzere Schreibweise probieren."}</p>
    <div class="leer-aktionen"><button class="taste sekundaer klein" data-zuruecksetzen>Filter zurücksetzen</button></div></div>`;
}
function render(){
  const alle = aktive(), knapp = alle.filter(a => a.mindest && status(a).key !== "ok");
  const offen = S.vorgaenge.filter(v => v.art === "eingang" && v.rechnung === "offen").length;
  const wert = alle.reduce((s, a) => s + Math.max(0, bestand(a.id)) * ekVon(a), 0);
  $("#summary").textContent = !S.geladen ? "Bestand wird geladen …"
    : [plural(alle.length, "Artikel", "Artikel"), knapp.length ? `${zahl(knapp.length)} nachbestellen` : "alles vorrätig", wert ? `Bestandswert ${euro(Math.round(wert))}` : "", offen ? plural(offen, "Rechnung offen", "Rechnungen offen") : ""].filter(Boolean).join(" · ");
  $("#leeren").hidden = !S.q; $("#mini-punkt").hidden = !filterAktiv();
  const el = $("#inhalt");
  if (!S.geladen){ el.innerHTML = `<section class="bereich"><div class="karte"><div class="leer"><p class="meta" style="margin:0">Bestand wird geladen …</p></div></div></section>`; return; }
  const w = woerter();
  if (S.tab === "bestand"){
    const items = filterArtikel(), gefiltert = filterAktiv();
    const knappItems = !gefiltert ? knapp.slice().sort((a, b) => bestand(a.id) - bestand(b.id)) : [];
    el.innerHTML = (knappItems.length ? `<section class="bereich" aria-labelledby="knapp-titel">
        <header><h2 class="titel-bereich" id="knapp-titel">Nachbestellen</h2><span class="meta zahl">${zahl(knappItems.length)}</span></header>
        <div class="karte liste-zwei">${knappItems.map(a => artikelZeile(a)).join("")}</div></section>` : "")
      + `<section class="bereich" aria-labelledby="liste-titel">
        <header><h2 class="titel-bereich" id="liste-titel">${gefiltert ? "Treffer" : "Bestand"}</h2>
          ${gefiltert ? `<span class="meta zahl" aria-live="polite">${plural(items.length, "Artikel", "Artikel")}</span>` : `<button class="taste sekundaer klein" data-neu-artikel>${ICON.plusK} Artikel</button>`}</header>
        <div class="karte liste-zwei">${!alle.length ? leerKatalog() : items.length ? items.map(a => artikelZeile(a, w)).join("") : nichtsGefunden()}</div></section>`;
  } else {
    const art = S.tab, items = filterVorgaenge(art);
    if (!items.length){
      const nie = !S.vorgaenge.some(v => v.art === art);
      el.innerHTML = `<section class="bereich"><header><h2 class="titel-bereich">${art === "ausgabe" ? "Ausgaben" : "Eingänge"}</h2></header><div class="karte">${nie
        ? `<div class="leer"><p class="titel-karte">${art === "ausgabe" ? "Noch nichts ausgegeben" : "Noch keine Eingänge"}</p><p class="meta" style="margin:0">${art === "ausgabe" ? "Jede Ausgabe hält fest, was an wen ging und wofür." : "Jeder Eingang hält Lieferant, Bestellung und Rechnung fest."}</p>
           <div class="leer-aktionen"><button class="taste primaer klein" data-buchen="${art}">${art === "ausgabe" ? "Ausgabe buchen" : "Eingang buchen"}</button></div></div>`
        : nichtsGefunden()}</div></section>`;
      return;
    }
    const gruppen = new Map();
    for (const v of items){ const m = monat(v.datum); if (!gruppen.has(m)) gruppen.set(m, []); gruppen.get(m).push(v); }
    el.innerHTML = [...gruppen].map(([m, l], i) => `<section class="bereich monat" aria-labelledby="m${i}">
      <header><h2 class="titel-bereich" id="m${i}">${esc(m)}</h2><span class="meta zahl">${plural(l.length, art === "ausgabe" ? "Ausgabe" : "Eingang", art === "ausgabe" ? "Ausgaben" : "Eingänge")}</span></header>
      <div class="karte liste-zwei">${l.map(v => vorgangZeile(v, w)).join("")}</div></section>`).join("");
  }
}

/* ===== Sheet ===== */
function renderSheet(){
  const D = $("#detail");
  const v = S.view;
  D.innerHTML = v === "artikel" ? htmlArtikel() : v === "artikel-edit" ? htmlArtikelEdit() : v === "buchen" ? htmlBuchen()
    : v === "waehlen" ? htmlWaehlen() : v === "vorgang" ? htmlVorgang() : v === "inventur" ? htmlInventur() : v === "filter" ? htmlFilter()
    : v === "kuerzel" ? htmlKuerzel() : v === "demo" ? htmlDemo() : "";
}
function openSheet(view, data = {}){
  Object.assign(S, data); S.frage = null; S.kEdit = null; S.kWert = null;
  if (view === "artikel" && data.open) S.kText = "";
  if (view === "artikel-edit"){ KI.status = ""; S.fotoLaedt = null; }
  const sh = $("#sheet"), bd = $("#backdrop");
  if (sh.hidden){
    S.stack = []; S.opener = document.activeElement;
    document.querySelectorAll("main, #minikopf").forEach(x => x.inert = true);
    sh.hidden = bd.hidden = false;
    requestAnimationFrame(() => requestAnimationFrame(() => { sh.classList.add("on"); bd.classList.add("on"); }));
    document.body.style.overflow = "hidden";
  } else if (S.view && S.view !== view) S.stack.push({ view: S.view, open: S.open });
  S.view = view; renderSheet(); sh.scrollTop = 0;
  setTimeout(() => { const t = $("#d-titel"); if (t){ t.tabIndex = -1; t.focus({ preventScroll: true }); } }, 60);
}
function zurueck(){
  const z = S.stack.pop(); if (!z) return closeSheet();
  S.view = z.view; S.open = z.open; S.frage = null; renderSheet(); $("#sheet").scrollTop = 0;
}
function closeSheet(){
  const sh = $("#sheet"), bd = $("#backdrop");
  S.view = null; S.open = null; S.stack = []; S.frage = null;
  sh.classList.remove("on"); bd.classList.remove("on"); document.body.style.overflow = "";
  document.querySelectorAll("main, #minikopf").forEach(x => x.inert = false);
  setTimeout(() => { if (!S.view) sh.hidden = bd.hidden = true; }, 240);
  if (S.opener && S.opener.isConnected) S.opener.focus({ preventScroll: true }); S.opener = null;
}
const zurueckTaste = () => S.stack.length ? `<button class="zurueck" data-zurueck>${ICON.zurueck} Zurück</button>` : "";

/* --- Artikel --- */

function htmlArtikel(){

    ${a.notiz ? `<section class="abschnitt"><h3 class="titel-bereich">Interne Notiz</h3><div class="karte innen"><p class="text">${esc(a.notiz)}</p></div></section>` : ""}
    ${kommentareHtml(a)}
    <section class="abschnitt"><header class="bereich-kopf"><h3 class="titel-bereich">Verlauf</h3><span class="meta zahl">${verlauf.length ? plural(verlauf.length, "Buchung", "Buchungen") : ""}</span></header>

function freistellen(src){

  const bg = new Uint8Array(w * h), q = new Int32Array(w * h); let qh = 0, qt = 0;

  for (let x = 0; x < w; x++){ rein(x); rein((h - 1) * w + x); } for (let y = 0; y < h; y++){ rein(y * w); rein(y * w + w - 1); }
  while (qh < qt){ const k = q[qh++], x = k % w; if (x > 0) rein(k - 1); if (x < w - 1) rein(k + 1); if (k >= w) rein(k - w); if (k < w * (h - 1)) rein(k + w); }

    KI.status = err.code === "not_granted" ? "KI wurde nicht erlaubt. Angaben bitte von Hand eintragen." : err.code === "rate_limited" ? "Gerade zu viele Anfragen. Gleich noch einmal versuchen." : "KI gerade nicht erreichbar. Angaben bitte von Hand eintragen.";
    if (err.code === "not_granted") KI.sample = null;
  }
  KI.laeuft = false; if (S.view === "artikel-edit") renderSheet();
}

/* ===== Vollbild ===== */
let lbOpener = null, lbListe = [], lbI = 0;
function oeffneLightbox(liste, i){
  lbListe = liste; lbI = i; lbOpener = document.activeElement;
  zeigeLightbox(); $("#lightbox").hidden = false; $("#lb-zu").focus();
}
function zeigeLightbox(){
  const f = lbListe[lbI];
  $("#lb-inhalt").innerHTML = `<div class="lb-buehne"><img src="${esc(fotoUrl(f))}" alt="Foto ${lbI + 1} von ${lbListe.length}" class="${f.frei === false ? "foto-voll" : ""}"></div>`;
  $("#lb-zurueck").hidden = $("#lb-weiter").hidden = lbListe.length < 2;
  $("#lb-zahl").textContent = lbListe.length > 1 ? `${lbI + 1} / ${lbListe.length}` : "";
}
function schliesseLightbox(){ $("#lightbox").hidden = true; $("#lb-inhalt").innerHTML = ""; if (lbOpener && lbOpener.isConnected) lbOpener.focus(); lbOpener = null; }
$("#lb-zu").addEventListener("click", schliesseLightbox);
$("#lb-zurueck").addEventListener("click", () => { lbI = (lbI - 1 + lbListe.length) % lbListe.length; zeigeLightbox(); });
$("#lb-weiter").addEventListener("click", () => { lbI = (lbI + 1) % lbListe.length; zeigeLightbox(); });
$("#lightbox").addEventListener("click", e => { if (e.target.id === "lightbox" || e.target.classList.contains("lb-buehne")) schliesseLightbox(); });
document.addEventListener("keydown", e => {
  if ($("#lightbox").hidden) return;
  if (e.key === "Escape"){ e.stopImmediatePropagation(); schliesseLightbox(); }
  if (e.key === "ArrowRight" && lbListe.length > 1){ lbI = (lbI + 1) % lbListe.length; zeigeLightbox(); }
  if (e.key === "ArrowLeft" && lbListe.length > 1){ lbI = (lbI - 1 + lbListe.length) % lbListe.length; zeigeLightbox(); }
}, true);

async function speichereBuchung(){
  const b = S.b, f = $("#buchen-fehler"), aus = b.art === "ausgabe";
  const fehler = (t, feld) => { f.textContent = t; f.hidden = false; if (feld) $(feld)?.focus(); };
  const pos = []; for (const id of b.reihe) for (const [v, n] of Object.entries(b.pos[id] || {})) if (n > 0) pos.push({ id, v, n });
  if (!pos.length) return fehler("Bitte mindestens eine Menge eintragen.");
  if (aus && !b.an.trim()) return fehler("Bitte eintragen, an wen die Ausgabe geht.", "#f-an");
  if (!aus && !b.lieferant.trim()) return fehler("Bitte den Lieferanten eintragen.", "#f-lieferant");
  const k = leseKuerzel("bu");
  if (k.length < 2) return fehler("Bitte dein Kürzel mit 2 bis 3 Buchstaben eintragen.", "#kz-bu");
  const vid = uid(), am = new Date().toISOString(), datum = b.datum || heute();
  const vorgang = aus ? { art: "ausgabe", an: b.an.trim(), anlass: b.anlass.trim(), kostenstelle: b.kostenstelle || "", datum, am, kuerzel: k, notiz: b.notiz.trim(), geschaetzt: !!b.geschaetzt }
    : { art: "eingang", geschaetzt: !!b.geschaetzt, lieferant: b.lieferant.trim(), bestellnr: b.bestellnr.trim(), rechnungsnr: b.rechnungsnr.trim(), betrag: parseEuro(b.betrag), rechnung: b.rechnung, datum, am, kuerzel: k, notiz: b.notiz.trim() };
  const ekNeu = {}; if (!aus) for (const id of b.reihe){ const n = parseEuro(b.ek[id]); if (n > 0) ekNeu[id] = n; }
  S.busy = true; renderSheet();
  try {
    await Store.set("vorgaenge", vid, vorgang);
    await Promise.all(pos.map(p => { const a = artikelVon(p.id) || {};
      return Store.set("buchungen", uid(), { vorgangId: vid, artikelId: p.id, variante: p.v, menge: (aus ? -1 : 1) * p.n, art: vorgang.art, datum, am,
        ek: ekNeu[p.id] ?? ekVon(a), geschaetzt: !!b.geschaetzt, kostenstelle: aus ? (vorgang.kostenstelle || a.kostenstelle || "") : (a.kostenstelle || "") }); }));
    for (const [id, n] of Object.entries(ekNeu)){ const a = artikelVon(id); if (a && ekVon(a) !== n) await Store.update("artikel", id, { ek: n }); }
    S.busy = false; const n = pos.reduce((s, p) => s + p.n, 0);
    toast(aus ? `${zahl(n)} ausgegeben an ${vorgang.an}` : `${zahl(n)} eingebucht`);
    S.b = null; S.stack.length ? zurueck() : closeSheet();
  } catch (err){ S.busy = false; fehlerToast(err); renderSheet(); }
}

async function storniere(){
  const v = vorgangVon(S.open); if (!v) return;

  catch (err){ fehlerToast(err); }
}

  if (!diff.length) diff.push({ v: varianten(a)[0], d: 0 });

async function demoLaden(){
  try { const j = await (await fetch("demo/demo.json", { cache: "no-store" })).json(); for (const c of COLS){ S[c] = j[c] || []; ls.set(c, S[c]); } nachLaden(); toast("Demo-Daten geladen"); }
  catch { toast("Demo-Daten sind hier nicht verfügbar."); }
}
async function demoEntfernen(){
  S.busy = true; renderSheet();
  try { for (const c of ["kommentare", "buchungen", "vorgaenge", "artikel"]) for (const x of S[c].filter(y => y.demo)) await Store.del(c, x.id); toast("Demo-Daten entfernt"); }
  catch (err){ fehlerToast(err); }
  S.busy = false; closeSheet();
}

/* ===== Export als CSV ===== */
const csvZelle = x => { const s = String(x ?? ""); return /[";\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
const komma2 = n => (Math.round(Number(n || 0) * 100) / 100).toFixed(2).replace(".", ",");
const csv = zeilen => "﻿" + zeilen.map(z => z.map(csvZelle).join(";")).join("\r\n");
function exportDaten(art){
  if (art === "bestand"){
    const z = [["Artikel", "Artikelnummer", "Kategorie", "Marke", "Variante", "Bestand", "Einheit", "EK netto", "Bestandswert netto", "MwSt %", "Sachkonto", "Kostenstelle", "Mindestbestand", "Lagerort", "Lieferant", "Im Shop", "Mitarbeiterpreis"]];
    for (const a of aktive().sort((x, y) => x.name.localeCompare(y.name, "de"))) for (const v of varianten(a)){ const n = bestand(a.id, v), ek = ekVon(a);
      z.push([a.name, a.artikelnr, a.kategorie, a.marke, v, n, einheit(a), komma2(ek), komma2(Math.max(0, n) * ek), a.mwst ?? "", a.sachkonto, a.kostenstelle, a.mindest || "", a.lagerort, a.lieferant, a.shop?.aktiv ? "ja" : "nein", a.shop?.aktiv ? komma2(a.shop.preis || ek) : ""]); }
    return { name: `Marketing-Lager-Bestand-${heute()}.csv`, data: csv(z) };
  }
  if (art === "buchhaltung"){
    const z = [["Belegdatum", "Art", "Empfänger / Lieferant", "Anlass", "Bestellnummer", "Rechnungsnummer", "Rechnung", "Artikel", "Artikelnummer", "Variante", "Menge", "Einheit", "EK netto", "Wert netto", "MwSt %", "Sachkonto", "Kostenstelle", "Kürzel", "Vorgang"]];
    const vs = [...S.vorgaenge].sort((x, y) => (x.datum || "").localeCompare(y.datum || ""));
    for (const v of vs) for (const b of buchungenVon(v.id)){
      const a = artikelVon(b.artikelId) || {}, m = Number(b.menge || 0), ek = Number(b.ek ?? ekVon(a)) || 0;
      z.push([fmt(v.datum), ART[v.art]?.label || v.art, v.art === "eingang" ? v.lieferant : v.an, v.anlass || "", v.bestellnr || "", v.rechnungsnr || "", v.rechnung || "", a.name || "Gelöschter Artikel", a.artikelnr || "", b.variante, m, einheit(a), komma2(ek), komma2(m * ek), a.mwst ?? "", a.sachkonto || "", b.kostenstelle || v.kostenstelle || a.kostenstelle || "", v.kuerzel, v.id]);
    }
    return { name: `Marketing-Lager-Buchhaltung-${heute()}.csv`, data: csv(z) };
  }
  const z = [art === "ausgabe" ? ["Datum", "An", "Wofür", "Kostenstelle", "Artikel", "Variante", "Menge", "Einheit", "Kürzel", "Notiz"] : ["Datum", "Lieferant", "Bestellnummer", "Rechnungsnummer", "Rechnungsbetrag", "Rechnung", "Artikel", "Variante", "Menge", "Einheit", "Kürzel"]];
  for (const v of S.vorgaenge.filter(x => x.art === art).sort((x, y) => (x.datum || "").localeCompare(y.datum || ""))) for (const b of buchungenVon(v.id)){
    const a = artikelVon(b.artikelId) || {}, m = Math.abs(Number(b.menge || 0));
    z.push(art === "ausgabe" ? [fmt(v.datum), v.an, v.anlass, b.kostenstelle || v.kostenstelle || "", a.name, b.variante, m, einheit(a), v.kuerzel, v.notiz]
      : [fmt(v.datum), v.lieferant, v.bestellnr, v.rechnungsnr, v.betrag ? String(v.betrag).replace(".", ",") : "", v.rechnung || "", a.name, b.variante, m, einheit(a), v.kuerzel]);
  }
  return { name: `Marketing-Lager-${art === "ausgabe" ? "Ausgaben" : "Eingaenge"}-${heute()}.csv`, data: csv(z) };
}
async function exportieren(art){
  const d = exportDaten(art);
  let dl = null; try { dl = window.claude?.use ? await window.claude.use("downloads") : null; } catch {}
  if (dl){ try { await dl.save({ filename: d.name, data: new Blob([d.data], { type: "text/csv;charset=utf-8" }) }); return; } catch (e){ if (e?.code === "declined") return; } }
  if (!IM_ARTIFACT){ const u = URL.createObjectURL(new Blob([d.data], { type: "text/csv;charset=utf-8" })), l = document.createElement("a"); l.href = u; l.download = d.name; document.body.appendChild(l); l.click(); l.remove(); setTimeout(() => URL.revokeObjectURL(u), 4000); return; }
  try { await navigator.clipboard.writeText(d.data.slice(1)); toast("Tabelle kopiert. In Excel einfügen."); } catch { toast("Export ist hier nicht möglich."); }
}

let toastT;
function toast(msg){ const t = $("#toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("on"), 2600); }
function fehlerToast(e){
  const c = e?.code;
  toast(c === "invalid_argument" ? "Keine Schreibrechte. Bitte um Freigabe als Mitwirkende:r bitten." : c === "quota_exceeded" ? "Speicher voll. Alte Vorgänge exportieren und löschen." : "Speichern fehlgeschlagen. Bitte noch einmal versuchen.");
}

  if (d.fotoEdit !== undefined){ oeffneLightbox(S.edit.fotos, Number(d.fotoEdit)); return; }

  if (d.fotoVor !== undefined){ const f = S.edit.fotos.slice(), [x] = f.splice(Number(d.fotoVor), 1); S.edit.fotos = [x, ...f]; return renderSheet(); }

  if (d.buchen){ const art = d.buchen, mit = d.mit; S.b = neueBuchung(art, mit); return openSheet("buchen"); }
  if (t.hasAttribute("data-neu-artikel")) return openSheet("artikel-edit", { edit: neuerEntwurf() });
  // Artikel bearbeiten
  if (d.wahl){ S.edit[d.wahl] = d.wahl === "mwst" ? Number(d.wert) : d.wert; (S.edit.beruehrt ||= {})[d.wahl] = true; D.querySelectorAll(`[data-wahl="${d.wahl}"]`).forEach(x => x.setAttribute("aria-pressed", String(x === t))); return; }

  menueEl.innerHTML = `<p class="etikett menue-etikett">Darstellung</p>
    ${[["system", "Wie System"], ["hell", "Hell"], ["dunkel", "Dunkel"]].map(([x, l]) => `<button role="menuitemradio" aria-checked="${m === x}" data-modus="${x}"><span>${l}</span>${m === x ? ICON.haken : ""}</button>`).join("")}

    <p class="etikett menue-etikett">Als Tabelle sichern</p>
    <button role="menuitem" data-export="bestand"><span>Bestand</span></button>
    <button role="menuitem" data-export="ausgabe"><span>Ausgabeliste</span></button>
    <button role="menuitem" data-export="eingang"><span>Eingänge und Rechnungen</span></button>
    <button role="menuitem" data-export="buchhaltung"><span>Buchhaltung: alle Bewegungen mit Wert</span></button>

    <button role="menuitem" data-menue="kuerzel"><span>Mein Kürzel</span>${k ? `<span class="meta kuerzel-text">${esc(k)}</span>` : ""}</button>
    ${hatDemo() ? `<div class="menue-linie" role="separator"></div><button role="menuitem" data-menue="demo"><span>Demo-Daten entfernen</span></button>` : ""}`;
}
function menue(offen){
  if (offen) renderMenue();
  menueEl.hidden = !offen; menueTaste.setAttribute("aria-expanded", offen);
  if (offen) (menueEl.querySelector('[aria-checked="true"]') || menueEl.querySelector("button")).focus();
}
menueTaste.addEventListener("click", () => menue(menueEl.hidden));
menueEl.addEventListener("click", e => {
  e.stopPropagation();
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.modus){ setzeModus(b.dataset.modus); renderMenue(); menueEl.querySelector(`[data-modus="${b.dataset.modus}"]`).focus(); return; }
  if (b.dataset.export){ menue(false); exportieren(b.dataset.export); }

menueEl.addEventListener("keydown", e => {
  const items = [...menueEl.querySelectorAll("button")], i = items.indexOf(document.activeElement);
  if (e.key === "ArrowDown"){ items[(i + 1) % items.length].focus(); e.preventDefault(); }
  if (e.key === "ArrowUp"){ items[(i - 1 + items.length) % items.length].focus(); e.preventDefault(); }
  if (e.key === "Tab" || e.key === "Escape") menue(false);
});

function setFilter(offen){
  offen = offen && miniAn; miniTaste.setAttribute("aria-expanded", offen);
  if (offen && !leiste.classList.contains("schwebend")){ platz.style.height = platz.offsetHeight + "px"; leiste.classList.add("schwebend"); }
  if (!offen && leiste.classList.contains("schwebend")){ leiste.classList.remove("schwebend"); platz.style.height = ""; }
}
function pruefeMini(){
  const an = platz.getBoundingClientRect().bottom < 0;
  if (an === miniAn) return;
  miniAn = an; mini.classList.toggle("on", an); mini.setAttribute("aria-hidden", String(!an));
  miniTaste.tabIndex = an ? 0 : -1; $("#mini-ausgabe").tabIndex = an ? 0 : -1;
  if (!an) setFilter(false);
}
miniTaste.addEventListener("click", () => setFilter(miniTaste.getAttribute("aria-expanded") !== "true"));
document.addEventListener("keydown", e => { if (e.key === "Escape" && !S.view && leiste.classList.contains("schwebend")){ setFilter(false); miniTaste.focus(); } });
window.addEventListener("scroll", pruefeMini, { passive: true });
window.addEventListener("resize", pruefeMini, { passive: true });

/* ===== Start ===== */
renderFilter(); render(); verbinde();
if (!IM_ARTIFACT && "serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
